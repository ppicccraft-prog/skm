  { l: "Nomor RAB", v: "no" }, { l: "Tanggal pengajuan", v: "tglPengajuan" },
  { l: "Nomor PO Odoo", v: "poOdoo" }, { l: "Pagu dari brief", v: "pagu" }, { l: "Pagu awal sebelum revisi", v: "paguDari" },
  { l: "Alasan kenaikan pagu", v: "alasanPagu" },
  { l: "Divisi", v: "divisi" }, { l: "Brand", v: "brand" }, { l: "PIC", v: "pic" }, { l: "Nama kegiatan", v: "nama" },
  { l: "Jenis kegiatan", v: "jenis" }, { l: "Tanggal mulai kegiatan", v: "tglKegiatan" },
  { l: "Tanggal selesai kegiatan", v: "tglSelesai" },
  { l: "Kota kegiatan", v: "lokasi" }, { l: "Detail lokasi", v: "lokasiRinci" },
  { l: "Total RAB", v: "total" }, { l: "Kebutuhan uang muka", v: "uangMuka" },
  { l: "Total dibayar ke PIC", v: "kePic" }, { l: "Total dibayar ke vendor", v: "keVendor" },
  { l: "Realisasi pembayaran dicatat SKM", v: "realBayar" },
  { l: "Item sudah dikonfirmasi dibayar", v: (r) => `${r.lunasCount || 0} / ${(r.lines || []).length}` },
  { l: "Item menunggu konfirmasi SKM", v: "menungguKonfirmasi" },
  { l: "Status kesiapan kegiatan", v: (r) => r.siapJalan ? "Siap jalan" : (r.menungguKonfirmasi > 0 ? "Menunggu konfirmasi SKM" : "Belum siap") },
  { l: "Status pembanding harga", v: "statusBanding" },
  { l: "Status approval", v: (r) => (r.approvals || []).map((a) => `${a.role}:${a.decision}`).join(" | ") },
  { l: "Status RAB", v: "status" },
  { l: "Dana sudah cair (pengajuan)", v: "cair" },
  { l: "Uang muka masih terbuka", v: "uangMukaTerbuka" },
  { l: "Status LPJ", v: "statusLPJ" },
  { l: "Catatan untuk team lapangan", v: "catatanPIC" }, { l: "Catatan untuk FAT", v: "catatanFAT" },
  { l: "Riwayat perubahan", v: "riwayat" },
  { l: "Alokasi crew", v: (r) => (r.crew || []).map((c) => `${c.nama} (${c.peran}${c.hari ? `, ${c.hari} hari` : ""})`).join("; ") },
  { l: "Link folder Drive", v: "linkDrive" }, { l: "Kode kegiatan", v: (r) => kodeKegiatan(r) },
  { l: "Update terakhir", v: "updated" }, { l: "PIC follow up", v: "followUp" },
  { l: "Aging LPJ (hari)", v: "aging" }, { l: "Total realisasi LPJ", v: "realisasi" },
  { l: "Flag overbudget", v: (r) => (r.overbudget ? "YA" : "") },
  { l: "Flag perlu eskalasi", v: (r) => (r.perluEskalasi ? "YA" : "") },
  { l: "Flag pagu dinaikkan", v: (r) => (r.paguNaik ? "YA" : "") },
  { l: "Flag LPJ lewat waktu", v: (r) => (r.agingOverdue ? "YA" : "") },
];

/* ========================= DASHBOARD ========================= */

function Dashboard({ M, rows, go, openRab, kosong, onDemo }) {
  const T = ({ v, l, h, tone, on }) => (
    <button className={`tile ${Number(v) === 0 || v === "Rp0" ? "zero" : tone || ""}`} onClick={on}>
      <div className="v">{v}</div><div className="l">{l}</div><div className="h">{h}</div>
    </button>
  );
  const hanging = rows.filter((r) => r.agingOverdue || r.overbudget || r.perluEskalasi)
    .sort((a, b) => b.aging - a.aging).slice(0, 6);
  return (
    <>
      <div className="cluster">
        <div className="cluster-h"><h2>Alur RAB</h2><em>Fase 1–2 · rencana sampai approval</em></div>
        <div className="tiles">
          <T v={M.masukBulanIni} l="RAB masuk bulan ini" h="SKM" on={() => go("rab")} />
          <T v={M.briefBelumRAB} l="Brief belum jadi RAB" h="SKM" tone="warn" on={() => go("brief")} />
          <T v={M.tungguPIC} l="Menunggu data PIC" h="PIC Sales / Marketing" tone="warn" on={() => go("rab")} />
          <T v={M.tungguApproval} l="Menunggu approval" h="Atasan Divisi / FAT" tone="warn" on={() => go("rab")} />
          <T v={M.approved} l="RAB approved" h="Siap jalan" tone="good" on={() => go("rab")} />
          <T v={M.ditolak} l="Rejected / cancelled" h="Ditutup" on={() => go("rab")} />
        </div>
      </div>

      <div className="cluster">
        <div className="cluster-h"><h2>Uang</h2><em>Fase 3 · pencairan sampai pertanggungjawaban</em></div>
        <div className="tiles">
          <T v={rp(M.nilaiApproved)} l="Nilai RAB approved" h="Atasan FAT" on={() => go("laporan")} />
          <T v={rp(M.totalRealisasi)} l="Total realisasi dari LPJ" h="Atasan FAT" on={() => go("lpj")} />
          <T v={rp(M.uangMukaTerbuka)} l="Uang muka terbuka" h="PIC penerima dana" tone="warn" on={() => go("dana")} />
          <T v={M.overbudget} l="RAB overbudget" h="Atasan FAT" tone="bad" on={() => go("lpj")} />
          <T v={M.perluKonfirmasi} l="Item dibayar, menunggu konfirmasi SKM" h="SKM" tone="warn" on={() => go("rab")} />
          <T v={M.siapJalan} l="Kegiatan siap dijalankan" h="PIC" tone="good" on={() => go("rab")} />
          <T v={M.biayaTanpaRAB} l="Biaya tanpa nomor RAB" h="SKM" tone="bad" on={() => go("eskalasi")} />
          <T v={M.tempoDekat} l="Pembayaran jatuh tempo ≤7 hari" h="Finance AP" tone="warn" on={() => go("rab")} />
          <T v={M.tempoLewat} l="Pembayaran lewat jatuh tempo" h="Finance AP" tone="bad" on={() => go("rab")} />
          <T v={M.itemTanpaPenawaran} l="Item biaya tanpa penawaran" h="SKM" tone="warn" on={() => go("rab")} />
        </div>
      </div>

      <div className="cluster">
        <div className="cluster-h"><h2>Dokumen</h2><em>Fase 5–6 · LPJ, klaim, eskalasi</em></div>
        <div className="tiles">
          <T v={M.lpjWaiting} l="LPJ ditunggu" h="PIC Sales / Marketing" tone="warn" on={() => go("lpj")} />
          <T v={M.lpjOverdue} l="LPJ lewat batas waktu" h="PIC + SKM" tone="bad" on={() => go("lpj")} />
          <T v={M.klaimTerbuka} l="Klaim distributor terbuka" h="SKM" tone="warn" on={() => go("klaim")} />
          <T v={M.klaimAR} l="Klaim perlu validasi AR" h="AR" tone="warn" on={() => go("klaim")} />
          <T v={M.eskalasiTerbuka} l="Eskalasi menunggu keputusan" h="Atasan FAT" tone="bad" on={() => go("eskalasi")} />
        </div>
      </div>

      <div className="sectionbar"><h2>Yang paling lama menggantung</h2>
        <span>Diurutkan dari aging LPJ terpanjang</span></div>
      {hanging.length === 0 ? (
        <div className="empty">
          <h3>{kosong ? "Belum ada data sama sekali" : "Tidak ada pekerjaan tertahan"}</h3>
          <p>{kosong
            ? "Muat contoh data untuk melihat papan kerja ini terisi — lengkap dengan kasus overbudget, LPJ lewat waktu, dan klaim yang menunggu AR."
            : "Semua RAB berjalan sesuai jalur. Kalau ini terasa terlalu sepi, cek apakah data sudah masuk."}</p>
          {kosong && <button className="btn" onClick={onDemo}>Muat contoh data</button>}
        </div>
      ) : (
        <div className="tablewrap">
          <table className="t">
            <thead><tr><th>Nomor RAB</th><th>Kegiatan</th><th>PIC</th><th>Tertahan di</th>
              <th style={{ textAlign: "right" }}>Aging</th><th>Flag</th></tr></thead>
            <tbody>
              {hanging.map((r) => (
                <tr key={r.no} onClick={() => openRab(r.no)}>
                  <td className="rabkey">{r.no}</td>
                  <td>{r.nama}</td><td>{r.pic}</td>
                  <td><Pill s={r.status} /></td>
                  <td className="num">{r.aging} hari</td>
                  <td>
                    {r.overbudget && <span className="flag">OVERBUDGET</span>}
                    {r.agingOverdue && <span className="flag">LPJ LEWAT</span>}
                    {r.perluEskalasi && <span className="flag">ESKALASI</span>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </>
  );
}

/* ========================= MASTER RAB ========================= */

function RabList({ rows, q, setQ, fStatus, setFStatus, canRab, canRabNew, briefs, onNew, onOpen, onExport,
  sel, toggleSel, toggleAll, onBulkDelete, countTerkait, onDemo, terkunciRAB, telatSaya, sla }) {
  const filtered = rows.filter((r) =>
    (!fStatus || r.status === fStatus) &&
    (!q || `${r.no} ${r.nama} ${r.pic} ${r.divisi} ${r.lokasi}`.toLowerCase().includes(q.toLowerCase())));
  const ids = filtered.map((r) => r.no);
  const semua = ids.length > 0 && ids.every((i) => sel.includes(i));
  return (
    <>
      {terkunciRAB && (
        <div className="note" style={{ borderLeftColor: "#B03E28", background: "#FBEDEA" }}>
          Pembuatan RAB baru dikunci. Anda masih punya {telatSaya.length} LPJ yang lewat batas waktu {sla} hari:{" "}
          {telatSaya.map((x) => x.no).join(", ")}. Kunci terbuka sendiri begitu LPJ tersebut selesai diverifikasi.
        </div>
      )}
      <div className="toolbar">
        <input placeholder="Cari nomor RAB, kegiatan, PIC…" value={q} onChange={(e) => setQ(e.target.value)} />
        <select value={fStatus} onChange={(e) => setFStatus(e.target.value)}>
          <option value="">Semua status RAB</option>
          {ST_RAB.map((s) => <option key={s} value={s}>{s}</option>)}
        </select>
        <div className="spacer" />
        {canRab && sel.length > 0 && (
          <>
            <span style={{ fontSize: 12.5, color: "#66757C" }}>
              {sel.length} dipilih{countTerkait(sel) ? ` · ${countTerkait(sel)} dokumen terkait` : ""}
            </span>
            <button className="btn ghost sm" onClick={() => toggleAll([])}>Batal pilih</button>
            <button className="btn no sm" onClick={onBulkDelete}>Hapus {sel.length} RAB</button>
          </>
        )}
        <button className="btn ghost sm" onClick={onExport}>Export CSV</button>
        {canRabNew && <button className="btn sm" onClick={onNew}>Buat RAB</button>}
      </div>
      {rows.length === 0 ? (
        <div className="empty"><h3>Belum ada RAB</h3>
          <p>Mulai dari brief kegiatan yang masuk dari PIC, atau buat RAB langsung kalau briefnya sudah lewat WhatsApp. Belum siap memasukkan data asli? Muat contoh dulu untuk melihat bentuk jadinya.</p>
          <div className="actions" style={{ justifyContent: "center" }}>
            {canRabNew && <button className="btn" onClick={onNew}>Buat RAB pertama</button>}
            <button className="btn ghost" onClick={onDemo}>Muat contoh data</button>
          </div></div>
      ) : (
        <div className="tablewrap">
          <table className="t">
            <thead><tr>
              {canRab && <th style={{ width: 34 }}>
                <input type="checkbox" checked={semua} onChange={() => toggleAll(ids)}
                  aria-label="Pilih semua RAB yang tampil" /></th>}
              <th>Nomor RAB</th><th>Kegiatan</th><th>Divisi / PIC</th><th>Progres</th>
              <th style={{ textAlign: "right" }}>Total RAB</th><th style={{ textAlign: "right" }}>Realisasi</th>
              <th>Status RAB</th><th>Status LPJ</th><th>Flag</th>
            </tr></thead>
            <tbody>
              {filtered.map((r) => (
                <tr key={r.no} onClick={() => onOpen(r.no)}
                  style={sel.includes(r.no) ? { background: "#FBF3DE" } : undefined}>
                  {canRab && (
                    <td onClick={(e) => e.stopPropagation()}>
                      <input type="checkbox" checked={sel.includes(r.no)} onChange={() => toggleSel(r.no)}
                        aria-label={`Pilih ${r.no}`} /></td>
                  )}
                  <td className="rabkey">{r.no}<div style={{ fontSize: 11, color: "#66757C" }}>{r.tglPengajuan}</div></td>
                  <td>{r.nama}<div style={{ fontSize: 11.5, color: "#66757C" }}>
                    {r.brand ? `${r.brand} · ` : ""}{r.lokasi} · {r.tglKegiatan}</div></td>
                  <td>{r.divisi}<div style={{ fontSize: 11.5, color: "#66757C" }}>{r.pic}</div></td>
                  <td style={{ minWidth: 120 }}><Spine rab={r} rel={r.rel} mini /></td>
                  <td className="num">{rp(r.total)}</td>
                  <td className="num">{r.realisasi ? rp(r.realisasi) : "—"}</td>
                  <td><Pill s={r.status} /></td>
                  <td><Pill s={r.statusLPJ} /></td>
                  <td>
                    {r.overbudget && <span className="flag">OB</span>}
                    {r.agingOverdue && <span className="flag">LPJ</span>}
                    {r.perluEskalasi && <span className="flag">ESK</span>}
                    {r.paguNaik && <span className="flag">PAGU</span>}
                    {terkunciRab(r) && <span className="pill p-go">Kunci</span>}
                    {r.menungguKonfirmasi > 0 && <span className="flag">KONFIRMASI</span>}
                    {r.siapJalan && !/Closed|Cancelled/.test(r.status || "") &&
                      <span className="pill p-go">Siap jalan</span>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </>
  );
}

/* ========================= FORM RAB + ITEM BIAYA ========================= */

function RabForm({ rec, data, cfg, onClose, onSave }) {
  const [v, setV] = useState({ ...rec, lines: rec.lines || [] });
  const [err, setErr] = useState("");
  const [buka, setBuka] = useState(-1);
  const set = (k, val) => setV((p) => ({ ...p, [k]: val }));
  const total = v.lines.reduce((s, l) => s + (Number(l.qty) || 0) * (Number(l.harga) || 0), 0);
  const tier = tierOf(total);
  const setLine = (i, k, val) => setV((p) => {
    const lines = [...p.lines]; lines[i] = { ...lines[i], [k]: val }; return { ...p, lines };
  });
  const addLine = () => setV((p) => {
    const lines = [...p.lines, { item: "", kategori: "", qty: 1, satuan: "unit", harga: 0,
      caraBayar: "", vendor: "", rekening: "", linkPenawaran: DRIVE_LINK_DEFAULT, linkVendor: "", termin: "",
      jatuhTempo: "", catatan: "" }];
    setBuka(lines.length - 1);
    return { ...p, lines };
  });
  const delLine = (i) => setV((p) => ({ ...p, lines: p.lines.filter((_, x) => x !== i) }));
  const preview = v.no || (v.divisi ? nextRabNo(data.rabs, v.divisi, v.tglPengajuan) : "— pilih divisi dulu —");
  const kePic = v.lines.filter((l) => l.caraBayar === "Dibayar ke PIC")
    .reduce((a, l) => a + (Number(l.qty) || 0) * (Number(l.harga) || 0), 0);
  const keVendor = v.lines.filter((l) => l.caraBayar === "Dibayar ke Vendor")
    .reduce((a, l) => a + (Number(l.qty) || 0) * (Number(l.harga) || 0), 0);
  const belumBayar = v.lines.filter((l) => !l.caraBayar).length;
  const belumRek = v.lines.filter((l) => !String(l.rekening || "").trim()).length;
  const ctxRab = { sibuk: v.tglKegiatan
    ? crewSibuk(data.brief, data.rabs, v.tglKegiatan, v.tglSelesai, v.no || v.briefId) : {} };
  const pagu = Number(v.pagu) || 0;
  const lebih = pagu > 0 ? total - pagu : 0;
  const submit = () => {
    const miss = F.rab.filter((f) => f.req && !String(v[f.k] ?? "").trim());
    if (miss.length) { setErr(`Lengkapi dulu: ${miss.map((m) => m.l).join(", ")}.`); return; }
    if (!v.lines.length) { setErr("Tambahkan minimal satu item biaya — total RAB dihitung dari sini."); return; }
    if (cfg.poOdooWajib && !String(v.poOdoo || "").trim()) {
      setErr("Nomor PO Odoo wajib diisi. Aturan ini bisa diubah di menu Konfigurasi."); return;
    }
    if (cfg.paguKetat && lebih > 0 && !(v.paguNaik && String(v.alasanPagu || "").trim())) {
      setErr(`Total RAB ${rp(total)} melebihi pagu dari brief ${rp(pagu)}, selisih ${rp(lebih)}. ` +
        "Kurangi atau turunkan item biaya sampai masuk pagu. Kalau pagunya memang tidak realistis, " +
        "centang pengajuan kenaikan pagu dan isi alasannya.");
      return;
    }
    const out = { ...v };
    if (lebih > 0 && v.paguNaik) { out.paguDari = pagu; out.pagu = total; }
    onSave(out);
  };
  return (
    <>
      <div className="scrim" onClick={onClose} />
      <div className="drawer" role="dialog" aria-label="Form RAB">
        <div className="drawer-h">
          <div style={{ flex: 1 }}>
            <h2 style={{ fontSize: 17 }}>{v.no ? "Ubah RAB" : "RAB baru"}</h2>
            <div className="rabkey" style={{ marginTop: 3 }}>{preview}</div>
          </div>
          <button className="btn ghost sm" onClick={onClose}>Tutup</button>
          <button className="btn sm" onClick={submit}>Simpan RAB</button>
        </div>
        <div className="drawer-b">
          {err && <div className="note" style={{ borderLeftColor: "#B03E28", background: "#FBEDEA" }}>{err}</div>}

          {!v.no && (
            <div className="card">
              <h3>Ambil dari brief</h3>
              <select value={v.briefId || ""} onChange={(e) => {
                const b = data.brief.find((x) => x.id === e.target.value);
                if (!b) { set("briefId", ""); return; }
                /* Baris rute yang sudah punya kota + harga langsung disalin jadi item biaya —
                   pakai kunci yang sama dengan sinkronisasi konfirmasi GA, supaya nanti GA
                   memperbarui baris ini, bukan menduplikasinya. */
                const seedHotel = (b.rute || []).map((r, idx) => {
                  if (!r.kota || !(Number(r.harga) > 0)) return null;
                  return {
                    item: `Hotel — ${r.kota}`, kategori: "Akomodasi",
                    qty: malamRute(r), satuan: "malam",
                    harga: kamarAngka(r) * (Number(r.harga) || 0),
                    caraBayar: "Dibayar ke Vendor", vendor: r.hotel || "",
                    dariRute: `hotel-${b.id}-${idx}`, catatan: r.catatanGA || "",
                  };
                }).filter(Boolean);
                setV((p) => ({ ...p,
                  briefId: b.id, nama: b.nama, brand: b.brand, divisi: b.divisi, pic: b.pic,
                  jenis: b.jenis, tglKegiatan: b.tglKegiatan, tglSelesai: b.tglSelesai,
                  lokasi: b.lokasi, lokasiRinci: b.lokasiRinci, rute: b.rute || [],
                  estimasiPeserta: b.estimasiPeserta,
                  tujuan: b.tujuan, target: b.target,
                  crew: b.crew || [], kebutuhanLapangan: b.kebutuhanLapangan,
                  output: b.output, catatanPIC: b.catatanPIC,
                  uangMuka: b.uangMuka, pagu: Number(b.estimasiDana) || 0,
                  lines: [...(p.lines || []).filter((l) => !l.dariRute), ...seedHotel] }));
              }}>
                <option value="">— isi manual, tanpa brief —</option>
                {data.brief.filter((b) => !b.rabNo).map((b) =>
                  <option key={b.id} value={b.id}>{b.id} · {b.nama} ({b.pic})</option>)}
              </select>
              <span className="hint" style={{ fontSize: 11, color: "#66757C" }}>
                Seluruh data kegiatan — brand, kota, tujuan, target, alokasi crew, kebutuhan lapangan,
                catatan untuk team, dan estimasi dana sebagai pagu — ikut terisi dari brief. Baris rute
                yang sudah punya kota dan harga otomatis jadi item biaya "Hotel — [Kota]". Brief yang
                dipilih otomatis terkunci ke nomor RAB ini.
              </span>
            </div>
          )}

          <div className="card">
            <h3>Data kegiatan</h3>
            <div className="grid2">
              {F.rab.map((f) => (
                <Field key={f.k} f={f.k === "poOdoo" ? { ...f, req: cfg.poOdooWajib } : f}
                  val={v[f.k]} onChange={set} master={data.master} ctx={ctxRab} />
              ))}
            </div>
          </div>

          <div className="card">
            <h3>Item biaya (RAB Line)</h3>
            <table className="lines">
              <thead><tr>
                <th style={{ width: "24%" }}>Item biaya</th><th style={{ width: "16%" }}>Kategori</th>
                <th style={{ width: "8%" }}>Qty</th><th style={{ width: "10%" }}>Satuan</th>
                <th style={{ width: "13%" }}>Harga satuan</th><th style={{ width: "11%" }}>Total</th>
                <th style={{ width: "13%" }}>Dibayar ke</th><th style={{ width: "12%" }}>Vendor</th>
                <th style={{ width: "2%" }} />
              </tr></thead>
              <tbody>
                {v.lines.map((l, i) => {
                  const acuan = (data.master.priceList || []).find(
                    (x) => x.item.toLowerCase() === String(l.item || "").toLowerCase().trim());
                  const mahal = acuan && Number(l.harga) > Number(acuan.harga) * 1.1;
                  const lengkap = String(l.vendor || "").trim() && String(l.linkPenawaran || "").trim();
                  return (
                    <React.Fragment key={i}>
                      <tr>
                        <td><input value={l.item} onChange={(e) => setLine(i, "item", e.target.value)} placeholder="Backdrop 3x2 m" /></td>
                        <td><select value={l.kategori} onChange={(e) => setLine(i, "kategori", e.target.value)}>
                          <option value="">—</option>{KATEGORI_BIAYA.map((k) => <option key={k}>{k}</option>)}</select></td>
                        <td><input type="number" min="0" value={l.qty} onChange={(e) => setLine(i, "qty", e.target.value)} /></td>
                        <td><input value={l.satuan} onChange={(e) => setLine(i, "satuan", e.target.value)} /></td>
                        <td>
                          <input type="number" min="0" step="1000" value={l.harga}
                            style={mahal ? { borderColor: "#B03E28", background: "#FBEDEA" } : undefined}
                            onChange={(e) => setLine(i, "harga", e.target.value)} />
                          {mahal && <span style={{ fontSize: 10, color: "#B03E28" }}>
                            price list {rp(acuan.harga)}</span>}
                        </td>
                        <td className="mono" style={{ textAlign: "right", fontSize: 12 }}>
                          {num((Number(l.qty) || 0) * (Number(l.harga) || 0))}</td>
                        <td><select value={l.caraBayar || ""}
                          onChange={(e) => setLine(i, "caraBayar", e.target.value)}>
                          <option value="">— pilih —</option>
                          {CARA_BAYAR.map((x) => <option key={x} value={x}>
                            {x === "Dibayar ke Vendor" ? "Vendor" : "PIC"}</option>)}</select></td>
                        <td style={{ fontSize: 11.5, color: l.vendor ? "#14232C" : "#A9B4B0" }}>
                          {l.vendor || "belum diisi"}</td>
                        <td><button className="btn ghost sm" style={{ padding: "3px 7px" }}
                          onClick={() => setBuka(buka === i ? -1 : i)}
                          aria-label="Rincian vendor dan pembayaran">{buka === i ? "▾" : "▸"}</button></td>
                      </tr>
                      {buka === i && (
                        <tr>
                          <td colSpan={9} style={{ background: "#F7F8F5", padding: "12px 10px" }}>
                            <div className="grid2" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(210px,1fr))" }}>
                              <div className="f">
                                <label>Vendor / penyedia</label>
                                <input list="vendor-list" value={l.vendor || ""}
                                  onChange={(e) => setLine(i, "vendor", e.target.value)}
                                  placeholder="Nama vendor" />
                                <datalist id="vendor-list">
                                  {(data.master.vendors || []).map((x) => <option key={x} value={x} />)}
                                </datalist>
                              </div>
                              <div className="f">
                                <label>Link penawaran harga</label>
                                <input value={l.linkPenawaran || ""}
                                  onChange={(e) => setLine(i, "linkPenawaran", e.target.value)}
                                  placeholder="Link file quotation di Drive" />
                                <span className="hint" style={{ display: "block", marginTop: 4 }}>{DRIVE_LINK_HINT}</span>
                              </div>
                              <div className="f">
                                <label>Nomor rekening penerima</label>
                                <input value={l.rekening || ""}
                                  onChange={(e) => setLine(i, "rekening", e.target.value)}
                                  placeholder="Bank · nomor · atas nama" />
                                <span className="hint">
                                  {l.caraBayar === "Dibayar ke PIC"
                                    ? "Rekening PIC penerima uang muka."
                                    : "Rekening vendor tujuan pembayaran Finance AP."}
                                </span>
                              </div>
                              <div className="f">
                                <label>Link / kontak vendor</label>
                                <input value={l.linkVendor || ""}
                                  onChange={(e) => setLine(i, "linkVendor", e.target.value)}
                                  placeholder="Situs, katalog, atau nomor kontak" />
                              </div>
                              <div className="f">
                                <label>Dibayar ke</label>
                                <select value={l.caraBayar || ""}
                                  onChange={(e) => setLine(i, "caraBayar", e.target.value)}>
                                  <option value="">— pilih —</option>
                                  {CARA_BAYAR.map((x) => <option key={x}>{x}</option>)}
                                </select>
                                <span className="hint">
                                  {l.caraBayar === "Dibayar ke PIC"
                                    ? "Masuk hitungan uang muka PIC dan wajib dipertanggungjawabkan di LPJ."
                                    : l.caraBayar === "Dibayar ke Vendor"
                                      ? "Dibayar Finance AP langsung ke vendor berdasarkan invoice."
                                      : "Menentukan apakah biaya ini lewat uang muka PIC atau dibayar AP ke vendor."}
                                </span>
                              </div>
                              <div className="f">
                                <label>Termin pembayaran</label>
                                <select value={l.termin || ""} onChange={(e) => setLine(i, "termin", e.target.value)}>
                                  <option value="">— pilih —</option>
                                  {TERMIN.map((t) => <option key={t}>{t}</option>)}
                                </select>
                              </div>
                              <div className="f">
                                <label>Batas pembayaran</label>
                                <input type="date" value={l.jatuhTempo || ""}
                                  onChange={(e) => setLine(i, "jatuhTempo", e.target.value)} />
                                <span className="hint">Dipakai untuk mengingatkan Finance AP sebelum jatuh tempo.</span>
                              </div>
                              <div className="f">
                                <label>Catatan item</label>
                                <input value={l.catatan || ""} onChange={(e) => setLine(i, "catatan", e.target.value)}
                                  placeholder="Spesifikasi, risiko, syarat khusus" />
                              </div>
                            </div>
                            {!lengkap && (
                              <p style={{ fontSize: 11.5, color: "#9C7112", margin: "9px 0 0" }}>
                                Vendor dan link penawaran belum lengkap. Item tanpa penawaran tertulis
                                sulit dibela saat atasan FAT menanyakan dasar harganya.
                              </p>
                            )}
                          </td>
                        </tr>
                      )}
                    </React.Fragment>
                  );
                })}
                {!v.lines.length && (
                  <tr><td colSpan={9} style={{ color: "#66757C", padding: "10px 4px" }}>
                    Belum ada item biaya. Total RAB dihitung dari baris-baris ini.</td></tr>
                )}
              </tbody>
              <tfoot><tr>
                <td colSpan={5} style={{ textAlign: "right" }}>Total RAB</td>
                <td style={{ textAlign: "right" }}>{num(total)}</td>
                <td colSpan={3} style={{ fontFamily: "inherit", fontWeight: 400, fontSize: 11,
                  color: "#66757C", paddingLeft: 8, lineHeight: 1.5 }}>
                  Ke PIC {rp(kePic)} · Ke vendor {rp(keVendor)}
                  {belumBayar ? <span style={{ color: "#9C7112" }}> · {belumBayar} item belum ditentukan jalur bayarnya</span> : null}
                  {belumRek ? <span style={{ color: "#9C7112" }}> · {belumRek} item belum ada rekening</span> : null}
                </td>
              </tr></tfoot>
            </table>
            <div style={{ marginTop: 9, display: "flex", gap: 8, alignItems: "center" }}>
              <button className="btn ghost sm" onClick={addLine}>Tambah item</button>
              <span style={{ fontSize: 12, color: "#66757C" }}>
                Limit approval: <b>{tier.label}</b> → {tier.approvers.map((a) => ROLES[a].split(" (")[0]).join(" + ")}
              </span>
            </div>

            {pagu > 0 && (
              <div style={{ marginTop: 13, borderTop: "1px solid #E6E9E3", paddingTop: 11 }}>
                <dl className="kv" style={{ gridTemplateColumns: "190px 1fr" }}>
                  <dt>Pagu dari brief</dt><dd className="mono">{rp(pagu)}</dd>
                  <dt>Total item biaya</dt><dd className="mono">{rp(total)}</dd>
                  <dt>{lebih > 0 ? "Melebihi pagu" : "Sisa pagu"}</dt>
                  <dd className="mono" style={{ color: lebih > 0 ? "#B03E28" : "#1E6E5A", fontWeight: 600 }}>
                    {rp(Math.abs(lebih))}</dd>
                  {v.paguDari ? (<><dt>Pagu awal sebelum revisi</dt>
                    <dd className="mono">{rp(v.paguDari)}</dd></>) : null}
                </dl>

                {lebih > 0 && (
                  <>
                    <div className="note" style={{ borderLeftColor: "#B03E28", background: "#FBEDEA", marginTop: 11 }}>
                      RAB tidak bisa disimpan selama masih di atas pagu. Turunkan item biaya, atau ajukan
                      kenaikan pagu di bawah ini — kenaikan itu akan terlihat oleh atasan FAT sebagai tanda merah.
                    </div>
                    <label style={{ display: "flex", gap: 8, alignItems: "flex-start", fontSize: 13, marginTop: 4 }}>
                      <input type="checkbox" checked={!!v.paguNaik} style={{ marginTop: 3 }}
                        onChange={(e) => set("paguNaik", e.target.checked)} />
                      <span>Ajukan kenaikan pagu dari {rp(pagu)} menjadi {rp(total)}</span>
                    </label>
                    {v.paguNaik && (
                      <div className="f full" style={{ marginTop: 9 }}>
                        <label htmlFor="alasanPagu">Alasan kenaikan pagu <b>*</b></label>
                        <textarea id="alasanPagu" value={v.alasanPagu || ""}
                          onChange={(e) => set("alasanPagu", e.target.value)}
                          placeholder="Contoh: harga booth naik setelah quotation masuk, estimasi PIC memakai harga tahun lalu." />
                      </div>
                    )}
                  </>
                )}
              </div>
            )}
          </div>
        </div>
      </div>
    </>
  );
}

/* ========================= FORM LPJ (mengacu item RAB) ========================= */

function LpjForm({ rec, data, cfg, rabRows, onClose, onSave }) {
  const [v, setV] = useState(() => ({ ...rec, lines: rec.lines || [] }));
  const [err, setErr] = useState("");
  const set = (k, val) => setV((p) => ({ ...p, [k]: val }));
  const row = rabRows.find((r) => r.no === v.rabNo);
  const total = v.lines.reduce((a, x) => a + (Number(x.realisasi) || 0), 0);
  const totalRab = row ? row.total : 0;
  const selisih = totalRab - total;
  const ob = totalRab > 0 && total > totalRab;

  /* Pilih RAB → item biaya RAB ditarik apa adanya sebagai baris realisasi */
  const pilihRab = (no) => {
    const r = rabRows.find((x) => x.no === no);
    setV((p) => ({
      ...p, rabNo: no,
      pic: p.pic || (r ? r.pic : ""),
      tglKegiatan: p.tglKegiatan || (r ? r.tglKegiatan : ""),
      uangMuka: Number(p.uangMuka) || (r ? r.cair : 0),
      lines: r ? (r.lines || []).map((l) => ({
        item: l.item, kategori: l.kategori, satuan: l.satuan,
        qtyRab: l.qty, hargaRab: l.harga,
        rab: (Number(l.qty) || 0) * (Number(l.harga) || 0),
        realisasi: "", catatan: "", link: DRIVE_LINK_DEFAULT,
      })) : [],
    }));
  };
  const setLine = (i, k, val) => setV((p) => {
    const lines = [...p.lines]; lines[i] = { ...lines[i], [k]: val }; return { ...p, lines };
  });
  const addLine = () => setV((p) => ({ ...p,
    lines: [...p.lines, { item: "", kategori: "Lainnya", satuan: "lot", qtyRab: 0, hargaRab: 0,
      rab: 0, realisasi: "", catatan: "Biaya tambahan di luar RAB", link: DRIVE_LINK_DEFAULT }] }));
  const delLine = (i) => setV((p) => ({ ...p, lines: p.lines.filter((_, x) => x !== i) }));

  const submit = () => {
    const miss = F.lpj.filter((f) => f.req && !String(v[f.k] ?? "").trim());
    if (miss.length) { setErr(`Lengkapi dulu: ${miss.map((m) => m.l).join(", ")}.`); return; }
    if (!v.lines.length) { setErr("Belum ada item realisasi. Pilih nomor RAB agar item biayanya tertarik."); return; }
    if (cfg.linkFotoWajib && !String(v.linkFoto || "").trim()) {
      setErr("Link foto Google Drive wajib diisi supaya LPJ dianggap sah. Aturan ini bisa diubah di menu Konfigurasi.");
      return;
    }
    if (cfg.konklusiWajib && !String(v.konklusi || "").trim()) {
      setErr("Konklusi kegiatan wajib diisi. Bandingkan hasil dengan tujuan di brief: apa yang tercapai, " +
        "apa yang tidak, dan apa yang dipakai untuk kegiatan berikutnya. Konklusi ini yang diteruskan " +
        "ke Supply Chain sebagai bahan BI.");
      return;
    }
    if (ob && cfg.overbudget === "blokir") {
      setErr(`Total realisasi ${rp(total)} melebihi RAB ${rp(totalRab)} sebesar ${rp(total - totalRab)}. ` +
        "Konfigurasi sekarang menolak LPJ overbudget. Perbaiki realisasi, atau ubah kebijakan di menu Konfigurasi.");
      return;
    }
    const out = { ...v, realisasi: total };
    if (ob && cfg.overbudget === "pending") out.status = "Overbudget Review";
    else if (ob && cfg.overbudget === "reimburse") { out.status = "Submitted by PIC"; out.reimburse = total - totalRab; }
    else out.status = v.status || "Submitted by PIC";
    onSave(out);
  };

  return (
    <>
      <div className="scrim" onClick={onClose} />
      <div className="drawer" role="dialog" aria-label="Form LPJ">
        <div className="drawer-h">
          <div style={{ flex: 1 }}>
            <h2 style={{ fontSize: 17 }}>{v.id ? "Ubah LPJ" : "LPJ baru"}</h2>
            {row && <div className="rabkey" style={{ marginTop: 3 }}>{row.no} · {row.nama}</div>}
          </div>
          <button className="btn ghost sm" onClick={onClose}>Tutup</button>
          <button className="btn sm" onClick={submit}>Simpan LPJ</button>
        </div>
        <div className="drawer-b">
          {err && <div className="note" style={{ borderLeftColor: "#B03E28", background: "#FBEDEA" }}>{err}</div>}

          <div className="card">
            <h3>Kegiatan yang dipertanggungjawabkan</h3>
            <div className="f full">
              <label htmlFor="rabNo">Nomor RAB <b>*</b></label>
              <select id="rabNo" value={v.rabNo || ""} onChange={(e) => pilihRab(e.target.value)}>
                <option value="">— pilih nomor RAB —</option>
                {rabRows.map((r) => <option key={r.no} value={r.no}>{r.no} · {r.nama} · {rp(r.total)}</option>)}
              </select>
              <span className="hint">Item biaya RAB akan ditarik otomatis sebagai baris realisasi.</span>
            </div>
            <div className="grid2" style={{ marginTop: 11 }}>
              {F.lpj.filter((f) => !["rabNo", "status", "refOdoo", "catatanSKM", "catatanFAT"].includes(f.k))
                .map((f) => (
                  <Field key={f.k} f={f.k === "linkFoto" ? { ...f, req: cfg.linkFotoWajib } : f}
                    val={v[f.k]} onChange={set} master={data.master} ctx={{ sibuk: {} }} />
                ))}
            </div>
          </div>

          <div className="card">
            <h3>Realisasi per item</h3>
            {!v.lines.length && <p style={{ fontSize: 13, color: "#66757C", margin: 0 }}>
              Pilih nomor RAB dulu di atas.</p>}
            {v.lines.length > 0 && (
              <>
                <table className="lines">
                  <thead><tr>
                    <th style={{ width: "24%" }}>Item biaya</th>
                    <th style={{ width: "13%", textAlign: "right" }}>Nilai RAB</th>
                    <th style={{ width: "14%" }}>Realisasi</th>
                    <th style={{ width: "12%", textAlign: "right" }}>Selisih</th>
                    <th style={{ width: "15%" }}>Catatan</th>
                    <th style={{ width: "20%" }}>Link bukti Drive</th><th />
                  </tr></thead>
                  <tbody>
                    {v.lines.map((l, i) => {
                      const d = (Number(l.rab) || 0) - (Number(l.realisasi) || 0);
                      return (
                        <tr key={i}>
                          <td>{l.item
                            ? <span>{l.item}<br /><span style={{ fontSize: 11, color: "#66757C" }}>{l.kategori}</span></span>
                            : <input value={l.item} placeholder="Item tambahan"
                                onChange={(e) => setLine(i, "item", e.target.value)} />}</td>
                          <td className="mono" style={{ textAlign: "right" }}>{num(l.rab)}</td>
                          <td><input type="number" min="0" step="1000" value={l.realisasi}
                            onChange={(e) => setLine(i, "realisasi", e.target.value)} /></td>
                          <td className="mono" style={{ textAlign: "right",
                            color: d < 0 ? "#B03E28" : d > 0 ? "#1E6E5A" : "#66757C" }}>{num(d)}</td>
                          <td><input value={l.catatan || ""} placeholder="bila beda"
                            onChange={(e) => setLine(i, "catatan", e.target.value)} /></td>
                          <td><input value={l.link || ""} placeholder="opsional — link nota / foto"
                            onChange={(e) => setLine(i, "link", e.target.value)} />
                            <span className="hint" style={{ fontSize: 10, display: "block" }}>{DRIVE_LINK_HINT}</span></td>
                          <td><button className="btn ghost sm" onClick={() => delLine(i)} aria-label="Hapus baris">×</button></td>
                        </tr>
                      );
                    })}
                  </tbody>
                  <tfoot>
                    <tr>
                      <td style={{ textAlign: "right" }}>Total</td>
                      <td style={{ textAlign: "right" }}>{num(totalRab)}</td>
                      <td style={{ textAlign: "right" }}>{num(total)}</td>
                      <td style={{ textAlign: "right", color: selisih < 0 ? "#B03E28" : "#1E6E5A" }}>{num(selisih)}</td>
                      <td colSpan={3} style={{ fontFamily: "inherit", fontWeight: 400, fontSize: 11.5, color: "#66757C" }}>
                        {v.lines.filter((l) => String(l.link || "").trim()).length} dari {v.lines.length} item punya link bukti
                      </td>
                    </tr>
                  </tfoot>
                </table>
                <div style={{ marginTop: 9, display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                  <button className="btn ghost sm" onClick={addLine}>Tambah item di luar RAB</button>
                  <span style={{ fontSize: 12, color: "#66757C" }}>
                    Nilai tiap item boleh sama, kurang, atau lebih dari RAB. Yang dinilai adalah totalnya.
                  </span>
                </div>
              </>
            )}
          </div>

          {ob && (
            <div className="note" style={{ borderLeftColor: "#B03E28", background: "#FBEDEA" }}>
              <b>Realisasi melebihi RAB sebesar {rp(total - totalRab)}.</b>{" "}
              Kebijakan yang berlaku: <b>{OVERBUDGET_OPSI[cfg.overbudget].label}</b> —{" "}
              {OVERBUDGET_OPSI[cfg.overbudget].ringkas}
            </div>
          )}

          {row && (
            <div className="card">
              <h3>Pembanding</h3>
              <dl className="kv">
                <dt>Total RAB disetujui</dt><dd className="mono">{rp(totalRab)}</dd>
                <dt>Total realisasi</dt><dd className="mono">{rp(total)}</dd>
                <dt>{selisih < 0 ? "Melebihi RAB" : "Hemat"}</dt>
                <dd className="mono" style={{ color: selisih < 0 ? "#B03E28" : "#1E6E5A", fontWeight: 600 }}>
                  {rp(Math.abs(selisih))}</dd>
                <dt>Dana sudah cair ke PIC</dt><dd className="mono">{rp(row.cair)}</dd>
                <dt>Sisa dana harus dikembalikan</dt>
                <dd className="mono">{rp(Math.max(0, (Number(v.uangMuka) || 0) - total))}</dd>
              </dl>
            </div>
          )}
        </div>
      </div>
    </>
  );
}

/* ========================= DETAIL RAB ========================= */

            </div>
          </div>

              {bisaLanjut
                ? "RAB ini sudah disetujui, jadi terkunci untuk PIC. Anda masih bisa mengubahnya, tetapi begitu nilainya berubah, seluruh approval dibatalkan dan RAB kembali ke status Revisi."

            <div style={{ display: "flex", gap: 7, marginTop: 10, flexWrap: "wrap" }}>
              <Pill s={r.status} /><Pill s={r.statusLPJ} />
              {r.overbudget && <span className="flag">OVERBUDGET</span>}
              {r.agingOverdue && <span className="flag">LPJ LEWAT {r.aging} HARI</span>}
              {r.perluEskalasi && <span className="flag">PERLU ESKALASI</span>}
              {r.paguNaik && <span className="flag">PAGU DINAIKKAN</span>}
              {r.revisiSetelahApproval ? <span className="flag">DIREVISI SETELAH APPROVAL</span> : null}
              {terkunci && <span className="pill p-go">Terkunci</span>}
            </div>
          </div>

          <div className="card">
            <h3>Angka</h3>
            <dl className="kv">
              <dt>Total RAB</dt><dd className="mono">{rp(r.total)}</dd>

              {r.alasanPagu ? (<><dt>Alasan kenaikan pagu</dt><dd>{r.alasanPagu}</dd></>) : null}
              <dt>Dibayar ke PIC (uang muka)</dt><dd className="mono">{rp(r.kePic)}</dd>
              <dt>Dibayar Finance AP ke vendor</dt><dd className="mono">{rp(r.keVendor)}</dd>

              <dt>Dana sudah cair</dt><dd className="mono">{rp(r.cair)}</dd>
              <dt>Total realisasi (LPJ)</dt><dd className="mono">{r.realisasi ? rp(r.realisasi) : "belum ada LPJ"}</dd>
              <dt>Selisih RAB − realisasi</dt>
              <dd className="mono" style={{ color: r.overbudget ? "#B03E28" : undefined }}>

              <dt>Limit approval</dt><dd>{r.tier.label} → {rantai.map((a) => a === "SKM" ? "Pemeriksaan SKM" : ROLES[a].split(" (")[0]).join(" + ")}</dd>
              <dt>Kode kegiatan</dt><dd className="mono">{kodeKegiatan(r)}</dd>

                        <td className="mono" style={{ textAlign: "right" }}>{l.qty} {l.satuan}</td>

                                style={{ color: "#2A5D8F" }}>Buka</a>
                            : <span className="flag">TIDAK ADA</span>}
                          {l.diperiksa
                            ? <div style={{ fontSize: 10, color: "#1E6E5A" }}>diperiksa SKM</div>
                            : <div style={{ fontSize: 10, color: "#9C7112" }}>belum diperiksa</div>}
                          {l.catatanPeriksa
                            ? <div style={{ fontSize: 10, color: "#66757C" }}>{l.catatanPeriksa}</div>
                            : null}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
                <tfoot><tr><td colSpan={3} style={{ textAlign: "right" }}>Total</td>
                  <td style={{ textAlign: "right" }}>{num(r.total)}</td><td colSpan={3} /></tr></tfoot>
              </table>
            </div>
          )}

          {(r.lines || []).length > 0 && r.siapJalan && !/Closed|Cancelled/.test(r.status || "") && (
            <div className="note" style={{ borderLeftColor: "#1E6E5A", background: "#EDF5F1" }}>
              <b style={{ display: "block", marginBottom: 3 }}>Dana sudah cair — kegiatan boleh dijalankan</b>
              Seluruh {r.lines.length} item biaya sudah dikonfirmasi dibayar oleh SKM. {r.pic} bisa mulai
              menjalankan kegiatan sesuai brief, dan wajib menyimpan nota serta dokumentasi untuk LPJ
              paling lambat {sla} hari setelah kegiatan selesai.
            </div>
          )}

          {(r.lines || []).length > 0 && (
            <div className="card">
              <h3>Realisasi pembayaran</h3>
              <p style={{ fontSize: 12.5, color: "#66757C", margin: "0 0 11px", lineHeight: 1.5 }}>
                Diisi SKM setelah pembayaran dilakukan. Angka ini yang dipakai sebagai realisasi RAB,
                dan penanda di kalender berubah menjadi “sudah dibayar”.
              </p>
              <dl className="kv" style={{ marginBottom: 11 }}>
                <dt>Total RAB</dt><dd className="mono">{rp(r.total)}</dd>
                <dt>Realisasi tercatat</dt><dd className="mono">{rp(totalReal)}</dd>
                <dt>Item sudah dibayar</dt>
                <dd className="mono">{sudahBayar} dari {r.lines.length}</dd>

              {r.menungguKonfirmasi > 0 && bisaRealisasi && !real && (

                </div>

                <>

                    <thead><tr><th style={{ width: "24%" }}>Item</th>

                      <th style={{ width: "17%" }}>Realisasi dibayar</th>

                          <td className="mono" style={{ textAlign: "right" }}>
                            {num((Number(l.qty) || 0) * (Number(l.harga) || 0))}</td>
                          <td><input type="number" min="0" step="1000" value={l.realisasi ?? ""}

                const dicek = daftar.filter((l) => l.diperiksa).length;

                  <>
                    <dl className="kv" style={{ marginBottom: 11 }}>

                      <dd className="mono" style={{ color: lengkap === daftar.length ? "#1E6E5A" : "#B03E28" }}>

                      <dd className="mono" style={{ color: dicek === daftar.length ? "#1E6E5A" : "#9C7112" }}>

                        {daftar.map((l, i) => {

                          const ubah = (k, val) => setPeriksa((daftar).map((x, j) =>

                          return (
                            <React.Fragment key={i}>

                                <td>{l.item || <span style={{ color: "#B03E28" }}>(tanpa nama)</span>}

                    </div>

                <div className="actions">
                  <button className="btn ok sm" onClick={() => onApprove("Approve", catApp)}>

                  <button className="btn ghost sm" onClick={() => onApprove("Revisi", catApp)}>

                  <p style={{ fontSize: 11.5, color: "#66757C", margin: "9px 0 0", lineHeight: 1.45 }}>

                    ada dihapus dan rantai dimulai lagi dari awal setelah RAB diperbaiki.
                  </p>
                )}
              </div>
            )}
            {!myTurn && giliran && (
              <p style={{ fontSize: 12.5, color: "#66757C", margin: "12px 0 0" }}>
                Sekarang menunggu {giliran === "SKM" ? "pemeriksaan SKM" : ROLES[giliran].split(" (")[0]}.
              </p>
            )}
            {!giliran && !/Rejected|Cancelled/.test(r.status) && (
              <p style={{ fontSize: 12.5, color: "#1E6E5A", margin: "12px 0 0" }}>
                Seluruh tahap approval terlewati. RAB siap dijalankan.
              </p>

          </div>

          {relBlocks.map(([k, label]) => rel[k].length > 0 && (
            <div className="card" key={k}>
              <h3>{label} ({rel[k].length})</h3>
              {rel[k].map((x) => (
                <div key={x.id} style={{ display: "flex", gap: 9, alignItems: "baseline", fontSize: 13,
                  padding: "5px 0", borderBottom: "1px solid #E6E9E3", cursor: "pointer" }}
                  onClick={() => openRec(k, x.id)}>
                  <span className="mono" style={{ fontSize: 12 }}>{x.id}</span>
                  <span style={{ flex: 1 }}>{x.nama || x.jenisBarang || x.jenisKlaim || x.jenisMasalah || x.tujuanDana || x.hasil || "—"}</span>

          ))}

          <div className="card">
            <h3>Catatan</h3>
            <dl className="kv">
              <dt>Tujuan kegiatan</dt><dd>{r.tujuan || "—"}</dd>
              <dt>Target kegiatan</dt><dd>{r.target || "—"}</dd>
              <dt>Alokasi crew</dt>
              <dd>{(r.crew || []).length
                ? `${r.crew.length} orang — ${r.crew.map((c) => `${c.nama || "?"} (${c.peran || "peran belum diisi"})`).join(", ")}`
                : "—"}</dd>
              <dt>Kebutuhan lapangan</dt><dd>{r.kebutuhanLapangan || "—"}</dd>
              <dt>Output yang diharapkan</dt><dd>{r.output || "—"}</dd>
              <dt>Catatan untuk team lapangan</dt><dd>{r.catatanPIC || "—"}</dd>
              <dt>Catatan untuk FAT</dt><dd>{r.catatanFAT || "—"}</dd>
              <dt>Riwayat perubahan</dt><dd>{r.riwayat || "—"}</dd>
              <dt>PIC follow up</dt><dd>{r.followUp || "—"}</dd>
              <dt>Link folder Drive</dt><dd style={{ wordBreak: "break-all" }}>{r.linkDrive || "—"}</dd>
              <dt>Update terakhir</dt><dd className="mono">{r.updated}</dd>
            </dl>
          </div>

          {canRab && terkunci && !bisaLanjut && (
            <div className="card">
              <h3>Ubah status</h3>
              <p style={{ fontSize: 12.5, color: "#66757C", margin: 0 }}>
                Status, isi, dan penghapusan RAB yang sudah disetujui hanya bisa dilakukan SKM, atasan divisi,
                atasan FAT, Direktur, atau Owner.
              </p>
            </div>
          )}

          {canRab && (!terkunci || bisaLanjut) && (
            <div className="card">
              <h3>Ubah status</h3>
              <div className="actions">
                {["On Progress", "Waiting LPJ", "Revisi", "Closed", "Cancelled"].map((s) => (
                  <button key={s} className="btn ghost sm" onClick={() => onStatus(s)} disabled={r.status === s}>{s}</button>
                ))}
              </div>
              {role === "FAT" && r.status !== "Closed" && (
                <p style={{ fontSize: 12.5, color: "#66757C", margin: "10px 0 0" }}>
                  Hanya atasan FAT yang menutup RAB, dan hanya setelah LPJ dan klaim selesai.</p>
              )}
              <div className="actions" style={{ marginTop: 12 }}>
                <button className="btn no sm" onClick={() => {
                  const rinci = [["vendor", "pembanding vendor"], ["dana", "pengajuan dana"], ["lpj", "LPJ"],
                    ["klaim", "klaim"], ["eskalasi", "eskalasi"]]
                    .filter(([k]) => rel[k].length).map(([k, l]) => `${rel[k].length} ${l}`).join(", ");
                  konfirm(`Hapus ${r.no}?`,
                    rinci ? `Dokumen terkait ikut terhapus: ${rinci}. Brief-nya kembali ke antrian.`
                          : "Tidak ada dokumen lain yang memakai nomor RAB ini.",
                    onDelete);
                }}>Hapus RAB</button>
              </div>
            </div>
          )}
        </div>
      </div>
    </>
  );
}

/* ========================= LIST & DETAIL MODUL ========================= */

function ModList({ mod, rows, rabByNo, q, setQ, canCreate, canDelete, onNew, onOpen, onExport,
  sel, toggleSel, toggleAll, onBulkDelete, onDemo, cfg, role }) {
  const filtered = rows.filter((r) => !q ||
    JSON.stringify(r).toLowerCase().includes(q.toLowerCase()));
  const ids = filtered.map((r) => r.id);
  const semua = ids.length > 0 && ids.every((i) => sel.includes(i));
  const colDef = {
    realisasi: { l: "Total realisasi", v: (r) => rp(totalLpj(r)) },
    tahap: { l: "Menunggu", v: (r) => {
      if (!cfg) return "—";
      if (r.status === "Approved / Closed") return "Selesai";
      if (r.status === "Rejected") return "Ditolak";
      const t = tahapBerikut(r, cfg);
      return t ? ROLES[t.k].split(" (")[0] : "Selesai"; } },
    hemat: { l: "Selisih harga", v: (r) => {
      const hs = [r.h1, r.h2, r.h3].map(Number).filter((x) => x > 0);
      return hs.length > 1 ? rp(Math.max(...hs) - Math.min(...hs)) : "—"; } },
    selisih: { l: "Selisih vs RAB", v: (r) => {
      const row = rabByNo[r.rabNo];
      if (!row || !row.total) return "—";
      const d = row.total - totalLpj(r);
      return d < 0 ? `−${rp(Math.abs(d))}` : rp(d); } },
  };
  return (
    <>
      <div className="toolbar">
        <input placeholder={`Cari di ${mod.label.toLowerCase()}…`} value={q} onChange={(e) => setQ(e.target.value)} />
        <div className="spacer" />
        {canDelete && sel.length > 0 && (
          <>
            <span style={{ fontSize: 12.5, color: "#66757C" }}>{sel.length} dipilih</span>
            <button className="btn ghost sm" onClick={() => toggleAll([])}>Batal pilih</button>
            <button className="btn no sm" onClick={onBulkDelete}>Hapus {sel.length} record</button>
          </>
        )}
        <button className="btn ghost sm" onClick={onExport}>Export CSV</button>
        {canCreate && <button className="btn sm" onClick={onNew}>Tambah</button>}
      </div>
      {rows.length === 0 ? (
        <div className="empty">
          <h3>Belum ada {mod.label.toLowerCase()}</h3>
          <p>{canCreate
            ? "Isi record pertama supaya statusnya ikut terpantau di papan kerja."
            : `Pengisi modul ini: ${mod.create.map((r) => ROLES[r].split(" (")[0]).join(" / ")}. Posisi Anda hanya bisa melihat.`}</p>
          <div className="actions" style={{ justifyContent: "center" }}>
            {canCreate && <button className="btn" onClick={onNew}>Tambah {mod.label.toLowerCase()}</button>}
            <button className="btn ghost" onClick={onDemo}>Muat contoh data</button>
          </div>
        </div>
      ) : (
        <div className="tablewrap">
          <table className="t">
            <thead><tr>
              {canDelete && <th style={{ width: 34 }}>
                <input type="checkbox" checked={semua} onChange={() => toggleAll(ids)}
                  aria-label="Pilih semua yang tampil" /></th>}
              <th>Nomor</th>
              {mod.cols.map((c) => {
                const f = F[mod.key].find((x) => x.k === c);
                return <th key={c}>{f ? f.l : colDef[c]?.l || c}</th>;
              })}
              <th>Status</th><th>Update</th>
            </tr></thead>
            <tbody>
              {filtered.map((r) => (
                <tr key={r.id} onClick={() => onOpen(r.id)}
                  style={sel.includes(r.id) ? { background: "#FBF3DE" }
                    : (mod.key === "lpj" && cfg && role &&
                       !/Approved \/ Closed|Rejected/.test(r.status) &&
                       (tahapBerikut(r, cfg) || {}).k === role) ? { background: "#EDF5F1" } : undefined}>
                  {canDelete && (
                    <td onClick={(e) => e.stopPropagation()}>
                      <input type="checkbox" checked={sel.includes(r.id)} onChange={() => toggleSel(r.id)}
                        aria-label={`Pilih ${r.id}`} /></td>
                  )}
                  <td className="rabkey">{r.id}</td>
                  {mod.cols.map((c) => {
                    const f = F[mod.key].find((x) => x.k === c);
                    if (!f) return <td key={c} className="num">{colDef[c] ? colDef[c].v(r) : "—"}</td>;
                    if (f.t === "rp") return <td key={c} className="num">{r[c] ? rp(r[c]) : "—"}</td>;
                    if (f.t === "rab") return <td key={c} className="rabkey">
                      {r[c] || <span className="flag">TANPA RAB</span>}</td>;
                    return <td key={c}>{r[c] || "—"}</td>;
                  })}
                  <td><Pill s={r.status} /></td>
                  <td className="mono" style={{ fontSize: 12, color: "#66757C" }}>{r.updated}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </>
  );
}

function RecDetail({ mod, rec, role, sesi, onClose, onEdit, onStatus, onDelete, openRab, rabRow, konfirm,

  const [tugasErr, setTugasErr] = useState("");

  const [tugasIsian, setTugasIsian] = useState(null);
  if (!rec) return null;
  const fields = F[mod.key];
  const statusOpts = fields.find((f) => f.k === "status")?.o || [];
  const terkunci = terkunciRec(mod.key, rec);
  const canEdit = mod.edit.includes(role) && (!terkunci || bisaLanjut);
  const canStatus = (mod.statusEdit || mod.edit).includes(role) && (!terkunci || bisaLanjut);
  const tDana = mod.key === "dana" ? tierDana(rec.jumlah) : null;
  const rantaiD = tDana ? rantaiDana(rec.jumlah) : [];
  const giliranD = tDana ? berikutnya(rantaiD, rec.approvals) : null;
  const giliranDana = tDana && giliranD === role && !/Ditolak|Cair/.test(rec.status || "");
  const apSiap = tDana && !giliranD && !/Ditolak/.test(rec.status || "");
  const realLpj = mod.key === "lpj" ? totalLpj(rec) : 0;
  const selisih = mod.key === "lpj" && rabRow ? rabRow.total - realLpj : null;
  const sisaDana = mod.key === "lpj" ? (Number(rec.uangMuka) || 0) - realLpj : null;
  const tahap = mod.key === "lpj" && cfg ? tahapBerikut(rec, cfg) : null;
  const giliranSaya = tahap && tahap.k === role && !/Rejected|Approved \/ Closed/.test(rec.status);
  const simpanIsian = (patch) => commit({ ...data,
    lpj: data.lpj.map((x) => x.id === rec.id ? { ...x, ...patch, updated: today() } : x) }, "Tersimpan.");
  return (
    <>
      <div className="scrim" onClick={onClose} />

              ? <button className="rabkey" style={{ marginTop: 3, textDecoration: "underline", padding: 0 }}

          {mod.key === "brief" && (
            <button className="btn ghost sm" onClick={() => {
              setSpkErr("");
              try {
                const spkNo = rec.spkNo || nextSpkNo(data.brief, rec.divisi, rec.tglKegiatan);
                if (!rec.spkNo) {
                  commit({ ...data, brief: data.brief.map((b) => b.id === rec.id ? { ...b, spkNo } : b) },
                    `Nomor SPK diterbitkan: ${spkNo}`);
                }
                const brief = { ...rec, spkNo };
                const bytes = susunSpkBytes(brief);
                setSpkFile({
                  href: `data:application/vnd.openxmlformats-officedocument.wordprocessingml.document;base64,${bytesKeBase64(bytes)}`,
                  nama: namaBerkasSpk(brief),

              }

          {canEdit && <button className="btn sm" onClick={() => onEdit(rec)}>Ubah</button>}
          {terkunci && !bisaLanjut && <span className="pill p-go" style={{ alignSelf: "center" }}>Terkunci</span>}
        </div>
        <div className="drawer-b">
          {mod.key === "brief" && (
            <div className="card" style={{ borderTop: "3px solid var(--green)" }}>
              <h3>Surat Permohonan Kegiatan</h3>
              {rec.spkNo ? (
                <dl className="kv"><dt>Nomor SPK</dt><dd className="mono">{rec.spkNo}</dd></dl>
              ) : (
                <p style={{ fontSize: 12.5, color: "#66757C", margin: 0 }}>

            <dl className="kv">
              {fields.filter((f) => f.k !== "status" && f.k !== "crew" &&
                String(rec[f.k] ?? "").trim() !== "" && typeof rec[f.k] !== "object").map((f) => (
                <React.Fragment key={f.k}>
                  <dt>{f.l}</dt>
                  <dd className={f.t === "rp" || f.t === "num" ? "mono" : ""}>
                    {f.t === "rp" ? rp(rec[f.k]) : rec[f.k]}</dd>
                </React.Fragment>
              ))}
              {(rec.crew || []).filter((c) => c.nama).length > 0 && (
                <>
                  <dt>Alokasi crew</dt>
                  <dd>{rec.crew.filter((c) => c.nama)
                    .map((c) => `${c.nama}${c.peran ? ` (${c.peran})` : ""}${c.hari ? ` · ${c.hari} hari` : ""}`)
                    .join(", ")}</dd>
                </>
              )}
              {(rec.rute || []).filter((r) => r.kota || r.hotel).length > 0 && (
                <>
                  <dt>Rute &amp; hotel</dt>
                  <dd>{rec.rute.filter((r) => r.kota || r.hotel).map((r, i) => (
                    <div key={i} style={{ marginBottom: i < rec.rute.length - 1 ? 4 : 0 }}>
                      <span className="mono" style={{ fontSize: 11 }}>
                        {r.tglMulai || "?"}{r.tglSelesai && r.tglSelesai !== r.tglMulai ? ` s.d. ${r.tglSelesai}` : ""}
                      </span>
                      {" — "}{r.kota || "kota belum diisi"}{r.lokasiRinci ? `, ${r.lokasiRinci}` : ""}
                      {r.hotel ? <span style={{ color: "#66757C" }}> · menginap di {r.hotel}{r.kamar ? ` (${r.kamar})` : ""}</span> : null}
                    </div>
                  ))}</dd>
                </>
              )}
            </dl>
          </div>

          <div className="card">
            <h3>Status</h3>
            <div style={{ marginBottom: 10 }}><Pill s={rec.status} /></div>
            {canStatus && mod.key === "dana" && !apSiap && (
              <div className="note" style={{ borderLeftColor: "#B03E28", background: "#FBEDEA", marginTop: 0 }}>
                Finance AP belum bisa memproses pengajuan ini. Approval belum lengkap — sekarang menunggu{" "}
                {giliranD ? ROLES[giliranD].split(" (")[0] : "keputusan"}.
              </div>
            )}
            {canStatus && (mod.key !== "dana" || apSiap) ? (
              <div className="actions">
                {(mod.key === "dana"
                  ? ["Sedang Diproses AP", "Cair"]
                  : statusOpts).map((s) => (
                  <button key={s} className="btn ghost sm" disabled={rec.status === s} onClick={() => onStatus(s)}>{s}</button>
                ))}
              </div>
            ) : mod.key === "dana" && canStatus ? null : (
              <p style={{ fontSize: 12.5, color: "#66757C", margin: 0 }}>
                {terkunci
                  ? "Record sudah disetujui. Status hanya bisa diubah mulai dari SKM ke atas."
                  : `Status hanya bisa diubah oleh ${mod.edit.map((r) => ROLES[r].split(" (")[0]).join(" / ")}.`}
              </p>
            )}
            {canStatus && (
              <div className="actions" style={{ marginTop: 14 }}>
                <button className="btn no sm" onClick={() => konfirm(`Hapus ${rec.id}?`,
                  `Record ${mod.label.toLowerCase()} ini akan hilang dari tracking dan dari laporan.`,
                  onDelete)}>Hapus record</button>
              </div>
            )}
          </div>
        </div>
      </div>
    </>
  );
}

/* ========================= KONFIGURASI ========================= */

function Konfigurasi({ data, cfg, commit, role }) {
  const bisa = ["SKM", "FAT", "OWNER", "IT"].includes(role);
  const set = (patch, msg) => commit(
    { ...data, master: { ...data.master, cfg: { ...cfg, ...patch } } }, msg || "Konfigurasi diperbarui.");

  const Saklar = ({ k, judul, isi, nilai }) => (
    <div style={{ display: "flex", gap: 12, alignItems: "flex-start", padding: "11px 0",
      borderBottom: "1px solid #E6E9E3" }}>
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 13.5, fontWeight: 600 }}>{judul}</div>
        <div style={{ fontSize: 12.5, color: "#66757C", lineHeight: 1.45, marginTop: 2 }}>{isi}</div>
      </div>
      <button className={"btn sm " + (nilai ? "ok" : "ghost")} style={{ minWidth: 96 }}
        onClick={() => set({ [k]: !nilai })}>{nilai ? "Wajib" : "Opsional"}</button>
    </div>
  );

  if (!bisa) return (
    <div className="empty"><h3>Konfigurasi dikunci untuk peran ini</h3>
      <p>Yang boleh mengubah aturan sistem: SKM, atasan FAT, Owner, dan IT / Admin.</p></div>
  );

  return (
    <>
      <div className="note">
        Perubahan di sini berlaku untuk pengisian berikutnya, bukan untuk dokumen yang sudah tersimpan.
      </div>

      <div className="card">
        <h3>Kolom wajib</h3>
        <Saklar k="poOdooWajib" nilai={cfg.poOdooWajib} judul="Nomor PO Odoo pada RAB"
          isi="Bila wajib, RAB tidak bisa disimpan sebelum nomor PO Odoo diisi. Pilih opsional selama PO masih terbit setelah RAB disetujui." />
        <Saklar k="linkFotoWajib" nilai={cfg.linkFotoWajib} judul="Link foto Google Drive pada LPJ"
          isi="Bila wajib, LPJ tanpa link dokumentasi tidak bisa disubmit. Ini yang membuat LPJ dianggap sah." />
        <Saklar k="refOdooWajib" nilai={cfg.refOdooWajib} judul="Nomor referensi Odoo pada pemeriksaan SKM"
          isi="Bila wajib, SKM tidak bisa meneruskan LPJ sebelum mengisi nomor referensi Odoo." />
        <Saklar k="konklusiWajib" nilai={cfg.konklusiWajib} judul="Konklusi kegiatan pada LPJ"
          isi="Konklusi ditulis PIC yang menjalankan kegiatan, lalu diverifikasi Owner di tahap terakhir. Bila wajib, LPJ tidak bisa disubmit tanpa konklusi. Isinya menjadi bahan BI untuk Supply Chain / Data Analyst." />
        <Saklar k="paguKetat" nilai={cfg.paguKetat} judul="Pagu brief mengunci total RAB"
          isi="Bila wajib, total item biaya RAB tidak boleh melebihi estimasi dana di brief kecuali diajukan kenaikan pagu beserta alasannya." />
      </div>

      <div className="card">
        <h3>Bila realisasi LPJ melebihi RAB</h3>
        <p style={{ fontSize: 13, lineHeight: 1.5, margin: "0 0 12px" }}>
          Pilih satu perlakuan. Ini menentukan apa yang terjadi saat PIC menekan simpan pada LPJ yang totalnya
          di atas RAB.
        </p>
        {Object.entries(OVERBUDGET_OPSI).map(([k, o]) => (
          <button key={k} onClick={() => set({ overbudget: k })}
            style={{ display: "flex", gap: 11, alignItems: "flex-start", width: "100%", textAlign: "left",
              padding: "11px 12px", marginBottom: 7, borderRadius: 2,
              border: "1px solid " + (cfg.overbudget === k ? "#1E6E5A" : "#D3D7CF"),
              background: cfg.overbudget === k ? "#E4F0EB" : "#FFFFFF" }}>
            <span className="mono" style={{ color: cfg.overbudget === k ? "#1E6E5A" : "#A9B4B0", fontSize: 15 }}>
              {cfg.overbudget === k ? "●" : "○"}</span>
            <span>
              <span style={{ fontSize: 13.5, fontWeight: 600, display: "block" }}>{o.label}</span>
              <span style={{ fontSize: 12.5, color: "#66757C", lineHeight: 1.45 }}>{o.ringkas}</span>
            </span>
          </button>
        ))}
        <div className="note" style={{ marginTop: 6, marginBottom: 0, borderLeftColor: "#1E6E5A", background: "#EDF5F1" }}>
          <b>Rekomendasi: Pending review.</b> Memblokir total membuat PIC menahan LPJ atau memecah nota supaya
          muat, dan justru menyembunyikan masalah. Meloloskan otomatis menghapus fungsi kontrol RAB.
          Pending menahan uangnya, tetapi tetap merekam kejadiannya lengkap dengan alasan, sehingga atasan FAT
          punya dasar memutuskan dan polanya terlihat bila berulang.
        </div>
      </div>

      <div className="card">
        <h3>Rantai verifikasi LPJ</h3>
        <p style={{ fontSize: 13, lineHeight: 1.5, margin: "0 0 12px" }}>
          LPJ baru final setelah seluruh tahap aktif disetujui berurutan. Matikan tahap yang memang tidak
          dipakai di perusahaan.
        </p>
        {TAHAP_LPJ.map((t, i) => {
          const on = cfg.tahapAktif.includes(t.k);
          return (
            <div key={t.k} style={{ display: "flex", gap: 11, alignItems: "center", padding: "9px 0",
              borderBottom: "1px solid #E6E9E3" }}>
              <span className="mono" style={{ fontSize: 11, color: "#66757C" }}>{i + 1}</span>
              <span style={{ flex: 1, fontSize: 13.5 }}>{t.label}
                <span style={{ display: "block", fontSize: 11.5, color: "#66757C" }}>{ROLES[t.k]}</span></span>
              <button className={"btn sm " + (on ? "ok" : "ghost")} style={{ minWidth: 84 }}
                onClick={() => set({ tahapAktif: on
                  ? cfg.tahapAktif.filter((x) => x !== t.k)
                  : TAHAP_LPJ.filter((x) => x.k === t.k || cfg.tahapAktif.includes(x.k)).map((x) => x.k) })}>
                {on ? "Aktif" : "Mati"}</button>
            </div>
          );
        })}
        {cfg.tahapAktif.length === 0 && (
          <div className="note" style={{ marginTop: 12, marginBottom: 0, borderLeftColor: "#B03E28", background: "#FBEDEA" }}>
            Semua tahap dimatikan. LPJ akan langsung final begitu disubmit PIC, tanpa pemeriksaan siapa pun.
          </div>
        )}
      </div>

      <div className="card">
        <h3>Limit approval RAB</h3>

/* ========================= ALUR KERJA (FLOWCHART) ========================= */

const MENU_LABEL = {
  dash:"Dashboard", kalender:"Kalender", rab:"Buat RAB", brief:"Brief Kegiatan", vendor:"Pembanding Vendor",
  dana:"Pengajuan Dana", kas:"Kas & Pembayaran", hotel:"Permintaan Hotel", lpj:"LPJ", klaim:"Klaim Distributor",
  eskalasi:"Eskalasi Masalah", laporan:"Laporan & Export", master:"Master Data",
  pengguna:"Akun Pengguna", konfig:"Konfigurasi",
};

const wrap = (t, max = 18) => {
  const out = []; let line = "";
  t.split(" ").forEach((w) => {
    if ((line + " " + w).trim().length > max) { out.push(line.trim()); line = w; }
    else line += " " + w;
  });
  if (line.trim()) out.push(line.trim());
  return out;
};

function AlurKerja({ role: roleAwal, go }) {
  const [role, setRole] = useState(roleAwal);
  const LBL = 138, PH = 286, SLOT = 138, BW = 128, BH = 58, LH = 82, HD = 48;
  const xOf = (s) => LBL + s.p * PH + 10 + s.s * SLOT;
  const yOf = (s) => HD + LANES.indexOf(s.lane) * LH + 11;
  const W = LBL + FASE.length * PH, H = HD + LANES.length * LH + 10;
  const byId = Object.fromEntries(FLOW_STEPS.map((s) => [s.id, s]));
  const flow = ROLE_FLOW[role];

  const arrow = (a, b, i) => {
    const x1 = xOf(a), y1 = yOf(a), x2 = xOf(b), y2 = yOf(b);
    const hot = a.lane === role || b.lane === role;
    const st = { stroke: hot ? "#1E6E5A" : "#A9B4B0", strokeWidth: hot ? 1.8 : 1.2, fill: "none",
      markerEnd: `url(#${hot ? "ah" : "an"})` };
    if (x1 === x2) return <path key={i} d={`M${x1 + BW / 2},${y1 + BH} L${x1 + BW / 2},${y2 - 6}`} {...st} />;
    const mid = x1 + BW + (x2 - x1 - BW) / 2;
    return <path key={i} d={`M${x1 + BW},${y1 + BH / 2} L${mid},${y1 + BH / 2} L${mid},${y2 + BH / 2} L${x2 - 6},${y2 + BH / 2}`} {...st} />;
  };

  return (
    <>
      <div className="note">
        Semua alur berputar pada satu kunci: <b>nomor RAB</b>. Kalau satu langkah tertahan, statusnya kelihatan di
        papan kerja, dan posisi yang sedang memegang pekerjaan itu tersorot di sini.
      </div>

      <div className="toolbar">
        <span style={{ fontSize: 12.5, color: "#66757C" }}>Sorot posisi</span>
        <select value={role} onChange={(e) => setRole(e.target.value)}>
          {Object.entries(ROLES).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
        </select>
        <span style={{ fontSize: 12, color: "#66757C" }}>Geser ke samping untuk melihat fase berikutnya</span>
      </div>

      <div className="tablewrap" style={{ padding: "6px 0 10px" }}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", minWidth: 900, height: "auto", display: "block" }}
          role="img" aria-label="Diagram alur kerja SKM lintas posisi">
          <defs>
            <marker id="an" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
              <path d="M0,0 L6,3 L0,6 z" fill="#A9B4B0" /></marker>
            <marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
              <path d="M0,0 L6,3 L0,6 z" fill="#1E6E5A" /></marker>
          </defs>

          {/* kolom fase */}
          {FASE.map((f, i) => (
            <g key={f}>
              <rect x={LBL + i * PH} y="0" width={PH} height={H} fill={i % 2 ? "#F7F8F5" : "#FFFFFF"} />
              <text x={LBL + i * PH + 10} y="28" fontSize="12.5" fontWeight="600"
                fontFamily="'IBM Plex Serif',Georgia,serif" fill="#14232C">{f}</text>
            </g>
          ))}
          <line x1="0" y1={HD - 8} x2={W} y2={HD - 8} stroke="#D3D7CF" />

          {/* lajur posisi */}
          {LANES.map((l, i) => (
            <g key={l}>
              <rect x="0" y={HD + i * LH} width={LBL} height={LH}
                fill={l === role ? "#E4F0EB" : "#FFFFFF"} />
              <line x1="0" y1={HD + (i + 1) * LH} x2={W} y2={HD + (i + 1) * LH} stroke="#E6E9E3" />
              {l === role && <rect x={LBL} y={HD + i * LH} width={W - LBL} height={LH} fill="#1E6E5A" opacity="0.05" />}
              {wrap(ROLES[l].split(" (")[0], 15).map((ln, j) => (
                <text key={j} x="12" y={HD + i * LH + 26 + j * 13} fontSize="11.5"
                  fontWeight={l === role ? 600 : 400} fill={l === role ? "#1E6E5A" : "#2C4250"}>{ln}</text>
              ))}
            </g>
          ))}
          <line x1={LBL} y1="0" x2={LBL} y2={H} stroke="#D3D7CF" />

          {FLOW_ARROWS.map(([a, b], i) => arrow(byId[a], byId[b], i))}

          {FLOW_STEPS.map((s) => {
            const hot = s.lane === role;
            return (
              <g key={s.id}>
                <rect x={xOf(s)} y={yOf(s)} width={BW} height={BH} rx="2"
                  fill={hot ? "#FFFFFF" : "#FBFCFA"} stroke={hot ? "#1E6E5A" : "#D3D7CF"}
                  strokeWidth={hot ? 1.6 : 1} />
                <rect x={xOf(s)} y={yOf(s)} width={BW} height="3" fill={hot ? "#1E6E5A" : "#D3D7CF"} />
                <text x={xOf(s) + 8} y={yOf(s) + 18} fontSize="9" fontFamily="'IBM Plex Mono',monospace"
                  fill="#66757C">{String(s.id).padStart(2, "0")}</text>
                {wrap(s.t, 19).map((ln, j) => (
                  <text key={j} x={xOf(s) + 8} y={yOf(s) + 31 + j * 12} fontSize="10.5" fill="#14232C">{ln}</text>
                ))}
              </g>
            );
          })}
        </svg>
      </div>

      <div className="sectionbar" style={{ marginTop: 22 }}>
        <h2>Langkah {labelPeran(role)}</h2>
        <span>Klik nama menu untuk langsung ke halamannya</span>
      </div>
      <div className="card">
        {flow.steps.map(([t, menu], i) => (
          <div key={i} style={{ display: "flex", gap: 11, alignItems: "baseline", padding: "7px 0",
            borderBottom: i < flow.steps.length - 1 ? "1px solid #E6E9E3" : "none" }}>
            <span className="mono" style={{ fontSize: 11, color: "#66757C", minWidth: 20 }}>
              {String(i + 1).padStart(2, "0")}</span>
            <span style={{ flex: 1 }}>{t}</span>
            {menu ? (
              <button className="btn ghost sm" onClick={() => go(menu)}>{MENU_LABEL[menu]}</button>
            ) : (
              <span style={{ fontSize: 11.5, color: "#66757C" }}>di luar sistem</span>
            )}
          </div>
        ))}
      </div>
      <div className="note" style={{ borderLeftColor: "#B03E28", background: "#FBEDEA" }}>
        <b>Yang tidak boleh dilakukan:</b> {flow.larangan}
      </div>
    </>
  );
}

        <h2 id="b1">1. Untuk apa sistem ini</h2>
        <p>Sistem SKM mendukung Staff Keuangan Komersial mengontrol aktivitas Sales dan Marketing.

        <p>Diagram bergambarnya ada di menu Alur Kerja. Pilih posisi di sana untuk menyorot lajur yang sesuai.</p>

        <h2 id="b5b">5b. Kalender dan penandanya</h2>
        <p>Menu Kalender menampilkan tiga hal sekaligus dalam satu tampilan bulanan: tanggal kegiatan

        <table style={{ marginTop: 9, width: "100%", borderCollapse: "collapse" }}><tbody>
          {[

        <p><b>Kalender terlihat berbeda bagi setiap posisi.</b> Penanda yang sedang menunggu posisi Anda
