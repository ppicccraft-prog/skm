function SKMControlPanel() {
  const [data, setData] = useState(null);
  const [sesi, setSesi] = useState(undefined);   // undefined = belum dicek, null = belum masuk
  const [view, setView] = useState("dash");
  const [toast, setToast] = useState("");
  const [unduhSiap, setUnduhSiap] = useState(null); // {nama, href} — tautan unduh nyata untuk CSV
  const [modal, setModal] = useState(null);   // {mode:'form'|'rab', mod, rec}
  const [detail, setDetail] = useState(null); // {type:'rab'|mod, id}
  const [q, setQ] = useState("");
  const [fStatus, setFStatus] = useState("");
  const [sel, setSel] = useState([]);
  const [ask, setAsk] = useState(null);
  const konfirm = (judul, isi, aksi) => setAsk({ judul, isi, aksi });
  const beritahu = (judul, isi) => setAsk({ judul, isi, info: true, aksi: () => {} });

  /* Menyimpan updated_at terakhir yang kita tahu dari server, untuk deteksi
     konflik (lihat store.setSafe) dan untuk membandingkan saat auto-refresh
     / Realtime datang. */
  const dataVerRef = useRef(null);

  useEffect(() => {
    (async () => {
      let d;
      try {
        const r = await store.getWithMeta("skm:data");
        d = r ? JSON.parse(r.value) : SEED;
        dataVerRef.current = r ? r.updatedAt : null;
      } catch { d = SEED; }

      /* Migrasi sekali jalan: standarkan seluruh kata sandi akun ke 12345.
         Versi sebelumnya memberi tiap akun kata sandi berbeda (admin123, skm123,
         dst.) sebelum diseragamkan — data yang sudah tersimpan di browser tidak
         ikut berubah waktu itu, sehingga akun lama terkunci karena kata sandi
         lamanya tidak pernah diberi tahu ke siapa pun. Berjalan sekali saja,
         ditandai lewat master.pwDiseragamkan, supaya tidak menimpa kata sandi
         yang sudah diubah IT / Admin sesudahnya. */
      if (d && d.master && !d.master.pwDiseragamkan) {
        d = { ...d, master: { ...d.master,
          users: (d.master.users || []).map((u) => ({ ...u, p: "12345" })),
          pwDiseragamkan: true } };
        store.set("skm:data", JSON.stringify(d))
          .then((r) => { if (r && r.updatedAt) dataVerRef.current = r.updatedAt; })
          .catch(() => {});
      }

      setData(d);
      /* Session login HARUS per-tab, bukan per-browser — makanya dipakai
         sessionStorage (bukan localStorage, dan bukan store/Supabase).
         localStorage dibagi ke SEMUA tab/window di browser yang sama, jadi
         kalau ada 2 tab login sebagai 2 orang berbeda, satu akan menimpa
         sesi tab yang lain begitu di-refresh. sessionStorage terisolasi
         per-tab: setiap tab (dan setiap kali browser dibuka ulang) wajib
         login sendiri lewat halaman login. */
      try {
        const raw = sessionStorage.getItem("skm:sesi");
        setSesi(raw ? JSON.parse(raw) : null);
      } catch { setSesi(null); }
    })();
  }, []);

  /* ---- sinkronisasi antar device: Realtime + polling cadangan ----
     Realtime butuh replication diaktifkan untuk tabel skm_kv di
     Database > Replication pada dashboard Supabase. Kalau belum aktif,
     polling tiap 15 detik di bawah tetap menjaga semua device mendekati
     sinkron walau tidak instan. */
  useEffect(() => {
    const terapkanJikaBaru = (valueStr, updatedAt) => {
      if (dataVerRef.current === updatedAt) return; // sudah versi ini, abaikan
      try {
        const val = JSON.parse(valueStr);
        dataVerRef.current = updatedAt;
        setData(val);
      } catch { /* biarkan, data lokal tetap dipakai */ }
    };

    const channel = supabaseClient
      .channel("skm_kv_sync")
      .on("postgres_changes",
        { event: "*", schema: "public", table: "skm_kv", filter: "key=eq.skm:data" },
        (payload) => {
          const row = payload.new;
          if (row && row.value) terapkanJikaBaru(row.value, row.updated_at);
        })
      .subscribe();

    const poll = setInterval(async () => {
      try {
        const r = await store.getWithMeta("skm:data");
        if (r) terapkanJikaBaru(r.value, r.updatedAt);
      } catch { /* diamkan, coba lagi di polling berikutnya */ }
    }, 15000);

    return () => { supabaseClient.removeChannel(channel); clearInterval(poll); };
  }, []);

  const commit = useCallback((next, msg) => {
    const verSaatIni = dataVerRef.current;
    setData(next);
    if (msg) { setToast(msg); setTimeout(() => setToast(""), 2600); }
    store.setSafe("skm:data", JSON.stringify(next), verSaatIni)
      .then((r) => { if (r && r.updatedAt) dataVerRef.current = r.updatedAt; })
      .catch(async (err) => {
        if (err && err.code === "CONFLICT") {
          try {
            const r = await store.getWithMeta("skm:data");
            const terbaru = JSON.parse(r.value);
            dataVerRef.current = r.updatedAt;
            setData(terbaru);
            setToast("Perubahan Anda TIDAK tersimpan — pengguna lain baru saja menyimpan data ini. Data terbaru sudah dimuat, silakan ulangi perubahan Anda.");
            setTimeout(() => setToast(""), 6000);
          } catch {
            setToast("Konflik data terdeteksi, tapi gagal memuat versi terbaru. Muat ulang halaman.");
            setTimeout(() => setToast(""), 6000);
          }
        } else {
          setToast("Perubahan tersimpan di sesi ini, tapi gagal disimpan permanen.");
          setTimeout(() => setToast(""), 4000);
        }
      });
  }, []);

  const relOf = useCallback((rabNo) => ({
    vendor: (data?.vendor || []).filter((x) => x.rabNo === rabNo),
    dana: (data?.dana || []).filter((x) => x.rabNo === rabNo),
    lpj: (data?.lpj || []).filter((x) => x.rabNo === rabNo),
    klaim: (data?.klaim || []).filter((x) => x.rabNo === rabNo),
    eskalasi: (data?.eskalasi || []).filter((x) => x.rabNo === rabNo),
  }), [data]);

  /* ---- baris MASTER_RAB terhitung (Bagian 16) ---- */
  const masterRows = useMemo(() => {
    if (!data) return [];
    const sla = data.master.slaLpjHari || 14;
    return data.rabs.map((r) => {
      const rel = relOf(r.no);
      const total = (r.lines || []).reduce((s, l) => s + (Number(l.qty) || 0) * (Number(l.harga) || 0), 0);
      const lpj = rel.lpj[0];
      const realisasi = lpj ? totalLpj(lpj) : 0;
      const lpjClosed = rel.lpj.some((l) => l.status === "Approved / Closed");
      const akhir = tglAkhir(r);
      const aging = !lpjClosed && akhir ? Math.max(0, daysBetween(akhir, today())) : 0;
      const cair = rel.dana.filter((d) => d.status === "Cair").reduce((s, d) => s + (Number(d.jumlah) || 0), 0);
      const kePic = (r.lines || []).filter((l) => l.caraBayar === "Dibayar ke PIC")
        .reduce((a, l) => a + (Number(l.qty) || 0) * (Number(l.harga) || 0), 0);
      const keVendor = (r.lines || []).filter((l) => l.caraBayar === "Dibayar ke Vendor")
        .reduce((a, l) => a + (Number(l.qty) || 0) * (Number(l.harga) || 0), 0);
      const realBayar = (r.lines || []).reduce((a, l) => a + (Number(l.realisasi) || 0), 0);
      const lunasCount = (r.lines || []).filter((l) => l.lunas).length;
      const petaAP = bayarAP(r.no, rel.dana);
      const menungguKonfirmasi = (r.lines || []).filter(
        (l) => !l.lunas && petaAP[String(l.item || "").trim().toLowerCase()]).length;
      const siapJalan = (r.lines || []).length > 0 && lunasCount === (r.lines || []).length;
      return {
        ...r, rel, total, realisasi, lpjClosed, aging,
        cair, kePic, keVendor, realBayar, lunasCount, petaAP, menungguKonfirmasi, siapJalan,
        uangMukaTerbuka: lpjClosed ? 0 : cair,
        statusLPJ: lpj ? lpj.status : (r.status === "Waiting LPJ" ? "Waiting LPJ" : "—"),
        overbudget: realisasi > total && total > 0,
        agingOverdue: aging > sla && !lpjClosed && akhir && daysBetween(akhir, today()) > 0,
        perluEskalasi: rel.eskalasi.some((e) => e.status !== "Selesai"),
        paguNaik: !!r.paguDari,
        tier: tierOf(total),
      };
    });
  }, [data, relOf]);

  const rabByNo = useMemo(() => Object.fromEntries(masterRows.map((r) => [r.no, r])), [masterRows]);

  /* ---- metrik dashboard (Bagian 20) ---- */
  const M = useMemo(() => {
    if (!data) return null;
    const { y, m } = ym();
    const thisMonth = masterRows.filter((r) => (r.tglPengajuan || "").startsWith(`${y}-${m}`));
    const noRab = [...data.dana, ...data.klaim].filter((x) => !x.rabNo);
    return {
      masukBulanIni: thisMonth.length,
      tungguPIC: masterRows.filter((r) => r.status === "Menunggu Data PIC").length,
      tungguApproval: masterRows.filter((r) => /Menunggu Approval|Siap Review FAT/.test(r.status)).length,
      approved: masterRows.filter((r) => r.status === "Approved").length,
      ditolak: masterRows.filter((r) => /Rejected|Cancelled/.test(r.status)).length,
      nilaiApproved: masterRows.filter((r) => /Approved|On Progress|Waiting LPJ|Closed/.test(r.status))
        .reduce((s, r) => s + r.total, 0),
      totalRealisasi: masterRows.reduce((s, r) => s + r.realisasi, 0),
      overbudget: masterRows.filter((r) => r.overbudget).length,
      lpjWaiting: masterRows.filter((r) => !r.lpjClosed && /Waiting LPJ|On Progress|Approved/.test(r.status)).length,
      lpjOverdue: masterRows.filter((r) => r.agingOverdue).length,
      uangMukaTerbuka: masterRows.reduce((s, r) => s + r.uangMukaTerbuka, 0),
      klaimTerbuka: data.klaim.filter((k) => !/Closed|Rejected/.test(k.status)).length,
      klaimAR: data.klaim.filter((k) => k.perluAR === "Ya" && !/Closed|Posted to AR/.test(k.status)).length,
      biayaTanpaRAB: noRab.length,
      siapCair: data.dana.filter((d) => /Siap Dicairkan|Sedang Diproses AP/.test(d.status || "")).length,
      hotelMenunggu: data.brief.reduce((a, b) => a + (b.rute || [])
        .filter((r) => r.hotel && (!r.statusHotel || r.statusHotel === "Tentatif")).length, 0),
      perluKonfirmasi: masterRows.reduce((a, r) => a + r.menungguKonfirmasi, 0),
      siapJalan: masterRows.filter((r) => r.siapJalan && !/Closed|Cancelled/.test(r.status || "")).length,
      tempoDekat: temuTempo(data.rabs, 7).length,
      tempoLewat: temuTempo(data.rabs, 0).filter((x) => x.sisa < 0).length,
      itemTanpaPenawaran: data.rabs.reduce((a, r) => a + (r.lines || [])
        .filter((l) => !String(l.linkPenawaran || "").trim()).length, 0),
      eskalasiTerbuka: data.eskalasi.filter((e) => e.status !== "Selesai").length,
      briefBelumRAB: data.brief.filter((b) => !b.rabNo && b.status !== "Ditolak").length,
    };
  }, [data, masterRows]);

  if (!data || sesi === undefined)
    return (<div className="skm"><style>{CSS}</style><div className="body">Memuat…</div></div>);

  /* Data lama dari sebelum fitur login ada belum punya daftar akun sama sekali —
     untuk kasus itu saja akun bawaan dipakai sebagai titik awal. Begitu daftar akun
     sudah pernah tersimpan (termasuk setelah ada yang dihapus), daftar itu yang jadi
     acuan sepenuhnya — akun yang dihapus IT / Admin tidak boleh muncul lagi sendiri. */
  const tersimpan = (data.master.users || []).filter((x) => x && x.u);
  const daftarUser = tersimpan.length ? tersimpan : SEED.master.users;
  if (!sesi) return (
    <Login users={daftarUser} onMasuk={(x) => {
      setSesi(x);
      try { sessionStorage.setItem("skm:sesi", JSON.stringify(x)); } catch {}
    }} />
  );
  /* Sesi lama mungkin masih menyimpan peran yang sudah dihapus dari sistem
     (Direktur Terkait, Gudang / Inventory). Turunkan otomatis ke PIC — peran
     dengan wewenang paling terbatas — supaya aplikasi tetap bisa dibuka,
     alih-alih berhenti karena peran itu sudah tidak dikenal di mana pun.
     IT / Admin sebaiknya memperbarui posisi akun tersebut lewat Akun Pengguna. */
  const role = (ROLES[sesi.role] && ROLE_FLOW[sesi.role]) ? sesi.role : "PIC";
  const keluar = () => {
    setSesi(null); setView("dash"); setDetail(null); setModal(null);
    try { sessionStorage.removeItem("skm:sesi"); } catch {}
  };

  const cfg = getCfg(data.master);
  const sla = data.master.slaLpjHari || 14;
  const telatSemua = lpjTelat(data.rabs, data.lpj, sla);
  const telatSaya = telatSemua[sesi.nama] || [];
  /* Kegiatan yang dananya sudah dikonfirmasi SKM — PIC boleh mulai bekerja */
  const siapJalanSaya = role === "PIC"
    ? masterRows.filter((r) => r.siapJalan && r.pic === sesi.nama &&
        !/Closed|Cancelled|Rejected/.test(r.status || ""))
    : [];
  const terkunciRAB = telatSaya.length > 0 && role === "PIC";
  const can = (k, act) => (MOD[k] ? (MOD[k][act] || []).includes(role) : false);
  const canRab = RAB_EDIT.includes(role);
  const canRabNew = RAB_CREATE.includes(role);
  const isApprover = ["SKM", "DIVISI", "FAT", "OWNER"].includes(role);

  /* ---- simpan record modul ---- */
  const saveRecord = (modKey, rec) => {
    const list = [...data[modKey]];
    const i = list.findIndex((x) => x.id === rec.id);
    if (i >= 0 && modKey === "lpj" && terkunciRec("lpj", list[i])) {
      const awal = TAHAP_LPJ.find((t) => cfg.tahapAktif.includes(t.k));
      list[i] = { ...rec, verifikasi: [], status: awal ? awal.status : "Submitted by PIC", updated: today(),
        catatanSKM: `${rec.catatanSKM || ""}\n[${today()}] LPJ diubah setelah diverifikasi oleh ${sesi.nama}. Rantai verifikasi diulang dari awal.`.trim() };
      commit({ ...data, lpj: list }, "LPJ diubah — verifikasi diulang dari tahap pertama.");
      setModal(null); return;
    }
    if (i >= 0) list[i] = { ...rec, updated: today() };
    else list.push({ ...rec, id: nextDocNo(list, MOD[modKey].pre), dibuat: today(), updated: today(),
      ...(modKey === "dana" ? { diajukanOleh: sesi.nama, ditujukanKe: "Finance AP",
        status: ST_TAHAP_DANA[rantaiDana(rec.jumlah)[0]] || "Menunggu Atasan FAT", approvals: [] } : {}) });
    commit({ ...data, [modKey]: list }, i >= 0 ? "Perubahan disimpan." : `${MOD[modKey].label} tersimpan.`);
    setModal(null);
  };

  /* ---- simpan RAB ---- */
  const saveRab = (rec) => {
    const nunggak = telatSemua[rec.pic] || [];
    if (nunggak.length && !rec.no) {
      beritahu("RAB baru terkunci",
        `${rec.pic} masih punya ${nunggak.length} LPJ lewat batas waktu ${sla} hari: ` +
        `${nunggak.map((x) => x.no).join(", ")}. Selesaikan LPJ tersebut dulu sebelum membuat RAB baru.`);
      setModal(null); return;
    }
    const list = [...data.rabs];
    const i = list.findIndex((x) => x.no === rec.no);
    if (i >= 0) {
      /* Mengubah RAB yang sudah disetujui membatalkan approval — angkanya sudah bukan yang disetujui. */
      const lama = list[i];
      const totalLama = (lama.lines || []).reduce((a, l) => a + (Number(l.qty) || 0) * (Number(l.harga) || 0), 0);
      const totalBaru = (rec.lines || []).reduce((a, l) => a + (Number(l.qty) || 0) * (Number(l.harga) || 0), 0);
      const berubahAngka = totalLama !== totalBaru;
      if (terkunciRab(lama) && berubahAngka) {
        list[i] = { ...rec, approvals: [], status: "Revisi", updated: today(),
          revisiSetelahApproval: (lama.revisiSetelahApproval || 0) + 1,
          riwayat: `${lama.riwayat || ""}\n[${today()}] Nilai diubah dari ${rp(totalLama)} menjadi ${rp(totalBaru)} setelah approval oleh ${sesi.nama}. Approval sebelumnya dibatalkan.`.trim() };
        commit({ ...data, rabs: list }, "Nilai berubah — approval dibatalkan, RAB kembali ke status Revisi.");
        setModal(null); return;
      }
      list[i] = { ...rec, updated: today() };
    }
    if (i < 0) {
      const no = nextRabNo(list, rec.divisi, rec.tglPengajuan || today());
      list.push({ ...rec, no, tglPengajuan: rec.tglPengajuan || today(), approvals: [],
        status: "Menunggu Pemeriksaan SKM", updated: today() });
      if (rec.briefId) {
        const br = data.brief.map((b) => b.id === rec.briefId ? { ...b, rabNo: no, status: "Sudah Jadi RAB" } : b);
        commit({ ...data, rabs: list, brief: br }, `RAB dibuat: ${no}`);
        setModal(null); return;
      }
    }
    commit({ ...data, rabs: list }, i >= 0 ? "RAB diperbarui." : `RAB dibuat: ${list[list.length - 1].no}`);
    setModal(null);
  };

  /* Approval RAB berjalan berurutan: pemeriksaan SKM dulu, baru jenjang sesuai nilai. */
  const stampApproval = (rabNo, decision, catatan) => {
    const row = rabByNo[rabNo];
    if (!row) return;
    const rantai = rantaiRab(row.total);
    if (berikutnya(rantai, row.approvals) !== role) return;
    const approvals = [...(row.approvals || []),
      { role, nama: sesi.nama, tgl: today(), decision, catatan: catatan || "" }];
    let status;
    if (decision === "Reject") status = "Rejected";
    else if (decision === "Revisi") status = "Revisi";
    else {
      const sisa = berikutnya(rantai, approvals);
      status = sisa ? ST_TAHAP_RAB[sisa] : "Approved";
    }
    const list = data.rabs.map((r) => r.no === rabNo
      ? { ...r, approvals: decision === "Revisi" ? [] : approvals, status, updated: today(),
          riwayat: decision === "Revisi"
            ? `${r.riwayat || ""}\n[${today()}] Dikembalikan untuk koreksi oleh ${sesi.nama}${catatan ? ` — ${catatan}` : ""}.`.trim()
            : r.riwayat }
      : r);
    commit({ ...data, rabs: list },
      decision === "Reject" ? "RAB ditolak."
        : decision === "Revisi" ? "RAB dikembalikan ke PIC untuk koreksi."
        : status === "Approved" ? "Approval lengkap. RAB siap dijalankan."
        : `Tercatat. Lanjut ke: ${status}`);
  };

  const setRabStatus = (rabNo, status) =>
    commit({ ...data, rabs: data.rabs.map((r) => r.no === rabNo ? { ...r, status, updated: today() } : r) },
      `Status RAB: ${status}`);

  const setRecStatus = (modKey, id, status) =>
    commit({ ...data, [modKey]: data[modKey].map((x) => x.id === id ? { ...x, status, updated: today() } : x) },
      `Status: ${status}`);

  const IKUT = ["vendor", "dana", "lpj", "klaim", "eskalasi"];
  const countTerkait = (nos) =>
    IKUT.reduce((s, k) => s + data[k].filter((x) => nos.includes(x.rabNo)).length, 0);

  /* Hapus RAB: dokumen turunannya ikut terhapus, brief-nya dilepas kembali ke antrian. */
  const deleteRabs = (nos) => {
    const next = { ...data, rabs: data.rabs.filter((r) => !nos.includes(r.no)) };
    let n = 0;
    IKUT.forEach((k) => {
      const before = next[k].length;
      next[k] = next[k].filter((x) => !nos.includes(x.rabNo));
      n += before - next[k].length;
    });
    next.brief = data.brief.map((b) =>
      nos.includes(b.rabNo) ? { ...b, rabNo: "", status: "Masuk" } : b);
    const lepas = data.brief.filter((b) => nos.includes(b.rabNo)).length;
    commit(next, `${nos.length} RAB dihapus` +
      (n ? `, ${n} dokumen terkait ikut terhapus` : "") +
      (lepas ? `, ${lepas} brief kembali ke antrian` : "") + ".");
    setSel([]); setDetail(null);
  };

  const deleteRecs = (modKey, ids) => {
    const next = { ...data, [modKey]: data[modKey].filter((x) => !ids.includes(x.id)) };
    commit(next, `${ids.length} ${MOD[modKey].label.toLowerCase()} dihapus.`);
    setSel([]); setDetail(null);
  };

  const removeRec = (modKey, id) =>
    modKey === "rabs" ? deleteRabs([id]) : deleteRecs(modKey, [id]);

  const konfirmasiHapusRab = (nos) => {
    if (!EDIT_LANJUT.includes(role)) {
      const kunci = nos.filter((no) => rabByNo[no] && terkunciRab(rabByNo[no]));
      if (kunci.length) {
        beritahu(`${kunci.length} RAB terkunci`,
          `${kunci.join(", ")} sudah disetujui, jadi tidak bisa dihapus dari peran ini. Penghapusan RAB yang sudah disetujui hanya bisa dilakukan mulai dari SKM ke atas.`);
        return;
      }
    }
    const n = countTerkait(nos);
    konfirm(
      nos.length === 1 ? `Hapus ${nos[0]}?` : `Hapus ${nos.length} RAB terpilih?`,
      n ? `${n} dokumen terkait ikut terhapus: pembanding vendor, pengajuan dana, LPJ, klaim, dan eskalasi yang memakai nomor RAB ini. Brief-nya kembali ke antrian.`
        : "Tidak ada dokumen lain yang memakai nomor RAB ini.",
      () => deleteRabs(nos));
  };
  const konfirmasiHapusRec = (modKey, ids) => {
    if (!EDIT_LANJUT.includes(role)) {
      const kunci = ids.filter((id) => terkunciRec(modKey, data[modKey].find((x) => x.id === id)));
      if (kunci.length) {
        beritahu(`${kunci.length} record terkunci`,
          `${kunci.join(", ")} sudah disetujui, jadi tidak bisa dihapus dari peran ini. Hubungi SKM bila memang harus dibatalkan.`);
        return;
      }
    }
    konfirm(
      ids.length === 1 ? `Hapus ${ids[0]}?` : `Hapus ${ids.length} record terpilih?`,
      `Record ${MOD[modKey].label.toLowerCase()} ini akan hilang dari tracking dan dari laporan.`,
      () => deleteRecs(modKey, ids));
  };

  const muatContoh = () => {
    const isi = () => commit(contohData(data.master), "Contoh data dimuat: 5 RAB beserta dokumennya.");
    const adaData = data.rabs.length || data.brief.length || data.klaim.length;
    if (adaData) konfirm("Ganti data yang ada dengan contoh?",
      "Seluruh transaksi yang tersimpan sekarang akan diganti contoh data. Master data PIC, vendor, dan price list tetap disimpan.",
      isi);
    else isi();
  };

  /* Satu tahap verifikasi LPJ. Setiap tahap menuntut kelengkapan yang berbeda. */
  const verifikasiLpj = (id, hasil, catatan) => {
    const l = data.lpj.find((x) => x.id === id);
    if (!l) return;
    const tahap = tahapBerikut(l, cfg);
    if (!tahap) return;
    const verifikasi = [...(l.verifikasi || []),
      { tahap: tahap.k, nama: sesi.nama, tgl: today(), hasil, catatan: catatan || "" }];
    let next = { ...l, verifikasi, updated: today() };
    if (hasil === "Setuju") {
      const sisa = tahapBerikut({ ...l, verifikasi }, cfg);
      next.status = sisa ? sisa.status : "Approved / Closed";
    } else next.status = "Need Revision";
    const upd = { ...data, lpj: data.lpj.map((x) => x.id === id ? next : x) };
    if (next.status === "Approved / Closed") {
      upd.rabs = data.rabs.map((r) => r.no === l.rabNo ? { ...r, status: "Closed", updated: today() } : r);
    }
    commit(upd, hasil === "Setuju"
      ? (next.status === "Approved / Closed" ? "LPJ final. RAB ikut ditutup." : `Lanjut ke: ${next.status}`)
      : "LPJ dikembalikan ke PIC untuk revisi.");
  };

  /* Approval dana berurutan; setelah lengkap, pengajuan diteruskan ke Finance AP. */
  const approveDana = (id, decision, catatan) => {
    const d = data.dana.find((x) => x.id === id);
    if (!d) return;
    const rantai = rantaiDana(d.jumlah);
    if (berikutnya(rantai, d.approvals) !== role) return;
    const approvals = [...(d.approvals || []),
      { role, nama: sesi.nama, tgl: today(), decision, catatan: catatan || "" }];
    const sisa = berikutnya(rantai, approvals);
    const status = decision === "Reject" ? "Ditolak"
      : sisa ? ST_TAHAP_DANA[sisa] : "Siap Dicairkan";
    commit({ ...data, dana: data.dana.map((x) => x.id === id
      ? { ...x, approvals, status, updated: today() } : x) },
      decision === "Reject" ? "Pengajuan dana ditolak."
        : status === "Siap Dicairkan"
          ? "Approval lengkap. Finance AP bisa memproses pencairan."
          : `Tercatat. Lanjut ke: ${status}`);
  };

  /* SKM mencatat realisasi pembayaran tiap item RAB. */
  const simpanRealisasi = (rabNo, lines, pesan) => {
    const semuaLunas = lines.length > 0 && lines.every((l) => l.lunas);
    const lama = data.rabs.find((r) => r.no === rabNo) || {};
    const majuStatus = semuaLunas && /Approved|Menunggu/.test(lama.status || "");
    commit({ ...data, rabs: data.rabs.map((r) => r.no === rabNo
      ? { ...r, lines, updated: today(),
          status: majuStatus ? "On Progress" : r.status,
          tglSiapJalan: semuaLunas ? (r.tglSiapJalan || today()) : "" }
      : r) },
      semuaLunas
        ? `Seluruh item dikonfirmasi dibayar. ${lama.pic || "PIC"} diberi tahu kegiatan boleh dijalankan.`
        : (pesan || "Realisasi tersimpan."));
  };

  const toggleSel = (id) => setSel((s) => s.includes(id) ? s.filter((x) => x !== id) : [...s, id]);
  const toggleAll = (ids) => setSel((s) => ids.every((i) => s.includes(i)) ? [] : ids);

  const exportCSV = (name, rows, cols) => {
    /* Titik koma, bukan koma — Excel versi Indonesia (format angka pakai koma sebagai
       desimal) menganggap titik koma sebagai pemisah kolom bawaan. Pakai koma di sini
       membuat Excel menumpuk semua isi baris jadi satu kolom saat file dibuka langsung.
       Baris "sep=;" di awal berkas menegaskan pemisahnya ke Excel apa pun pengaturan
       regionalnya, dan tidak mengganggu program lain yang membaca CSV apa adanya. */
    try {
      const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const csv = ["sep=;",
        cols.map((c) => esc(c.l)).join(";"),
        ...rows.map((r) => cols.map((c) => esc(typeof c.v === "function" ? c.v(r) : r[c.v])).join(";"))].join("\n");
      /* Tautan unduh nyata yang harus diklik sendiri, bukan diklik otomatis lewat kode —
         cara lama itu terbukti gagal diam-diam di sebagian lingkungan (masalah yang sama
         yang pernah terjadi pada unduhan SPK/Surat Tugas). base64 dibuat sendiri, bukan
         btoa(), karena btoa juga pernah terbukti tidak konsisten untuk data yang lebih besar. */
      const bytes = new TextEncoder().encode("\ufeff" + csv);
      const href = `data:text/csv;charset=utf-8;base64,${bytesKeBase64(bytes)}`;
      setUnduhSiap({ nama: `${name}_${today()}.csv`, href });
    } catch (err) {
      setUnduhSiap(null);
      setToast(`Gagal menyiapkan ${name}: ${err.message}`); setTimeout(() => setToast(""), 3200);
    }
  };

  /* ================= RENDER ================= */

  const boleh = (k) => (MOD[k] ? MOD[k].lihat : AKSES[k] || SEMUA).includes(role);
  const NAV = [
    { g: "Alur kegiatan", items: [
      { k: "dash", l: "Dashboard", n: M ? M.lpjOverdue + M.eskalasiTerbuka : 0 },
      { k: "kalender", l: "Kalender", n: 0 },
      { k: "brief", l: "Brief Kegiatan", n: data.brief.length },
      { k: "rab", l: "Buat RAB", n: data.rabs.length },
      { k: "vendor", l: "Pembanding Vendor", n: data.vendor.length },
      { k: "dana", l: "Pengajuan Dana", n: data.dana.length },
      { k: "kas", l: "Kas & Pembayaran", n: M ? M.siapCair : 0 },
      { k: "hotel", l: "Permintaan Hotel", n: M ? M.hotelMenunggu : 0 },
      { k: "lpj", l: "LPJ", n: data.lpj.length },
      { k: "klaim", l: "Klaim Distributor", n: data.klaim.length },
      { k: "eskalasi", l: "Eskalasi Masalah", n: data.eskalasi.length },
    ].filter((i) => boleh(i.k)) },
    { g: "Pendukung", items: [
      { k: "alur", l: "Alur Kerja", n: 0 },
      { k: "panduan", l: "Panduan Pakai", n: 0 },
      { k: "manual", l: "Manual Book", n: 0 },
      { k: "laporan", l: "Laporan & Export", n: 0 },
      { k: "master", l: "Master Data", n: 0 },
      { k: "pengguna", l: "Akun Pengguna", n: 0 },
      { k: "konfig", l: "Konfigurasi", n: 0 },
    ].filter((i) => boleh(i.k)) },
  ].filter((g) => g.items.length);

  const TITLES = {
    dash: ["Dashboard", "Pekerjaan yang sedang menggantung, per posisi"],
    rab: ["Buat RAB", "Tracking utama — semua kegiatan berkunci nomor RAB"],
    konfig: ["Konfigurasi", "Aturan main sistem: kolom wajib, pagu, dan rantai verifikasi"],
    kalender: ["Kalender", "Jadwal kegiatan, batas LPJ, dan jatuh tempo pembayaran"],
    kas: ["Kas & Pembayaran", "Meja kerja Finance AP — antrian pencairan dan jadwal transfer"],
    hotel: ["Permintaan Hotel", "Meja kerja General Affairs — konfirmasi hotel per rute brief"],
    manual: ["Manual Book", "Dokumen lengkap sistem SKM — bisa dibaca dan dicetak dari sini"],
    pengguna: ["Akun Pengguna", "Dikelola IT / Admin — siapa boleh masuk dan sebagai posisi apa"],
    laporan: ["Laporan & Export", "Tarik data untuk atasan FAT atau migrasi ke Odoo"],
    master: ["Master Data", "Sumber dropdown, price list, dan aturan SLA"],
    alur: ["Alur Kerja", "Siapa mengerjakan apa, dan di menu mana"],
    panduan: ["Panduan Pakai", "Manual singkat sistem SKM"],
  };
  const [title, sub] = TITLES[view] || [MOD[view]?.label, `Fase ${MOD[view]?.fase} · pengisi: ${(MOD[view]?.create || []).map((r) => ROLES[r].split(" (")[0]).join(" / ")}`];

  return (
    <div className="skm">
      <style>{CSS}</style>

      <nav className="rail" aria-label="Menu SKM">
        <div className="rail-brand"><b>SKM</b><span>Control Panel · Fase 1</span></div>
        {NAV.map((g) => (
          <React.Fragment key={g.g}>
            <div className="rail-group">{g.g}</div>
            {g.items.map((it) => (
              <a key={it.k} href="#" className={view === it.k ? "on" : ""}
                onClick={(e) => { e.preventDefault(); setView(it.k); setQ(""); setFStatus(""); setSel([]); }}>
                {it.l}{it.n ? <span className="n">{it.n}</span> : null}
              </a>
            ))}
          </React.Fragment>
        ))}
      </nav>

      <div className="main">
        <header className="topbar">
          <div><h1>{title}</h1><div className="sub">{sub}</div></div>
          <div className="spacer" />
          <div className="who" title={`${sesi.nama} — ${labelPeran(role)}`}>
            <span className="av" aria-hidden="true">
              {sesi.nama.split(/\s+/).slice(0, 2).map((x) => x[0]).join("").toUpperCase()}</span>
            <span className="t">
              <span className="n">{sesi.nama}</span>
              <span className="r">{labelPeran(role)}</span>
            </span>
          </div>
          <button className="btn ghost sm" onClick={keluar}>Keluar</button>
        </header>

        {telatSaya.length > 0 && (
          <div className="sla-bar" role="alert">
            <span style={{ flex: 1 }}>
              <b>{telatSaya.length} LPJ Anda lewat batas waktu {sla} hari.</b>{" "}
              {telatSaya.slice(0, 3).map((x) => `${x.no} (telat ${x.telat} hari)`).join(", ")}
              {telatSaya.length > 3 ? `, dan ${telatSaya.length - 3} lainnya` : ""}.{" "}
              {role === "PIC"
                ? "Selama masih ada yang menunggak, Anda tidak bisa membuat RAB baru."
                : "Segera diselesaikan agar tidak menahan kegiatan berikutnya."}
            </span>
            <button className="btn no sm" onClick={() => setView("lpj")}>Buka LPJ</button>
          </div>
        )}

        {siapJalanSaya.length > 0 && (
          <div className="go-bar" role="status">
            <span style={{ flex: 1 }}>
              <b>Dana sudah cair untuk {siapJalanSaya.length} kegiatan Anda.</b>{" "}
              {siapJalanSaya.slice(0, 2).map((r) => `${r.nama} (${r.no})`).join(", ")}
              {siapJalanSaya.length > 2 ? `, dan ${siapJalanSaya.length - 2} lainnya` : ""}.{" "}
              Kegiatan boleh dijalankan sesuai brief. Simpan seluruh nota dan dokumentasinya untuk LPJ.
            </span>
            <button className="btn ok sm" onClick={() => setView("rab")}>Lihat RAB</button>
          </div>
        )}

        <div className="body">
          {view === "dash" && boleh("dash") && (
            <Dashboard M={M} rows={masterRows} go={setView} kosong={!data.rabs.length} onDemo={muatContoh}
              openRab={(no) => setDetail({ type: "rab", id: no })} />
          )}

          {view === "rab" && boleh("rab") && (
            <RabList rows={masterRows} q={q} setQ={setQ} fStatus={fStatus} setFStatus={setFStatus}
              canRab={canRab} canRabNew={canRabNew && !terkunciRAB} briefs={data.brief}
              terkunciRAB={terkunciRAB} telatSaya={telatSaya} sla={sla}
              onNew={() => setModal({ mode: "rab", rec: { tglPengajuan: today(), status: "Menunggu Pemeriksaan SKM", linkDrive: DRIVE_LINK_DEFAULT } })}
              onOpen={(no) => setDetail({ type: "rab", id: no })}
              sel={sel} toggleSel={toggleSel} toggleAll={toggleAll}
              onBulkDelete={() => konfirmasiHapusRab(sel)} countTerkait={countTerkait} onDemo={muatContoh}
              onExport={() => exportCSV("MASTER_RAB", masterRows, MASTER_COLS)} />
          )}

          {MOD[view] && boleh(view) && (
            <ModList mod={MOD[view]} rows={data[view]} rabByNo={rabByNo} q={q} setQ={setQ}
              canCreate={can(view, "create")} canDelete={can(view, "edit")} cfg={cfg} role={role}
              onNew={() => setModal(view === "lpj"
                ? { mode: "lpj", rec: defaults(F.lpj) }
                : { mode: "form", mod: view, rec: {
                    ...defaults(F[view]),
                    /* PIC sudah diketahui dari sesi yang masuk — tidak perlu diketik ulang.
                       Tanpa ini, brief tersimpan tanpa PIC dan tidak pernah muncul di
                       pilihan "Ambil dari brief" saat menyusun RAB. */
                    ...(view === "brief" && role === "PIC" ? { pic: sesi.nama } : {}),
                  } })}
              onOpen={(id) => setDetail({ type: view, id })}
              sel={sel} toggleSel={toggleSel} toggleAll={toggleAll}
              onBulkDelete={() => konfirmasiHapusRec(view, sel)} onDemo={muatContoh}
              onExport={() => exportCSV(MOD[view].label.replace(/\s/g, "_"), data[view],
                F[view].map((f) => ({ l: f.l, v: f.k })).concat([{ l: "Nomor dokumen", v: "id" }])) } />
          )}

          {view === "kalender" && boleh("kalender") && (
            <Kalender rows={masterRows} lpjList={data.lpj} cfg={cfg} sla={sla} role={role} sesi={sesi}
              daftarPic={data.master.pics}
              onBukaRab={(no) => setDetail({ type: "rab", id: no })}
              onBukaLpj={(id) => setDetail({ type: "lpj", id })} />
          )}

          {view === "kas" && boleh("kas") && (
            <KasPembayaran data={data} rows={masterRows} role={role} sesi={sesi} commit={commit}
              exportCSV={exportCSV} konfirm={konfirm}
              onBukaRab={(no) => setDetail({ type: "rab", id: no })}
              onBukaDana={(id) => setDetail({ type: "dana", id })} />
          )}

          {view === "hotel" && boleh("hotel") && (
            <PermintaanHotel data={data} role={role} sesi={sesi} commit={commit} konfirm={konfirm} />
          )}

          {view === "alur" && <AlurKerja role={role} go={setView} />}

          {view === "panduan" && <Panduan role={role} go={setView} sla={data.master.slaLpjHari} cfg={cfg} />}

          {view === "manual" && <ManualBook cfg={cfg} sla={data.master.slaLpjHari} />}

          {view === "laporan" && (
            <Laporan rows={masterRows} data={data} exportCSV={exportCSV} />
          )}

          {view === "master" && (
            <MasterData data={data} commit={commit} role={role} konfirm={konfirm} onDemo={muatContoh} />
          )}

          {view === "pengguna" && (
            <Pengguna data={data} commit={commit} role={role} sesi={sesi} konfirm={konfirm} />
          )}

          {view === "konfig" && (
            <Konfigurasi data={data} cfg={cfg} commit={commit} role={role} />
          )}

          {!boleh(view) && (
            <div className="empty"><h3>Menu ini tidak terbuka untuk {labelPeran(role)}</h3>
              <p>Menu menyesuaikan posisi masing-masing. Bila Anda merasa seharusnya punya akses,
                hubungi IT / Admin.</p>
              <button className="btn" onClick={() => setView("dash")}>Kembali ke Dashboard</button></div>
          )}
        </div>
      </div>

      {/* ---------- MODAL FORM ---------- */}
      {modal?.mode === "lpj" && (
        <LpjForm rec={modal.rec} data={data} cfg={cfg} rabRows={masterRows}
          onClose={() => setModal(null)} onSave={(v) => saveRecord("lpj", v)} />
      )}
      {modal?.mode === "form" && (
        <FormModal
          title={`${modal.rec.id ? "Ubah" : "Tambah"} ${MOD[modal.mod].label}`}
          fields={F[modal.mod]} value={modal.rec} master={data.master} rabOptions={data.rabs}
          modKey={modal.mod} rabRows={masterRows} semua={{ brief: data.brief, rabs: data.rabs }}
          onClose={() => setModal(null)} onSave={(v) => saveRecord(modal.mod, v)} />
      )}
      {modal?.mode === "rab" && (
        <RabForm rec={modal.rec} data={data} cfg={cfg} onClose={() => setModal(null)} onSave={saveRab} />
      )}

      {/* ---------- DRAWER DETAIL ---------- */}
      {detail?.type === "rab" && rabByNo[detail.id] && (
        <RabDetail row={rabByNo[detail.id]} role={role} isApprover={isApprover} canRab={canRab}
          onClose={() => setDetail(null)}
          onEdit={() => { setModal({ mode: "rab", rec: rabByNo[detail.id] }); setDetail(null); }}
          onApprove={(d, c) => stampApproval(detail.id, d, c)} bisaLanjut={EDIT_LANJUT.includes(role)}
          onStatus={(s) => setRabStatus(detail.id, s)}
          onDelete={() => removeRec("rabs", detail.id)} konfirm={konfirm}
          onRealisasi={simpanRealisasi} bisaRealisasi={role === "SKM"}
          masterPrice={data.master.priceList} masterVendor={data.master.vendors} sla={sla}
          openRec={(t, id) => setDetail({ type: t, id })} />
      )}
      {detail && MOD[detail.type] && (
        <RecDetail key={`${detail.type}-${detail.id}`} mod={MOD[detail.type]} rec={data[detail.type].find((x) => x.id === detail.id)}
          role={role} sesi={sesi} onClose={() => setDetail(null)}
          onEdit={(r) => { setModal(detail.type === "lpj"
            ? { mode: "lpj", rec: r } : { mode: "form", mod: detail.type, rec: r }); setDetail(null); }}
          onStatus={(s) => setRecStatus(detail.type, detail.id, s)}
          onDelete={() => removeRec(detail.type, detail.id)} konfirm={konfirm}
          cfg={cfg} onVerifikasi={verifikasiLpj} data={data} commit={commit}
          bisaLanjut={EDIT_LANJUT.includes(role)} onApproveDana={approveDana}
          openRab={(no) => setDetail({ type: "rab", id: no })}
          rabRow={rabByNo[data[detail.type].find((x) => x.id === detail.id)?.rabNo]} />
      )}

      {ask && (
        <>
          <div className="scrim" style={{ zIndex: 60 }} onClick={() => setAsk(null)} />
          <div className="askbox" role="alertdialog" aria-label={ask.judul}>
            <h2>{ask.judul}</h2>
            {ask.isi && <p>{ask.isi}</p>}
            {ask.info ? null : <p className="warn">Tindakan ini tidak bisa dibatalkan.</p>}
            <div className="actions">
              <button className="btn ghost sm" onClick={() => setAsk(null)}>
                {ask.info ? "Mengerti" : "Batal"}</button>
              {!ask.info && (
                <button className="btn no sm" autoFocus
                  onClick={() => { const a = ask.aksi; setAsk(null); a(); }}>Ya, hapus</button>
              )}
            </div>
          </div>
        </>
      )}

      {toast && <div className="toast" role="status">{toast}</div>}

      {unduhSiap && (
        <div style={{ position: "fixed", right: 20, bottom: 20, zIndex: 90, background: "#fff",
          border: "1px solid #D3D7CF", borderRadius: 4, padding: "12px 14px", boxShadow: "0 8px 26px #14232C26",
          maxWidth: 300 }}>
          <p style={{ fontSize: 12.5, margin: "0 0 8px" }}>
            Berkas siap. Kalau tidak otomatis terunduh, klik kanan tautan ini dan pilih
            <i> Simpan Tautan Sebagai…</i>
          </p>
          <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
            <a href={unduhSiap.href} download={unduhSiap.nama} target="_blank" rel="noreferrer"
              className="btn ok sm" style={{ display: "inline-block", textDecoration: "none" }}
              onClick={() => setTimeout(() => setUnduhSiap(null), 400)}>
              Unduh {unduhSiap.nama}</a>
            <button className="btn ghost sm" onClick={() => setUnduhSiap(null)}>Tutup</button>
          </div>
        </div>
      )}
    </div>
  );
}

const defaults = (fields) => Object.fromEntries(fields.filter((f) => f.def).map((f) => [f.k, f.def]));
