const HARI = ["Sen", "Sel", "Rab", "Kam", "Jum", "Sab", "Min"];
const BULAN = ["Januari", "Februari", "Maret", "April", "Mei", "Juni",
  "Juli", "Agustus", "September", "Oktober", "November", "Desember"];


/* Penanda LPJ: bentuknya ditentukan tahap yang sedang ditunggu,
   dan disorot bila tahap itu memang giliran peran yang sedang masuk. */
const tandaLpj = (row, lpj, cfg, sla, role) => {
  const batas = tambahHari(tglAkhir(row), sla);
  const telat = bedaHari(batas, today());
  if (lpj && lpj.status === "Approved / Closed")
    return { kelas: "lpj-tutup", ikon: "OK", label: "LPJ selesai", tahap: null,
      milik: null, batas, telat, urut: 4 };
  if (lpj && lpj.status === "Rejected")
    return { kelas: "lpj-telat", ikon: "X", label: "LPJ ditolak", tahap: null,
      milik: null, batas, telat, urut: 0 };
  if (!lpj) {
    return telat > 0
      ? { kelas: "lpj-telat", ikon: "!", label: `LPJ telat ${telat} hari`, tahap: "PIC",
          milik: "PIC", batas, telat, urut: 0 }
      : { kelas: "lpj", ikon: "•", label: "Batas LPJ", tahap: "PIC", milik: "PIC",
          batas, telat, urut: 1 };
  }
  const t = tahapBerikut(lpj, cfg);
  if (!t) return { kelas: "lpj-tutup", ikon: "OK", label: "LPJ selesai", tahap: null,
    milik: null, batas, telat, urut: 4 };
  const inisial = { SKM: "S", DIVISI: "D", FAT: "F", OWNER: "O" }[t.k] || "?";
  return {
    kelas: telat > 0 ? "lpj-telat" : "lpj-jalan",
    ikon: inisial,
    label: `Menunggu ${ROLES[t.k].split(" (")[0]}`,
    tahap: t.k, milik: t.k, batas, telat,
    urut: telat > 0 ? 0 : 2,
  };
};

function Kalender({ rows, lpjList, cfg, sla, role, sesi, daftarPic, onBukaRab, onBukaLpj }) {
  const kini = new Date();
  const [bln, setBln] = useState({ y: kini.getFullYear(), m: kini.getMonth() });
  const [pilih, setPilih] = useState(today());
  const [saring, setSaring] = useState("semua");

  /* Semua penanda dikumpulkan per tanggal */
  const perTanggal = useMemo(() => {
    const peta = {};
    const taruh = (tgl, item) => { if (!tgl) return; (peta[tgl] = peta[tgl] || []).push(item); };

    rows.forEach((r) => {
      if (/Cancelled|Rejected/.test(r.status || "")) return;
      const hari = rentangHari(r.tglKegiatan, r.tglSelesai);
      hari.forEach((h, i) => taruh(h, {
        jenis: "keg", kelas: "keg", ikon: "K", urut: 3,
        judul: hari.length > 1 ? `${r.nama} (hari ${i + 1}/${hari.length})` : r.nama,
        sub: `${r.brand ? r.brand + " · " : ""}${r.divisi} · ${r.pic}`,
        nilai: r.total, no: r.no, pic: r.pic, milik: "PIC", crew: r.crew || [],
        mulai: r.tglKegiatan, selesai: tglAkhir(r), buka: () => onBukaRab(r.no),
      }));

      if (r.tglKegiatan) {
        const lpj = lpjList.find((l) => l.rabNo === r.no);
        const t = tandaLpj(r, lpj, cfg, sla, role);
        taruh(t.batas, {
          jenis: "lpj", kelas: t.kelas, ikon: t.ikon, urut: t.urut,
          judul: r.nama, sub: `${t.label} · ${r.pic}`, tahap: t.tahap, milik: t.milik,
          telat: t.telat, no: r.no, pic: r.pic,
          buka: () => (lpj ? onBukaLpj(lpj.id) : onBukaRab(r.no)),
        });
      }

      (r.lines || []).forEach((l) => {
        /* Item yang sudah dibayar tetap tampil walau kegiatannya sudah ditutup. */
        const sudah = !!l.lunas || !!(r.petaAP || {})[String(l.item || "").trim().toLowerCase()];
        if (!sudah && (!l.jatuhTempo || /Closed/.test(r.status || ""))) return;
        /* Sudah dibayar begitu Finance AP mencairkan; konfirmasi SKM menjadi keterangan tambahan. */
        const ap = (r.petaAP || {})[String(l.item || "").trim().toLowerCase()];
        const dibayar = !!l.lunas || !!ap;
        const tglBayar = l.tglBayar || (ap && (ap.tgl || ap.tglCair)) || "";
        taruh(dibayar ? (tglBayar || l.jatuhTempo) : l.jatuhTempo, {
          jenis: "tempo", kelas: dibayar ? "bayar-ok" : "tempo", ikon: dibayar ? "OK" : "Rp",
          urut: dibayar ? 5 : 2,
          judul: `${dibayar ? "Sudah dibayar" : "Bayar"} ${l.item || "item biaya"}`,
          nilai: dibayar
            ? (Number(l.realisasi) || (ap && ap.nilai) || (Number(l.qty) || 0) * (Number(l.harga) || 0))
            : (Number(l.qty) || 0) * (Number(l.harga) || 0),
          sub: `${l.caraBayar === "Dibayar ke PIC" ? "Ke PIC" : "Ke vendor"} · ` +
            `${l.vendor || "vendor belum diisi"} · ` +
            (dibayar
              ? `dibayar ${tglBayar || "—"}${l.lunas ? "" : " · menunggu konfirmasi SKM"}`
              : (l.termin || "termin belum diisi")),
          rekening: l.rekening || "",
          milik: dibayar ? (l.lunas ? null : "SKM") : "AP",
          no: r.no, pic: r.pic, buka: () => onBukaRab(r.no),
        });
      });
    });

    Object.values(peta).forEach((a) => a.sort((x, y) => x.urut - y.urut));
    return peta;
  }, [rows, lpjList, cfg, sla, role, onBukaRab, onBukaLpj]);

  /* Satu aturan sorotan untuk semua jenis penanda: hijau bila menunggu peran ini. */
  const punyaSaya = (it) => {
    if (role === "PIC") return it.milik === "PIC" && it.pic === sesi.nama;
    return it.milik === role;
  };

  const cocok = (it) => {
    if (saring === "semua") return true;
    if (saring === "saya") return punyaSaya(it);
    return it.jenis === saring;
  };

  /* Susunan sel: Senin sebagai hari pertama */
  const sel = useMemo(() => {
    const awal = new Date(bln.y, bln.m, 1);
    const geser = (awal.getDay() + 6) % 7;
    const mulai = new Date(bln.y, bln.m, 1 - geser);
    return Array.from({ length: 42 }, (_, i) => {
      const d = new Date(mulai); d.setDate(mulai.getDate() + i);
      return { tgl: tglStr(d), tanggal: d.getDate(), luar: d.getMonth() !== bln.m,
        akhir: [0, 6].includes(d.getDay()) };
    });
  }, [bln]);

  const isiHari = (tgl) => (perTanggal[tgl] || []).filter(cocok);
  const terpilih = isiHari(pilih);

  /* Yang menunggu peran ini, di bulan mana pun */
  const tugasSaya = useMemo(() => {
    const out = [];
    Object.entries(perTanggal).forEach(([tgl, arr]) => arr.forEach((it) => {
      if (it.jenis === "keg") return;
      const saya = role === "PIC"
        ? (it.milik === "PIC" && it.pic === sesi.nama)
        : it.milik === role;
      if (saya) out.push({ ...it, tgl, telat: it.telat != null ? it.telat : bedaHari(tgl, today()) });
    }));
    return out.sort((a, b) => a.tgl.localeCompare(b.tgl)).slice(0, 8);
  }, [perTanggal, role, sesi.nama]);

  /* Siapa bertugas pada tanggal terpilih, dan siapa yang masih bebas */
  const crewHariIni = useMemo(() => {
    const out = [];
    (perTanggal[pilih] || []).forEach((it) => {
      if (it.jenis !== "keg") return;
      (it.crew || []).forEach((c) => c.nama && out.push({
        nama: c.nama, peran: c.peran, hari: c.hari, kegiatan: it.judul.replace(/ \(hari .*\)$/, ""),
      }));
    });
    return out;
  }, [perTanggal, pilih]);

  const bebasHariIni = useMemo(() => {
    const sibuk = new Set(crewHariIni.map((c) => c.nama));
    return (daftarPic || []).filter((n) => !sibuk.has(n));
  }, [crewHariIni, daftarPic]);

  const geserBulan = (n) => setBln((p) => {
    const d = new Date(p.y, p.m + n, 1);
    return { y: d.getFullYear(), m: d.getMonth() };
  });

  const Contoh = ({ kelas, ikon }) => (
    <span className={`chip ${kelas} s`} style={{ width: "auto", padding: "1px 5px" }}>
      <span className="ik">{ikon}</span></span>
  );

  return (
    <>
      <div className="kal-nav">
        <button className="btn ghost sm" onClick={() => geserBulan(-1)} aria-label="Bulan sebelumnya">←</button>
        <h2>{BULAN[bln.m]} {bln.y}</h2>
        <button className="btn ghost sm" onClick={() => geserBulan(1)} aria-label="Bulan berikutnya">→</button>
        <button className="btn ghost sm" onClick={() => {
          const k = new Date();
          setBln({ y: k.getFullYear(), m: k.getMonth() }); setPilih(today());
        }}>Hari ini</button>
        <div className="spacer" />
        <select value={saring} onChange={(e) => setSaring(e.target.value)}
          style={{ fontFamily: "inherit", fontSize: 13, padding: "5px 8px",
            border: "1px solid var(--line)", background: "#fff", borderRadius: 2 }}>
          <option value="semua">Tampilkan semua</option>
          <option value="saya">Hanya yang menunggu saya</option>
          <option value="keg">Hanya kegiatan</option>
          <option value="lpj">Hanya batas LPJ</option>
          <option value="tempo">Hanya pembayaran</option>
        </select>
      </div>

      <div className="kal">
        <div>
          <div className="kal-grid">
            <div className="kal-hd">{HARI.map((h) => <span key={h}>{h}</span>)}</div>
            <div className="kal-body">
              {sel.map((c) => {
                const isi = isiHari(c.tgl);
                return (
                  <button key={c.tgl} onClick={() => setPilih(c.tgl)}
                    className={"kal-sel" + (c.luar ? " luar" : "") + (c.akhir ? " akhir" : "") +
                      (c.tgl === today() ? " kini" : "") + (c.tgl === pilih ? " pilih" : "")}>
                    <span className="tgl">{c.tanggal}</span>
                    {isi.slice(0, 3).map((it, i) => {
                      const saya = punyaSaya(it);
                      const lain = !saya && it.milik && it.jenis !== "keg";
                      return (
                        <span key={i} className={`chip ${it.kelas}` +
                          (saya ? " saya" : "") + (lain ? " lain" : "")}
                          title={`${it.judul} — ${it.sub}`}>
                          <span className="ik">{it.ikon}</span>{it.judul}
                        </span>
                      );
                    })}
                    {isi.length > 3 && <span className="kal-lain">+{isi.length - 3} lagi</span>}
                  </button>
                );
              })}
            </div>
          </div>
        </div>

        <div className="kal-sisi">
          <div className="card">
            <h3>{pilih === today() ? "Hari ini" : "Tanggal terpilih"} — {pilih}</h3>
            {terpilih.length === 0 && (
              <p style={{ fontSize: 12.5, color: "var(--muted)", margin: 0 }}>
                Tidak ada agenda pada tanggal ini.</p>
            )}
            {terpilih.map((it, i) => (
              <button key={i} className="kal-item" onClick={it.buka}>
                <span className={`chip ${it.kelas}`} style={{ width: "auto", flex: "0 0 auto" }}>
                  <span className="ik">{it.ikon}</span></span>
                <span style={{ flex: 1, minWidth: 0 }}>
                  <span className="b" style={{ display: "block" }}>{it.judul}</span>
                  <span className="m" style={{ display: "block" }}>{it.sub}</span>
                  <span className="mono" style={{ fontSize: 11, color: "var(--muted)", display: "block" }}>
                    {it.no}{it.nilai ? ` · ${rp(it.nilai)}` : ""}</span>
                  {it.rekening ? (
                    <span className="mono" style={{ fontSize: 10.5, color: "var(--muted)", display: "block" }}>
                      {it.rekening}</span>
                  ) : null}
                  {it.jenis === "keg" && (it.crew || []).length > 0 && (
                    <span style={{ display: "block", marginTop: 5 }}>
                      <span style={{ fontSize: 10.5, letterSpacing: ".08em", textTransform: "uppercase",
                        color: "var(--muted)" }}>Crew bertugas ({it.crew.length})</span>
                      {it.crew.map((c, j) => (
                        <span key={j} style={{ display: "block", fontSize: 11.5, lineHeight: 1.45 }}>
                          {c.nama || "(nama belum diisi)"}
                          <span style={{ color: "var(--muted)" }}>
                            {c.peran ? ` — ${c.peran}` : ""}{c.hari ? ` · ${c.hari} hari` : ""}</span>
                        </span>
                      ))}
                    </span>
                  )}
                  {it.jenis === "keg" && !(it.crew || []).length && (
                    <span style={{ display: "block", fontSize: 11, color: "#9C7112", marginTop: 4 }}>
                      Belum ada crew dialokasikan.</span>
                  )}
                </span>
              </button>
            ))}
          </div>

          {crewHariIni.length > 0 && (
            <div className="card">
              <h3>Crew bertugas {pilih === today() ? "hari ini" : "tanggal ini"} ({crewHariIni.length})</h3>
              {crewHariIni.map((c, i) => (
                <div key={i} style={{ display: "flex", gap: 9, alignItems: "baseline",
                  padding: "6px 0", borderBottom: "1px solid var(--line2)" }}>
                  <span style={{ flex: 1, fontSize: 12.5, fontWeight: 600 }}>{c.nama}</span>
                  <span style={{ fontSize: 11.5, color: "var(--muted)", textAlign: "right", flex: 1 }}>
                    {c.peran || "peran belum diisi"}<br />
                    <span style={{ fontSize: 11 }}>{c.kegiatan}</span>
                  </span>
                </div>
              ))}
              <p style={{ fontSize: 11.5, color: "var(--muted)", margin: "9px 0 0", lineHeight: 1.45 }}>
                {bebasHariIni.length
                  ? `Masih tersedia: ${bebasHariIni.join(", ")}.`
                  : "Seluruh crew sedang bertugas pada tanggal ini."}
              </p>
            </div>
          )}

          {tugasSaya.length > 0 && (
            <div className="card" style={{ borderTop: "3px solid var(--green)" }}>
              <h3>Menunggu {ROLES[role].split(" (")[0]} ({tugasSaya.length})</h3>
              {tugasSaya.map((it, i) => (
                <button key={i} className="kal-item" onClick={it.buka}>
                  <span className={`chip ${it.kelas} saya`} style={{ width: "auto", flex: "0 0 auto" }}>
                    <span className="ik">{it.ikon}</span></span>
                  <span style={{ flex: 1, minWidth: 0 }}>
                    <span className="b" style={{ display: "block" }}>{it.judul}</span>
                    <span className="m" style={{ display: "block" }}>
                      {it.telat > 0 ? `Batas ${it.tgl} — telat ${it.telat} hari` : `Batas ${it.tgl}`}</span>
                  </span>
                </button>
              ))}
            </div>
          )}

          <div className="card">
            <h3>Arti penanda</h3>
            <div className="leg"><Contoh kelas="keg" ikon="K" />
              <span><b>Kegiatan berlangsung</b> — tanggal pelaksanaan sesuai RAB.</span></div>
            <div className="leg"><Contoh kelas="tempo" ikon="Rp" />
              <span><b>Belum dibayar</b> — batas bayar item biaya, tampil pada tanggal jatuh tempo.</span></div>
            <div className="leg"><Contoh kelas="bayar-ok" ikon="OK" />
              <span><b>Sudah dibayar</b> — Finance AP sudah mencairkan, penanda pindah ke tanggal
                pembayaran sebenarnya. Selama SKM belum mengonfirmasi di RAB, keterangannya bertuliskan
                “menunggu konfirmasi SKM”.</span></div>

            <div style={{ borderTop: "1px solid var(--line2)", margin: "9px 0 5px", paddingTop: 8,
              fontSize: 11, letterSpacing: ".08em", textTransform: "uppercase", color: "var(--muted)" }}>
              Batas LPJ — berubah mengikuti tahapnya
            </div>
            <div className="leg"><Contoh kelas="lpj" ikon="•" />
              <span><b>Belum jatuh tempo</b> — PIC belum mengisi LPJ, masih dalam batas {sla} hari.</span></div>
            <div className="leg"><Contoh kelas="lpj-jalan" ikon="S" />
              <span><b>Menunggu SKM</b> — LPJ sudah masuk, diperiksa SKM.</span></div>
            <div className="leg"><Contoh kelas="lpj-jalan" ikon="D" />
              <span><b>Menunggu Atasan Divisi</b> — SKM sudah selesai.</span></div>
            <div className="leg"><Contoh kelas="lpj-jalan" ikon="F" />
              <span><b>Menunggu Atasan FAT</b> — sudah lewat divisi.</span></div>
            <div className="leg"><Contoh kelas="lpj-jalan" ikon="O" />
              <span><b>Menunggu Owner</b> — verifikasi terakhir.</span></div>
            <div className="leg"><Contoh kelas="lpj-telat" ikon="!" />
              <span><b>Lewat batas waktu</b> — apa pun tahapnya, warnanya menjadi merah.</span></div>
            <div className="leg"><Contoh kelas="lpj-tutup" ikon="OK" />
              <span><b>LPJ selesai</b> — seluruh tahap verifikasi terlewati.</span></div>

            <div style={{ borderTop: "1px solid var(--line2)", margin: "9px 0 5px", paddingTop: 8 }}>
              <div className="leg"><Contoh kelas="lpj-jalan saya" ikon="D" />
                <span><b>Bergaris hijau</b> — penanda ini menunggu <b>{ROLES[role].split(" (")[0]}</b>,
                  yaitu Anda. Yang menunggu posisi lain ditampilkan lebih pudar, jadi kalender ini
                  terlihat berbeda bagi setiap posisi.</span></div>
            </div>
          </div>
        </div>
      </div>
    </>
  );
}

/* ========================= KAS & PEMBAYARAN (meja kerja Finance AP) ========================= */

function KasPembayaran({ data, rows, role, sesi, commit, exportCSV, konfirm, onBukaRab, onBukaDana }) {
  const [tab, setTab] = useState("antrian");
  const [isian, setIsian] = useState({});
  const bisaProses = role === "AP";
  const [galat, setGalat] = useState("");

  /* Lampiran disimpan sebagai data URL di dalam data aplikasi, jadi ukurannya dibatasi ketat.
     Untuk berkas besar, pakai link Google Drive. */
  const BATAS_LAMPIRAN = 400 * 1024;
  const bacaBerkas = (file) => new Promise((selesai, gagal) => {
    if (!/^image\/|^application\/pdf$/.test(file.type))
      return gagal(new Error("Hanya gambar (JPG, PNG) atau PDF yang bisa dilampirkan."));
    if (file.size > BATAS_LAMPIRAN)
      return gagal(new Error(`Berkas ${(file.size / 1024).toFixed(0)} KB melebihi batas 400 KB. ` +
        "Unggah ke Google Drive lalu tempel tautannya di kolom Link bukti."));
    const fr = new FileReader();
    fr.onload = () => selesai({ nama: file.name, tipe: file.type, ukuran: file.size, data: fr.result });
    fr.onerror = () => gagal(new Error("Berkas gagal dibaca."));
    fr.readAsDataURL(file);
  });

  /* Pengajuan lama belum menyimpan rincian item — ambil dari RAB-nya. */
  const itemDana = (d) => (d.lines && d.lines.length)
    ? d.lines
    : ((d.rab && d.rab.lines) || []).map((l) => ({
        item: l.item, kategori: l.kategori, qty: l.qty, satuan: l.satuan, harga: l.harga,
        nilai: (Number(l.qty) || 0) * (Number(l.harga) || 0),
        caraBayar: l.caraBayar || "", vendor: l.vendor || "", rekening: l.rekening || "",
        termin: l.termin || "", jatuhTempo: l.jatuhTempo || "",
      }));

  /* Salinan bukti per item untuk satu pengajuan */
  const buktiDari = (d) => (isian[d.id]?.lines) ||
    itemDana(d).map((l) => ({ ref: l.buktiRef || "", tgl: l.buktiTgl || "",
      link: l.buktiLink || DRIVE_LINK_DEFAULT, file: l.buktiFile || null }));
  const setBukti = (d, i, patch) => {
    const arr = buktiDari(d).map((b, j) => j === i ? { ...b, ...patch } : b);
    setIsian({ ...isian, [d.id]: { ...isian[d.id], lines: arr } });
  };
  const adaBukti = (b) => !!(String(b.ref || "").trim() || String(b.link || "").trim() || b.file);

  const rabDari = (no) => rows.find((r) => r.no === no) || {};

  /* Pengajuan dana dikelompokkan menurut posisinya di alur */
  const kelompok = useMemo(() => {
    const out = { antrian: [], tunggu: [], selesai: [] };
    (data.dana || []).forEach((d) => {
      const rantai = rantaiDana(d.jumlah);
      const giliran = berikutnya(rantai, d.approvals);
      const item = { ...d, giliran, rab: rabDari(d.rabNo) };
      if (/Ditolak/.test(d.status)) return;
      if (d.status === "Cair") out.selesai.push(item);
      else if (!giliran) out.antrian.push(item);
      else out.tunggu.push(item);
    });
    out.antrian.sort((a, b) => String(a.tglButuh).localeCompare(String(b.tglButuh)));
    out.tunggu.sort((a, b) => String(a.tglButuh).localeCompare(String(b.tglButuh)));
    out.selesai.sort((a, b) => String(b.tglCair).localeCompare(String(a.tglCair)));
    return out;
  }, [data.dana, rows]);

  /* Item biaya yang belum dibayar, lintas RAB — dasar penjadwalan transfer */
  const jadwal = useMemo(() => {
    const out = [];
    rows.forEach((r) => {
      if (/Cancelled|Rejected/.test(r.status || "")) return;
      (r.lines || []).forEach((l, i) => {
        if (l.lunas) return;
        out.push({
          key: `${r.no}-${i}`, no: r.no, kegiatan: r.nama, pic: r.pic, poOdoo: r.poOdoo,
          statusRab: r.status, item: l.item, kategori: l.kategori,
          nilai: (Number(l.qty) || 0) * (Number(l.harga) || 0),
          caraBayar: l.caraBayar || "", vendor: l.vendor || "", rekening: l.rekening || "",
          termin: l.termin || "", jatuhTempo: l.jatuhTempo || "",
          sisa: l.jatuhTempo ? bedaHari(today(), l.jatuhTempo) : null,
        });
      });
    });
    return out.sort((a, b) => {
      if (a.jatuhTempo && b.jatuhTempo) return a.jatuhTempo.localeCompare(b.jatuhTempo);
      return a.jatuhTempo ? -1 : b.jatuhTempo ? 1 : 0;
    });
  }, [rows]);

  const nilai = (arr) => arr.reduce((a, x) => a + (Number(x.jumlah ?? x.nilai) || 0), 0);
  const lewat = jadwal.filter((x) => x.sisa !== null && x.sisa < 0);
  const dekat = jadwal.filter((x) => x.sisa !== null && x.sisa >= 0 && x.sisa <= 7);
  const tanpaRek = jadwal.filter((x) => !x.rekening.trim());
  const { y, m } = ym();
  const cairBulanIni = kelompok.selesai.filter((d) => String(d.tglCair || "").startsWith(`${y}-${m}`));

  const proses = (d, status) => {
    const patch = { status, updated: today() };
    const bukti = buktiDari(d);
    patch.lines = itemDana(d).map((l, i) => ({ ...l,
      buktiRef: bukti[i]?.ref || "", buktiTgl: bukti[i]?.tgl || "",
      buktiLink: bukti[i]?.link || "", buktiFile: bukti[i]?.file || null }));
    if (status === "Cair") {
      patch.tglCair = isian[d.id]?.tglCair || today();
      patch.buktiBayar = isian[d.id]?.buktiBayar || d.buktiBayar || "";
      patch.diprosesOleh = sesi.nama;
    }
    commit({ ...data, dana: data.dana.map((x) => x.id === d.id ? { ...x, ...patch } : x) },
      status === "Cair" ? `${d.id} dicatat cair.` : `${d.id} sedang diproses.`);
  };

  const konfirmasiCair = (d) => {
    const item = itemDana(d);
    const belumRek = item.filter((l) => !String(l.rekening || "").trim()).length;
    const bukti = buktiDari(d);
    const belumBukti = item.filter((_, i) => !adaBukti(bukti[i] || {})).length;
    konfirm(`Catat ${d.id} sebagai sudah dicairkan?`,
      `${rp(d.jumlah)} untuk ${d.rab.nama || d.rabNo}, atas nama ${d.pic}. ` +
      (belumBukti
        ? `Perhatian: ${belumBukti} dari ${item.length} item belum ada bukti transfernya. `
        : `Seluruh ${item.length} item sudah ada bukti transfernya. `) +
      (belumRek ? `${belumRek} item juga belum punya nomor rekening. ` : "") +
      "Setelah dicatat, pengajuan ini masuk riwayat pencairan dan tidak bisa diubah dari sini.",
      () => proses(d, "Cair"));
  };

  const Kartu = ({ v, l, h, tone, on }) => (
    <button className={`tile ${Number(v) === 0 || v === "Rp0" ? "zero" : tone || ""}`} onClick={on}>
      <div className="v">{v}</div><div className="l">{l}</div><div className="h">{h}</div>
    </button>
  );

  const TAB = [
    ["antrian", `Antrian pencairan (${kelompok.antrian.length})`],
    ["jadwal", `Jadwal transfer (${jadwal.length})`],
    ["tunggu", `Belum disetujui (${kelompok.tunggu.length})`],
    ["riwayat", `Riwayat pencairan (${kelompok.selesai.length})`],
  ];

  return (
    <>
      {!bisaProses && (
        <div className="note">
          Anda melihat meja kerja Finance AP sebagai pemantau. Pencatatan pencairan hanya bisa dilakukan
          oleh Finance AP.
        </div>
      )}

      <div className="cluster">
        <div className="tiles">
          <Kartu v={kelompok.antrian.length} l="Siap dicairkan" h="Approval sudah lengkap"
            tone="good" on={() => setTab("antrian")} />
          <Kartu v={rp(nilai(kelompok.antrian))} l="Nilai siap dicairkan" h="Finance AP"
            on={() => setTab("antrian")} />
          <Kartu v={lewat.length} l="Item lewat jatuh tempo" h="Perlu segera dibayar"
            tone="bad" on={() => setTab("jadwal")} />
          <Kartu v={dekat.length} l="Jatuh tempo ≤7 hari" h="Siapkan transfer"
            tone="warn" on={() => setTab("jadwal")} />
          <Kartu v={tanpaRek.length} l="Item tanpa rekening" h="Kembalikan ke SKM"
            tone="warn" on={() => setTab("jadwal")} />
          <Kartu v={rp(nilai(cairBulanIni))} l="Sudah cair bulan ini" h="Riwayat"
            on={() => setTab("riwayat")} />
        </div>
      </div>

      <div className="toolbar">
        {TAB.map(([k, l]) => (
          <button key={k} className={"btn sm " + (tab === k ? "" : "ghost")} onClick={() => setTab(k)}>{l}</button>
        ))}
        <div className="spacer" />
        <button className="btn ghost sm" onClick={() => exportCSV("Daftar_transfer",
          tab === "antrian" ? kelompok.antrian : jadwal,
          tab === "antrian"
            ? [{ l: "Nomor pengajuan", v: "id" }, { l: "Nomor RAB", v: "rabNo" },
               { l: "Kegiatan", v: (d) => d.rab.nama || "" }, { l: "PIC", v: "pic" },
               { l: "Jumlah", v: "jumlah" }, { l: "Tanggal kebutuhan", v: "tglButuh" },
               { l: "Status", v: "status" }]
            : [{ l: "Nomor RAB", v: "no" }, { l: "Kegiatan", v: "kegiatan" },
               { l: "Item biaya", v: "item" }, { l: "Dibayar ke", v: "caraBayar" },
               { l: "Penerima", v: (x) => x.caraBayar === "Dibayar ke PIC" ? x.pic : x.vendor },
               { l: "Rekening", v: "rekening" }, { l: "Termin", v: "termin" },
               { l: "Batas bayar", v: "jatuhTempo" }, { l: "Nilai", v: "nilai" },
               { l: "Nomor PO Odoo", v: "poOdoo" }])}>
          Export {tab === "antrian" ? "antrian" : "jadwal"} CSV</button>
      </div>

      {/* ---------- ANTRIAN PENCAIRAN ---------- */}
      {tab === "antrian" && (
        kelompok.antrian.length === 0 ? (
          <div className="empty"><h3>Tidak ada antrian pencairan</h3>
            <p>Semua pengajuan yang approval-nya lengkap sudah diproses. Pengajuan yang masih menunggu
              persetujuan ada di tab Belum disetujui.</p></div>
        ) : (
          kelompok.antrian.map((d) => {
            const item = itemDana(d);
            const kePic = item.filter((l) => l.caraBayar === "Dibayar ke PIC");
            const keVendor = item.filter((l) => l.caraBayar === "Dibayar ke Vendor");
            const belumRek = item.filter((l) => !String(l.rekening || "").trim()).length;
            const telat = d.tglButuh ? bedaHari(d.tglButuh, today()) : 0;
            return (
              <div className="card" key={d.id} style={{ borderTop: "3px solid var(--green)" }}>
                <div style={{ display: "flex", gap: 12, alignItems: "flex-start", flexWrap: "wrap" }}>
                  <div style={{ flex: 1, minWidth: 220 }}>
                    <div className="rabkey" style={{ fontSize: 13 }}>{d.id}</div>
                    <h3 style={{ margin: "3px 0 2px" }}>{d.rab.nama || d.tujuanDana || "Pengajuan dana"}</h3>
                    <div style={{ fontSize: 12, color: "var(--muted)" }}>
                      <button className="rabkey" style={{ textDecoration: "underline", padding: 0 }}
                        onClick={() => onBukaRab(d.rabNo)}>{d.rabNo}</button>
                      {" · "}{d.rab.brand ? `${d.rab.brand} · ` : ""}{d.pic}
                    </div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div className="mono" style={{ fontSize: 20, fontWeight: 500 }}>{rp(d.jumlah)}</div>
                    <div style={{ fontSize: 11.5, color: telat > 0 ? "var(--red)" : "var(--muted)" }}>
                      Dibutuhkan {d.tglButuh || "—"}
                      {telat > 0 ? ` · telat ${telat} hari` : telat < 0 ? ` · ${-telat} hari lagi` : ""}
                    </div>
                  </div>
                </div>

                <div style={{ display: "flex", gap: 7, margin: "11px 0 0", flexWrap: "wrap" }}>
                  <Pill s={d.status} />
                  {belumRek > 0 && <span className="flag">{belumRek} ITEM TANPA REKENING</span>}
                  {telat > 0 && <span className="flag">LEWAT TANGGAL KEBUTUHAN</span>}
                </div>

                {item.length > 0 && (
                  <table className="lines" style={{ marginTop: 12 }}>
                    <thead><tr><th style={{ width: "24%" }}>Item</th>
                      <th style={{ width: "9%" }}>Ke</th>
                      <th style={{ width: "24%" }}>Penerima &amp; rekening</th>
                      <th style={{ width: "15%", textAlign: "right" }}>Nilai</th>
                      <th style={{ width: "28%" }}>Bukti transfer</th></tr></thead>
                    <tbody>
                      {item.map((l, i) => {
                        const b = buktiDari(d)[i] || {};
                        return (
                          <tr key={i}>
                            <td>{l.item}<div style={{ fontSize: 10.5, color: "var(--muted)" }}>{l.kategori}</div></td>
                            <td style={{ fontSize: 11 }}>
                              <span className={"pill " + (l.caraBayar === "Dibayar ke PIC" ? "p-wait" : "p-info")}>
                                {l.caraBayar === "Dibayar ke PIC" ? "PIC" : "Vendor"}</span></td>
                            <td style={{ fontSize: 11.5 }}>
                              {l.caraBayar === "Dibayar ke PIC" ? d.pic : (l.vendor || "—")}
                              <div className="mono" style={{ fontSize: 10, color: "var(--muted)" }}>
                                {l.rekening || <span style={{ color: "var(--red)" }}>rekening belum diisi</span>}</div></td>
                            <td className="mono" style={{ textAlign: "right" }}>{num(l.nilai)}</td>
                            <td>
                              {bisaProses ? (
                                <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                                  <input value={b.ref || ""} placeholder="Nomor referensi bank"
                                    onChange={(e) => setBukti(d, i, { ref: e.target.value })} />
                                  <div style={{ display: "flex", gap: 4 }}>
                                    <input type="date" style={{ flex: "0 0 46%" }} value={b.tgl || ""}
                                      onChange={(e) => setBukti(d, i, { tgl: e.target.value })} />
                                    <input style={{ flex: 1 }} value={b.link || ""} placeholder="Link bukti Drive"
                                      onChange={(e) => setBukti(d, i, { link: e.target.value })} />
                                  </div>
                                  <span className="hint" style={{ fontSize: 10.5 }}>{DRIVE_LINK_HINT}</span>
                                  {b.file ? (
                                    <div style={{ display: "flex", gap: 5, alignItems: "center", fontSize: 10.5 }}>
                                      <a href={b.file.data} download={b.file.nama}
                                        style={{ color: "var(--blue)", flex: 1, overflow: "hidden",
                                          textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                                        {b.file.nama} ({(b.file.ukuran / 1024).toFixed(0)} KB)</a>
                                      <button className="btn ghost sm" style={{ padding: "2px 6px" }}
                                        onClick={() => setBukti(d, i, { file: null })}>×</button>
                                    </div>
                                  ) : (
                                    <label style={{ fontSize: 10.5, color: "var(--blue)", cursor: "pointer" }}>
                                      Lampirkan berkas (JPG, PNG, PDF · maks 400 KB)
                                      <input type="file" accept="image/*,application/pdf"
                                        style={{ display: "none" }}
                                        onChange={async (e) => {
                                          const f = e.target.files && e.target.files[0];
                                          if (!f) return;
                                          setGalat("");
                                          try { setBukti(d, i, { file: await bacaBerkas(f) }); }
                                          catch (err) { setGalat(err.message); }
                                          e.target.value = "";
                                        }} />
                                    </label>
                                  )}
                                </div>
                              ) : (
                                <div style={{ fontSize: 11 }}>
                                  {adaBukti(b) ? (
                                    <>
                                      {b.ref ? <div className="mono" style={{ fontSize: 10.5 }}>{b.ref}</div> : null}
                                      {b.tgl ? <div className="mono" style={{ fontSize: 10.5, color: "var(--muted)" }}>{b.tgl}</div> : null}
                                      {b.link ? <a href={b.link} target="_blank" rel="noreferrer"
                                        style={{ color: "var(--blue)", fontSize: 10.5 }}>Link bukti</a> : null}
                                      {b.file ? <div><a href={b.file.data} download={b.file.nama}
                                        style={{ color: "var(--blue)", fontSize: 10.5 }}>{b.file.nama}</a></div> : null}
                                    </>
                                  ) : <span className="flag">BELUM ADA</span>}
                                </div>
                              )}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                    <tfoot><tr>
                      <td colSpan={3} style={{ textAlign: "right", fontSize: 11, fontWeight: 400,
                        fontFamily: "inherit", color: "var(--muted)" }}>
                        Ke PIC {rp(nilai(kePic))} · Ke vendor {rp(nilai(keVendor))}</td>
                      <td style={{ textAlign: "right" }}>{num(nilai(item))}</td>
                      <td style={{ fontSize: 10.5, fontWeight: 400, fontFamily: "inherit",
                        color: "var(--muted)", paddingLeft: 6 }}>
                        {buktiDari(d).filter(adaBukti).length} dari {item.length} item ada buktinya</td>
                    </tr></tfoot>
                  </table>
                )}

                {bisaProses && galat && (
                  <div className="note" style={{ borderLeftColor: "var(--red)", background: "#FBEDEA" }}>
                    {galat}
                  </div>
                )}
                {bisaProses && (
                  <div style={{ marginTop: 13, borderTop: "1px solid var(--line2)", paddingTop: 12 }}>
                    <p style={{ fontSize: 11.5, color: "var(--muted)", margin: "0 0 11px", lineHeight: 1.5 }}>
                      Isi bukti transfer tiap item di kolom sebelah kanan sebelum menandai pengajuan ini cair.
                      Cukup salah satu: nomor referensi bank, link bukti di Drive, atau berkas lampiran.
                      Kolom di bawah ini untuk keterangan pencairan secara keseluruhan.
                    </p>
                    <div className="grid2">
                      <div className="f">
                        <label htmlFor={`tc-${d.id}`}>Tanggal transfer</label>
                        <input id={`tc-${d.id}`} type="date" value={isian[d.id]?.tglCair ?? today()}
                          onChange={(e) => setIsian({ ...isian,
                            [d.id]: { ...isian[d.id], tglCair: e.target.value } })} />
                      </div>
                      <div className="f">
                        <label htmlFor={`bb-${d.id}`}>Bukti transfer / referensi bank</label>
                        <input id={`bb-${d.id}`} value={isian[d.id]?.buktiBayar ?? (d.buktiBayar || "")}
                          placeholder="Nomor referensi atau link bukti"
                          onChange={(e) => setIsian({ ...isian,
                            [d.id]: { ...isian[d.id], buktiBayar: e.target.value } })} />
                      </div>
                    </div>
                    <div className="actions" style={{ marginTop: 11 }}>
                      {d.status !== "Sedang Diproses AP" && (
                        <button className="btn ghost sm" onClick={() => proses(d, "Sedang Diproses AP")}>
                          Tandai sedang diproses</button>
                      )}
                      <button className="btn ok sm" onClick={() => konfirmasiCair(d)}>
                        Catat sudah dicairkan</button>
                      <button className="btn ghost sm" onClick={() => onBukaDana(d.id)}>Buka pengajuan</button>
                    </div>
                    {belumRek > 0 && (
                      <p style={{ fontSize: 11.5, color: "var(--amber)", margin: "9px 0 0", lineHeight: 1.45 }}>
                        Masih ada item tanpa nomor rekening. Sebaiknya minta SKM melengkapi di RAB dulu
                        supaya transfernya tidak salah tujuan.
                      </p>
                    )}
                  </div>
                )}
                {!bisaProses && (
                  <div className="actions" style={{ marginTop: 12 }}>
                    <button className="btn ghost sm" onClick={() => onBukaDana(d.id)}>Buka pengajuan</button>
                  </div>
                )}
              </div>
            );
          })
        )
      )}

      {/* ---------- JADWAL TRANSFER ---------- */}
      {tab === "jadwal" && (
        jadwal.length === 0 ? (
          <div className="empty"><h3>Tidak ada item yang belum dibayar</h3>
            <p>Seluruh item biaya sudah ditandai lunas oleh SKM.</p></div>
        ) : (
          <div className="tablewrap">
            <table className="t">
              <thead><tr>
                <th>Batas bayar</th><th>Item biaya</th><th>Kegiatan</th>
                <th>Dibayar ke</th><th>Penerima &amp; rekening</th>
                <th style={{ textAlign: "right" }}>Nilai</th><th>Status RAB</th>
              </tr></thead>
              <tbody>
                {jadwal.map((x) => (
                  <tr key={x.key} onClick={() => onBukaRab(x.no)}>
                    <td className="mono" style={{ whiteSpace: "nowrap",
                      color: x.sisa !== null && x.sisa < 0 ? "var(--red)" : undefined }}>
                      {x.jatuhTempo || "—"}
                      {x.sisa !== null && (
                        <div style={{ fontSize: 10.5 }}>
                          {x.sisa < 0 ? `lewat ${-x.sisa} hari` : x.sisa === 0 ? "hari ini" : `${x.sisa} hari lagi`}
                        </div>
                      )}
                    </td>
                    <td>{x.item}<div style={{ fontSize: 11, color: "var(--muted)" }}>{x.kategori}</div></td>
                    <td>{x.kegiatan}<div className="rabkey" style={{ fontSize: 11 }}>{x.no}</div></td>
                    <td>{x.caraBayar
                      ? <span className={"pill " + (x.caraBayar === "Dibayar ke PIC" ? "p-wait" : "p-info")}>
                          {x.caraBayar === "Dibayar ke PIC" ? "PIC" : "Vendor"}</span>
                      : <span className="flag">BELUM</span>}</td>
                    <td>{x.caraBayar === "Dibayar ke PIC" ? x.pic : (x.vendor || "—")}
                      <div className="mono" style={{ fontSize: 10.5, color: "var(--muted)" }}>
                        {x.rekening || <span className="flag">TANPA REKENING</span>}</div></td>
                    <td className="num">{rp(x.nilai)}</td>
                    <td><Pill s={x.statusRab} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )
      )}

      {/* ---------- BELUM DISETUJUI ---------- */}
      {tab === "tunggu" && (
        kelompok.tunggu.length === 0 ? (
          <div className="empty"><h3>Tidak ada pengajuan yang menggantung</h3>
            <p>Semua pengajuan dana sudah melewati tahap approval.</p></div>
        ) : (
          <div className="tablewrap">
            <table className="t">
              <thead><tr><th>Nomor</th><th>Kegiatan</th><th>PIC</th>
                <th style={{ textAlign: "right" }}>Jumlah</th><th>Dibutuhkan</th><th>Menunggu</th></tr></thead>
              <tbody>
                {kelompok.tunggu.map((d) => (
                  <tr key={d.id} onClick={() => onBukaDana(d.id)}>
                    <td className="rabkey">{d.id}</td>
                    <td>{d.rab.nama || "—"}<div className="rabkey" style={{ fontSize: 11 }}>{d.rabNo}</div></td>
                    <td>{d.pic}</td>
                    <td className="num">{rp(d.jumlah)}</td>
                    <td className="mono" style={{ fontSize: 12 }}>{d.tglButuh || "—"}</td>
                    <td><Pill s={d.status} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )
      )}

      {/* ---------- RIWAYAT ---------- */}
      {tab === "riwayat" && (
        kelompok.selesai.length === 0 ? (
          <div className="empty"><h3>Belum ada pencairan tercatat</h3>
            <p>Pencairan yang sudah diproses akan muncul di sini beserta bukti transfernya.</p></div>
        ) : (
          <div className="tablewrap">
            <table className="t">
              <thead><tr><th>Tanggal cair</th><th>Nomor</th><th>Kegiatan</th><th>PIC</th>
                <th style={{ textAlign: "right" }}>Jumlah</th><th>Bukti transfer</th><th>Diproses</th></tr></thead>
              <tbody>
                {kelompok.selesai.map((d) => (
                  <tr key={d.id} onClick={() => onBukaDana(d.id)}>
                    <td className="mono" style={{ whiteSpace: "nowrap" }}>{d.tglCair || "—"}</td>
                    <td className="rabkey">{d.id}</td>
                    <td>{d.rab.nama || "—"}<div className="rabkey" style={{ fontSize: 11 }}>{d.rabNo}</div></td>
                    <td>{d.pic}</td>
                    <td className="num">{rp(d.jumlah)}</td>
                    <td style={{ fontSize: 11.5 }}>
                      {d.buktiBayar || <span style={{ color: "var(--muted)" }}>—</span>}
                      {(d.lines || []).some((l) => l.buktiRef || l.buktiLink || l.buktiFile) && (
                        <div style={{ fontSize: 10.5, color: "var(--muted)" }}>
                          {(d.lines || []).filter((l) => l.buktiRef || l.buktiLink || l.buktiFile).length}
                          {" dari "}{(d.lines || []).length} item ada buktinya
                        </div>
                      )}
                    </td>
                    <td style={{ fontSize: 11.5, color: "var(--muted)" }}>{d.diprosesOleh || "—"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )
      )}
    </>
  );

}

/* ========================= PERMINTAAN HOTEL (meja kerja General Affairs) ========================= */

function PermintaanHotel({ data, role, sesi, commit, konfirm }) {
  const [tab, setTab] = useState("menunggu");
  const [isian, setIsian] = useState({});
  const bisaProses = role === "GA";

  /* Ratakan seluruh baris rute dari semua brief yang punya hotel — itulah antrian GA. */
  const semua = useMemo(() => {
    const out = [];
    (data.brief || []).forEach((b) => {
      if (/Ditolak|Cancelled/.test(b.status || "")) return;
      (b.rute || []).forEach((r, i) => {
        if (!r.hotel) return;
        out.push({ key: `${b.id}-${i}`, briefId: b.id, idx: i, briefNama: b.nama, pic: b.pic,
          divisi: b.divisi, brand: b.brand, rabNo: b.rabNo || "", ...r });
      });
    });
    return out;
  }, [data.brief]);

  const kelompok = {
    menunggu: semua.filter((r) => !r.statusHotel || r.statusHotel === "Tentatif"),
    dikonfirmasi: semua.filter((r) => r.statusHotel === "Dikonfirmasi"),
    tidakTersedia: semua.filter((r) => r.statusHotel === "Tidak tersedia — perlu ganti"),
  };

  /* Konfirmasi GA otomatis masuk ke item biaya RAB (kalau RAB-nya sudah ada). Kalau RAB itu
     sudah disetujui dan nilainya berubah karena ini, approval yang ada dibatalkan — sama
     persis seperti kalau manusia mengubah nilai RAB yang sudah disetujui secara manual. */
  const simpan = (row, patch) => {
    const briefBaru = data.brief.map((b) => {
      if (b.id !== row.briefId) return b;
      const rute = (b.rute || []).map((r, i) => i === row.idx
        ? { ...r, ...patch, dikonfirmasiOleh: sesi.nama, tglKonfirmasi: today() } : r);
      return { ...b, rute };
    });

    let rabsBaru = data.rabs;
    let pesan = `Status hotel untuk ${row.briefNama} diperbarui.`;
    const briefObj = briefBaru.find((b) => b.id === row.briefId);
    const ruteRow = briefObj.rute[row.idx];

    if (briefObj.rabNo && ruteRow.statusHotel === "Dikonfirmasi" && Number(ruteRow.harga) > 0) {
      const rab = data.rabs.find((x) => x.no === briefObj.rabNo);
      if (rab) {
        const itemKey = `hotel-${row.briefId}-${row.idx}`;
        const lineBaru = {
          item: `Hotel — ${ruteRow.kota || "kota"}`, kategori: "Akomodasi",
          qty: malamRute(ruteRow), satuan: "malam",
          harga: kamarAngka(ruteRow) * (Number(ruteRow.harga) || 0),
          caraBayar: "Dibayar ke Vendor", vendor: ruteRow.hotel || "",
          dariRute: itemKey, catatan: ruteRow.catatanGA || "",
        };
        const lines = [...(rab.lines || [])];
        const idxLine = lines.findIndex((l) => l.dariRute === itemKey);
        if (idxLine >= 0) lines[idxLine] = { ...lines[idxLine], ...lineBaru };
        else lines.push(lineBaru);

        const totalLama = (rab.lines || []).reduce((a, l) => a + (Number(l.qty) || 0) * (Number(l.harga) || 0), 0);
        const totalBaru = lines.reduce((a, l) => a + (Number(l.qty) || 0) * (Number(l.harga) || 0), 0);
        const berubah = totalLama !== totalBaru;

        let rabPatch;
        if (terkunciRab(rab) && berubah) {
          rabPatch = { ...rab, lines, approvals: [], status: "Revisi", updated: today(),
            revisiSetelahApproval: (rab.revisiSetelahApproval || 0) + 1,
            riwayat: `${rab.riwayat || ""}\n[${today()}] Hotel ${ruteRow.kota || ""} dikonfirmasi GA ` +
              `(${sesi.nama}): ${ruteRow.hotel}, ${rp(totalRute(ruteRow))}. Nilai RAB berubah dari ` +
              `${rp(totalLama)} menjadi ${rp(totalBaru)}. Approval sebelumnya dibatalkan.`.trim() };
          pesan = `Hotel dikonfirmasi. RAB ${rab.no} berubah nilai — approval dibatalkan, kembali ke status Revisi.`;
        } else {
          rabPatch = { ...rab, lines, updated: today() };
          pesan = `Hotel dikonfirmasi dan otomatis masuk ke item biaya RAB ${rab.no}.`;
        }
        rabsBaru = data.rabs.map((x) => x.no === rab.no ? rabPatch : x);
      }
    }

    commit({ ...data, brief: briefBaru, rabs: rabsBaru }, pesan);
  };

  const TAB = [
    ["menunggu", `Menunggu konfirmasi (${kelompok.menunggu.length})`],
    ["dikonfirmasi", `Sudah dikonfirmasi (${kelompok.dikonfirmasi.length})`],
    ["tidakTersedia", `Tidak tersedia (${kelompok.tidakTersedia.length})`],
  ];

  const Kartu = ({ row }) => {
    const st = isian[row.key] || { hotel: row.hotel, kamar: row.kamar || "", harga: row.harga ?? "", catatan: row.catatanGA || "" };
    const setSt = (patch) => setIsian({ ...isian, [row.key]: { ...st, ...patch } });
    const tgl = row.tglSelesai && row.tglSelesai !== row.tglMulai
      ? `${row.tglMulai} s.d. ${row.tglSelesai}` : (row.tglMulai || "—");
    const rabTerkait = row.rabNo ? (data.rabs || []).find((x) => x.no === row.rabNo) : null;
    const totalPerkiraan = totalRute({ ...row, kamar: st.kamar, harga: st.harga });
    return (
      <div className="card" key={row.key}>
        <div style={{ display: "flex", gap: 12, alignItems: "flex-start", flexWrap: "wrap" }}>
          <div style={{ flex: 1, minWidth: 220 }}>
            <h3 style={{ margin: "0 0 2px" }}>{row.briefNama}</h3>
            <div style={{ fontSize: 12, color: "var(--muted)" }}>
              {row.pic} · {row.divisi}{row.brand ? ` · ${row.brand}` : ""}</div>
          </div>
          <div style={{ textAlign: "right", fontSize: 12.5 }}>
            <div className="mono">{tgl}</div>
            <div style={{ color: "var(--muted)" }}>{row.kota}{row.lokasiRinci ? ` — ${row.lokasiRinci}` : ""}</div>
          </div>
        </div>
        <dl className="kv" style={{ marginTop: 10 }}>
          <dt>Hotel diminta PIC</dt><dd>{row.hotel}{row.kamar ? ` — ${row.kamar}` : ""}</dd>
          {row.dikonfirmasiOleh && (
            <><dt>Konfirmasi terakhir</dt>
              <dd>{row.statusHotel} oleh {row.dikonfirmasiOleh}, {row.tglKonfirmasi}</dd></>
          )}
          <dt>Nomor RAB</dt>
          <dd>{row.rabNo || <span style={{ color: "var(--muted)" }}>belum dibuat dari brief ini</span>}</dd>
        </dl>
        {bisaProses && (
          <div style={{ marginTop: 12, borderTop: "1px solid var(--line2)", paddingTop: 12 }}>
            {row.rabNo && !rabTerkait && (
              <div className="note" style={{ borderLeftColor: "#B03E28", background: "#FBEDEA", marginBottom: 10 }}>
                RAB {row.rabNo} tidak ditemukan — konfirmasi tetap tersimpan di brief, tapi tidak bisa
                disinkronkan ke item biaya.
              </div>
            )}
            {rabTerkait && terkunciRab(rabTerkait) && (
              <div className="note" style={{ borderLeftColor: "#9C7112", background: "#FCF7E9", marginBottom: 10 }}>
                RAB {row.rabNo} sudah {rabTerkait.status === "Approved" ? "disetujui" : "berjalan"}. Kalau harga
                hotel ini berbeda dari yang sudah tercatat, <b>approval akan dibatalkan otomatis</b> dan RAB
                kembali ke status Revisi — leveling/approver akan melihat perubahannya di riwayat RAB.
              </div>
            )}
            <div className="grid2">
              <div className="f"><label>Hotel final</label>
                <input defaultValue={st.hotel} key={`gahotel-${row.key}-${st.hotel}`}
                  autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck={false}
                  onBlur={(e) => setSt({ hotel: e.target.value })} /></div>
              <div className="f"><label>Jumlah kamar</label>
                <input defaultValue={st.kamar} key={`gakamar-${row.key}-${st.kamar}`}
                  autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck={false}
                  onBlur={(e) => setSt({ kamar: e.target.value })} /></div>
            </div>
            <div className="grid2">
              <div className="f"><label>Harga per malam</label>
                <input type="text" inputMode="numeric" autoComplete="off" autoCorrect="off" spellCheck={false}
                  defaultValue={st.harga} key={`gaharga-${row.key}-${st.harga}`}
                  onBlur={(e) => setSt({ harga: e.target.value.replace(/[^\d]/g, "") })} /></div>
              <div className="f"><label>Perkiraan total masuk RAB</label>
                <input value={Number(st.harga) > 0 ? rp(totalPerkiraan) : "—"} disabled /></div>
            </div>
            <div className="f full"><label>Catatan (mis. alasan pindah hotel)</label>
              <input defaultValue={st.catatan} key={`gacatatan-${row.key}-${st.catatan}`}
                autoComplete="off" autoCorrect="off" spellCheck={false}
                placeholder="Kamar penuh, dialihkan ke hotel terdekat…"
                onBlur={(e) => setSt({ catatan: e.target.value })} /></div>
            <div className="actions" style={{ marginTop: 10 }}>
              <button className="btn ok sm" onClick={() => {
                simpan(row, { hotel: st.hotel, kamar: st.kamar, harga: st.harga, catatanGA: st.catatan, statusHotel: "Dikonfirmasi" });
                setIsian({ ...isian, [row.key]: undefined });
              }}>Konfirmasi hotel ini</button>
              <button className="btn no sm" onClick={() => konfirm(
                `Tandai hotel untuk ${row.briefNama} tidak tersedia?`,
                "PIC dan SKM akan melihat status ini di brief dan perlu mencari alternatif.",
                () => simpan(row, { catatanGA: st.catatan, statusHotel: "Tidak tersedia — perlu ganti" }))}>
                Tidak tersedia</button>
            </div>
          </div>
        )}
        {!bisaProses && row.catatanGA && (
          <p style={{ fontSize: 12, color: "var(--muted)", marginTop: 10 }}>Catatan GA: {row.catatanGA}</p>
        )}
      </div>
    );
  };

  return (
    <>
      {!bisaProses && (
        <div className="note">
          Anda melihat meja kerja General Affairs sebagai pemantau. Mengonfirmasi atau menolak hotel
          hanya bisa dilakukan oleh GA.
        </div>
      )}
      <div className="toolbar">
        {TAB.map(([k, l]) => (
          <button key={k} className={"btn sm " + (tab === k ? "" : "ghost")} onClick={() => setTab(k)}>{l}</button>
        ))}
      </div>
      {kelompok[tab].length === 0 ? (
        <div className="empty"><h3>Tidak ada permintaan di sini</h3>
          <p>Permintaan hotel muncul begitu PIC mengisi kolom Hotel di rute brief kegiatan.</p></div>
      ) : kelompok[tab].map((row) => <Kartu row={row} key={row.key} />)}
    </>
  );
}
