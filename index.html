const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* Penyimpanan data: tersimpan di Supabase (database bersama),
   supaya semua perangkat melihat data yang sama. */
const SUPABASE_URL = "https://wcpbhzdgfnjfuyzscupv.supabase.co";
const SUPABASE_KEY = "sb_publishable_37NOzPuHizSwJ94lD7zMUg_kG7hMZKY";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const store = {
  async get(k) {
    const { data, error } = await supabaseClient
      .from("skm_kv")
      .select("value")
      .eq("key", k)
      .maybeSingle();
    if (error) throw error;
    if (!data) throw new Error("belum ada data");
    return { key: k, value: data.value };
  },
  async set(k, v) {
    const { error } = await supabaseClient
      .from("skm_kv")
      .upsert({ key: k, value: v, updated_at: new Date().toISOString() });
    if (error) throw error;
    return { key: k, value: v };
  },
  /* Sama seperti get(), tapi juga mengembalikan updated_at dari server —
     dipakai untuk mendeteksi apakah device lain sudah mengubah data
     sejak terakhir kita muat. */
  async getWithMeta(k) {
    const { data, error } = await supabaseClient
      .from("skm_kv")
      .select("value, updated_at")
      .eq("key", k)
      .maybeSingle();
    if (error) throw error;
    if (!data) throw new Error("belum ada data");
    return { key: k, value: data.value, updatedAt: data.updated_at };
  },
  /* Simpan HANYA kalau updated_at di server masih sama seperti waktu kita
     terakhir memuat data (expectedUpdatedAt). Kalau device lain sudah
     menyimpan duluan, updated_at di server sudah berubah -> tulis ini
     akan menyentuh 0 baris, dan kita anggap itu KONFLIK (bukan langsung
     menimpa data orang lain secara diam-diam seperti sebelumnya). */
  async setSafe(k, v, expectedUpdatedAt) {
    if (!expectedUpdatedAt) return store.set(k, v);
    const nowIso = new Date().toISOString();
    const { data, error } = await supabaseClient
      .from("skm_kv")
      .update({ value: v, updated_at: nowIso })
      .eq("key", k)
      .eq("updated_at", expectedUpdatedAt)
      .select();
    if (error) throw error;
    if (!data || data.length === 0) {
      const e = new Error("KONFLIK_DATA_BERUBAH");
      e.code = "CONFLICT";
      throw e;
    }
    return { key: k, value: v, updatedAt: nowIso };
  },
};

.chip.saya{ box-shadow:0 0 0 2px #1E6E5A; font-weight:600; }
.chip.lain{ opacity:.55; }
.kal-lain{ font-size:10px; color:var(--muted); padding-left:2px; }
.kal-sisi .card{ margin-bottom:12px; }
.kal-sisi h3{ font-size:13px; margin-bottom:9px; }
.leg{ display:flex; align-items:flex-start; gap:8px; padding:5px 0; font-size:12px; line-height:1.4; }
.leg .s{ flex:0 0 auto; margin-top:1px; }
.kal-item{ display:flex; gap:9px; align-items:flex-start; padding:8px 0;
  border-bottom:1px solid var(--line2); width:100%; text-align:left; }
.kal-item:last-child{ border-bottom:none; }
.kal-item .b{ font-size:12.5px; font-weight:600; }
.kal-item .m{ font-size:11.5px; color:var(--muted); line-height:1.4; }
@media (max-width:1000px){ .kal{ grid-template-columns:1fr; }
  .kal-sel{ min-height:78px; } }

.askbox{ position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:61;
  background:var(--card); border:1px solid var(--line); border-top:4px solid var(--red);
  width:min(430px,calc(100% - 32px)); padding:20px 22px 18px; box-shadow:0 18px 50px #14232C44; }
.askbox h2{ font-size:17px; margin-bottom:8px; }
.askbox p{ font-size:13.5px; line-height:1.5; color:var(--ink); margin:0 0 6px; }
.askbox .warn{ color:var(--red); font-size:12.5px; margin-top:10px; }
.askbox .actions{ margin-top:18px; justify-content:flex-end; }
.toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--ink); color:#fff;
  padding:9px 17px; border-radius:2px; z-index:80; font-size:13px; box-shadow:0 6px 20px #14232C33; }
.sectionbar{ display:flex; align-items:baseline; gap:10px; margin:0 0 12px; }
.sectionbar h2{ font-size:16px; }
.sectionbar span{ font-size:12px; color:var(--muted); }
@media (max-width:820px){
  .skm{ flex-direction:column; }
  .rail{ width:100%; flex:none; height:auto; position:static; flex-direction:row; overflow-x:auto; padding:8px; }
  .rail-brand,.rail-group{ display:none; }
  .rail a{ white-space:nowrap; border-left:none; border-bottom:3px solid transparent; padding:7px 11px; }
  .rail a.on{ border-left:none; border-bottom-color:var(--green); }
  .body{ padding:16px 14px 50px; } .topbar{ padding:11px 14px; }
  .grid2{ grid-template-columns:1fr; } .kv{ grid-template-columns:1fr; }
  .drawer{ width:100%; min-width:0; max-width:none; }
  .drawer-h{ padding:13px 16px; } .drawer-b{ padding:16px 16px 50px; }
}
@media (prefers-reduced-motion:reduce){ .skm *{ transition:none!important; animation:none!important; } }

/* Limit approval — Bagian 35 */
const TIERS = [
  { max: 1e6,  label: "≤ Rp1.000.000",              approvers: ["DIVISI"] },
  { max: 5e6,  label: "Rp1.000.001 – Rp5.000.000",  approvers: ["DIVISI","FAT"] },

];

/* Approval pengajuan dana — SKM mengajukan, jadi tidak ikut menyetujui.
   Finance AP tidak menyetujui, hanya memproses pencairan setelah approval selesai. */
const TIERS_DANA = [
  { max: 5e6,  label: "Rp0 – Rp5.000.000", approvers: ["FAT"] },
  { max: Infinity, label: "> Rp5.000.000", approvers: ["FAT","OWNER"] },
];
const tierDana = (n) => TIERS_DANA.find((t) => (Number(n) || 0) <= t.max);

/* Rantai verifikasi LPJ — LPJ baru final setelah seluruh tahap aktif dilewati */
const TAHAP_LPJ = [

const tierOf = (n) => TIERS.find((t) => (Number(n) || 0) <= t.max);

/* Rantai approval RAB: pemeriksaan SKM lebih dulu, baru jenjang sesuai nilai */
const rantaiRab = (n) => ["SKM", ...tierOf(n).approvers];
/* Rantai approval pengajuan dana, lalu diproses Finance AP */
const rantaiDana = (n) => tierDana(n).approvers;
const berikutnya = (rantai, approvals) => {
  const setuju = (approvals || []).filter((a) => a.decision === "Approve").map((a) => a.role);
  return rantai.find((r) => !setuju.includes(r)) || null;
};

/* Kegiatan bisa berlangsung beberapa hari — tanggal akhir dipakai untuk aging LPJ */
const tglAkhir = (x) => (x && x.tglSelesai) || (x && x.tglKegiatan) || "";
const rentangHari = (mulai, selesai) => {
  if (!mulai) return [];
  const akhir = selesai && selesai > mulai ? selesai : mulai;
  const out = []; let d = mulai; let n = 0;
  while (d <= akhir && n < 120) { out.push(d); d = tambahHari(d, 1); n++; }
  return out;
};
const beririsan = (a1, a2, b1, b2) => {
  const x1 = a1, x2 = (a2 && a2 > a1) ? a2 : a1;
  const y1 = b1, y2 = (b2 && b2 > b1) ? b2 : b1;
  return x1 <= y2 && y1 <= x2;
};

/* Crew yang sudah dialokasikan pada kegiatan lain di rentang yang beririsan */
const crewSibuk = (briefs, rabs, mulai, selesai, kecuali) => {
  const peta = {};
  const catat = (sumber) => (x) => {
    if (!x || !x.tglKegiatan || !(x.crew || []).length) return;
    if (kecuali && (x.id === kecuali || x.no === kecuali || x.briefId === kecuali)) return;
    if (/Ditolak|Cancelled|Rejected/.test(x.status || "")) return;
    if (!beririsan(mulai, selesai, x.tglKegiatan, x.tglSelesai)) return;
    x.crew.forEach((c) => {
      if (!c.nama) return;
      (peta[c.nama] = peta[c.nama] || []).push({
        nama: x.nama, peran: c.peran, sumber,
        mulai: x.tglKegiatan, selesai: tglAkhir(x), kode: x.no || x.id,
      });
    });
  };
  (briefs || []).forEach(catat("brief"));
  (rabs || []).forEach(catat("RAB"));
  return peta;
};

/* Pembayaran yang sudah dicairkan Finance AP, dipetakan per nama item.
   Dipakai SKM untuk mengonfirmasi item mana yang sudah benar-benar dibayar. */
const bayarAP = (rabNo, danaList) => {
  const peta = {};
  (danaList || []).forEach((d) => {
    if (d.rabNo !== rabNo || d.status !== "Cair") return;
    (d.lines || []).forEach((l) => {
      const kunci = String(l.item || "").trim().toLowerCase();
      if (!kunci) return;
      peta[kunci] = { ref: l.buktiRef || "", tgl: l.buktiTgl || d.tglCair || "",
        link: l.buktiLink || "", file: l.buktiFile || null, nilai: Number(l.nilai) || 0,
        danaId: d.id, tglCair: d.tglCair || "" };
    });
  });
  return peta;
};

/* ========================= PEMBUAT DOKUMEN SPK (.docx) =========================
   Dibuat tanpa pustaka luar — hanya CRC32 dan penulis ZIP "stored" (tanpa
   kompresi) buatan sendiri, supaya tidak bergantung pada koneksi internet
   untuk memuat pustaka tambahan. Cukup untuk beberapa berkas XML kecil. */

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
const crc32 = (bytes) => {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
};
const zU16 = (n) => [n & 0xFF, (n >>> 8) & 0xFF];
const zU32 = (n) => [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF];
const zipStore = (files) => {
  const enc = new TextEncoder();
  const now = new Date();
  const time = ((now.getHours() & 0x1F) << 11) | ((now.getMinutes() & 0x3F) << 5) | ((now.getSeconds() >> 1) & 0x1F);
  const date = (((now.getFullYear() - 1980) & 0x7F) << 9) | (((now.getMonth() + 1) & 0xF) << 5) | (now.getDate() & 0x1F);
  const localParts = [], centralParts = [];
  let offset = 0;
  for (const f of files) {
    const nameBytes = enc.encode(f.name);
    const data = f.content instanceof Uint8Array ? f.content : enc.encode(f.content);
    const crc = crc32(data);
    const localHeader = [
      ...zU32(0x04034b50), ...zU16(20), ...zU16(0), ...zU16(0),
      ...zU16(time), ...zU16(date), ...zU32(crc), ...zU32(data.length), ...zU32(data.length),
      ...zU16(nameBytes.length), ...zU16(0),
    ];
    const local = new Uint8Array(localHeader.length + nameBytes.length + data.length);
    local.set(localHeader, 0); local.set(nameBytes, localHeader.length); local.set(data, localHeader.length + nameBytes.length);
    localParts.push(local);
    const centralHeader = [
      ...zU32(0x02014b50), ...zU16(20), ...zU16(20), ...zU16(0), ...zU16(0),
      ...zU16(time), ...zU16(date), ...zU32(crc), ...zU32(data.length), ...zU32(data.length),
      ...zU16(nameBytes.length), ...zU16(0), ...zU16(0), ...zU16(0), ...zU16(0), ...zU32(0), ...zU32(offset),
    ];
    const central = new Uint8Array(centralHeader.length + nameBytes.length);
    central.set(centralHeader, 0); central.set(nameBytes, centralHeader.length);
    centralParts.push(central);
    offset += local.length;
  }
  const centralSize = centralParts.reduce((a, p) => a + p.length, 0);
  const end = new Uint8Array([
    ...zU32(0x06054b50), ...zU16(0), ...zU16(0),
    ...zU16(files.length), ...zU16(files.length),
    ...zU32(centralSize), ...zU32(offset), ...zU16(0),
  ]);
  const out = new Uint8Array(offset + centralSize + end.length);
  let p = 0;
  for (const part of localParts) { out.set(part, p); p += part.length; }
  for (const part of centralParts) { out.set(part, p); p += part.length; }
  out.set(end, p);
  return out;
};

/* Nomor SPK: {urut}/SPK/{Divisi}/{Bulan}/{Tahun}, urut berjalan per divisi per bulan */
/* Perhitungan biaya satu baris rute: malam menginap × jumlah kamar × harga/malam.
   "Kamar" tetap teks bebas (untuk keperluan surat), angkanya diambil dari digit pertama —
   wajar untuk isian seperti "3 kamar" atau "3". */
const malamRute = (r) => {
  if (!r.tglMulai) return 1;
  if (!r.tglSelesai || r.tglSelesai === r.tglMulai) return 1;
  return Math.max(1, daysBetween(r.tglMulai, r.tglSelesai));
};
const kamarAngka = (r) => Math.max(1, Number((String(r.kamar || "").match(/\d+/) || [])[0]) || 1);
const totalRute = (r) => malamRute(r) * kamarAngka(r) * (Number(r.harga) || 0);

const nextSpkNo = (briefs, divisiNama, tglAcuan) => {
  const { y, m } = ym(tglAcuan);
  const kode = divKode(divisiNama);
  const scope = `/SPK/${kode}/${m}/${y}`;
  const used = briefs.filter((b) => b.spkNo && b.spkNo.endsWith(scope))
    .map((b) => Number(b.spkNo.split("/")[0]) || 0);
  const n = String((used.length ? Math.max(...used) : 0) + 1).padStart(3, "0");
  return `${n}${scope}`;
};

/* Nomor Surat Tugas: {urut 6 digit}/S-DIN/GA/{bulan romawi}/{tahun} — berjalan global per bulan,
   sama seperti pola nomor pada contoh surat perusahaan (bukan per divisi, karena yang menerbitkan
   selalu GA). */
const nextSuratTugasNo = (briefs, tglAcuan) => {
  const { y, m } = ym(tglAcuan);
  const romawi = ROMAWI_BULAN[Number(m) - 1] || m;
  const scope = `/S-DIN/GA/${romawi}/${y}`;
  const used = briefs.filter((b) => b.suratTugasNo && b.suratTugasNo.endsWith(scope))
    .map((b) => Number(b.suratTugasNo.split("/")[0]) || 0);
  const n = String((used.length ? Math.max(...used) : 0) + 1).padStart(6, "0");
  return `${n}${scope}`;
};

/* Ubah bytes jadi base64 dengan tabel pencarian sendiri — tidak memakai btoa,
   karena btoa terbukti berperilaku tidak konsisten untuk data biner di
   sebagian lingkungan meski string masukannya sudah valid. Ditulis sendiri
   supaya hasilnya pasti sama di mana pun berkas ini dibuka. */
const B64_AKSARA = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
const bytesKeBase64 = (bytes) => {
  let out = "";
  for (let i = 0; i < bytes.length; i += 3) {
    const b0 = bytes[i], b1 = bytes[i + 1], b2 = bytes[i + 2];
    out += B64_AKSARA[b0 >> 2];
    out += B64_AKSARA[((b0 & 3) << 4) | (b1 === undefined ? 0 : b1 >> 4)];
    out += b1 === undefined ? "=" : B64_AKSARA[((b1 & 15) << 2) | (b2 === undefined ? 0 : b2 >> 6)];
    out += b2 === undefined ? "=" : B64_AKSARA[b2 & 63];
  }
  return out;
};
/* Kebalikan dari bytesKeBase64 — dipakai untuk membongkar logo yang disematkan sebagai
   base64. Ditulis sendiri, bukan atob(), supaya konsisten dan tidak bergantung API browser. */
const base64KeBytes = (b64) => {
  const bersih = b64.replace(/[^A-Za-z0-9+/]/g, "");
  const lookup = {};
  for (let i = 0; i < B64_AKSARA.length; i++) lookup[B64_AKSARA[i]] = i;
  const out = [];
  for (let i = 0; i < bersih.length; i += 4) {
    const c0 = lookup[bersih[i]] || 0, c1 = lookup[bersih[i + 1]] || 0;
    const c2 = bersih[i + 2] !== undefined ? lookup[bersih[i + 2]] : undefined;
    const c3 = bersih[i + 3] !== undefined ? lookup[bersih[i + 3]] : undefined;
    out.push((c0 << 2) | (c1 >> 4));
    if (c2 !== undefined) out.push(((c1 & 15) << 4) | (c2 >> 2));
    if (c3 !== undefined) out.push(((c2 & 3) << 6) | c3);
  }
  return new Uint8Array(out);
};

/* Item RAB yang pembayarannya mendekati atau melewati jatuh tempo */
const temuTempo = (rabs, ambang = 7) => {
  const out = [];
  rabs.forEach((r) => {
    if (/Closed|Cancelled|Rejected/.test(r.status || "")) return;
    (r.lines || []).forEach((l) => {
      if (!l.jatuhTempo) return;
      const sisa = Math.floor((new Date(l.jatuhTempo) - new Date(today())) / 86400000);
      if (sisa <= ambang) out.push({ no: r.no, nama: r.nama, item: l.item,
        vendor: l.vendor || "", nilai: (Number(l.qty) || 0) * (Number(l.harga) || 0),
        jatuhTempo: l.jatuhTempo, sisa });
    });
  });
  return out.sort((a, b) => a.sisa - b.sisa);
};

/* LPJ yang lewat batas waktu, dikelompokkan per PIC — dipakai untuk mengunci pembuatan RAB */
const lpjTelat = (rabs, lpjList, sla) => {
  const out = {};
  rabs.forEach((r) => {
    if (!r.tglKegiatan) return;
    const selesai = lpjList.some((l) => l.rabNo === r.no && l.status === "Approved / Closed");
    if (selesai) return;
    const umur = Math.floor((new Date(today()) - new Date(tglAkhir(r))) / 86400000);
    if (umur > (sla || 14)) {
      const k = r.pic || "(tanpa PIC)";
      out[k] = out[k] || [];
      out[k].push({ no: r.no, nama: r.nama, umur, telat: umur - (sla || 14) });
    }
  });
  return out;
};

};

const ym = (d) => {
  const x = d ? new Date(d) : new Date();
  return { y: x.getFullYear(), m: String(x.getMonth() + 1).padStart(2, "0") };
};
const daysBetween = (a, b) => Math.floor((new Date(b) - new Date(a)) / 86400000);
const tglStr = (d) => {
  const x = new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
};
const tambahHari = (tgl, n) => { const x = new Date(tgl); x.setDate(x.getDate() + n); return tglStr(x); };

const nextRabNo = (rabs, divisiNama, tgl) => {
  const { y, m } = ym(tgl);
  const prefix = `RAB-${divKode(divisiNama)}-${y}-${m}-`;
  const scope = `-${y}-${m}-`;
  const used = rabs.filter((r) => r.no.includes(scope)).map((r) => Number(r.no.slice(-3)) || 0);
  const n = String((used.length ? Math.max(...used) : 0) + 1).padStart(3, "0");
  return prefix + n;
};
const nextDocNo = (list, prefix) => {
  const { y, m } = ym();
  const head = `${prefix}-${y}-${m}-`;
  const used = list.filter((x) => (x.id || "").startsWith(head)).map((x) => Number(x.id.slice(-3)) || 0);
  return head + String((used.length ? Math.max(...used) : 0) + 1).padStart(3, "0");
};
const kodeKegiatan = (rab) => {
  if (!rab) return "";
  const { y, m } = ym(rab.tglKegiatan || rab.tglPengajuan);
  const jenis = (rab.jenis || "KEG").split(/[\s/]+/)[0].toUpperCase().slice(0, 6);
  const kota = (rab.lokasi || "NA").split(/[\s,]+/)[0].toUpperCase().slice(0, 3);
  return `${divKode(rab.divisi)}-${y}-${m}-${jenis}-${kota}-${rab.no.slice(-3)}`;
};

const Pill = ({ s }) => <span className={`pill ${STATUS_TONE(s)}`}>{s || "—"}</span>;
/* Contoh chip kalender sungguhan (bukan cuma nama warna dalam teks) — dipakai di
   Panduan Pakai dan Manual Book supaya penanda yang dijelaskan benar-benar terlihat
   rupanya, persis seperti di menu Kalender yang asli. */
/* Langkah mana di AlurRingkas yang jadi tugas tiap peran — dipakai untuk menyorot
   kotak yang relevan buat orang yang sedang membaca panduan. */
const ROLE_HIGHLIGHT = {
  PIC: ["Brief", "RAB", "Kegiatan", "LPJ"],
  SKM: ["RAB", "Dana", "Verifikasi"],
  DIVISI: ["Approval", "Verifikasi"],
  FAT: ["Approval", "Dana", "Verifikasi"],
  OWNER: ["Approval", "Dana", "Verifikasi"],
  AP: ["Cair"],
  GA: ["Kegiatan"],
  AR: ["Verifikasi"],
  ACC: ["Tutup"],
  DA: ["Tutup"],
  IT: [],
};

const ContohChip = ({ kelas, ikon }) => (
  <span className={`chip ${kelas} s`} style={{ width: "auto", padding: "1px 6px", marginRight: 6 }}>
    <span className="ik">{ikon}</span></span>
);

/* Diagram ringkas satu kegiatan dari awal sampai tutup — gambar kecil untuk memberi
   gambaran alur sebelum membaca langkah demi langkah secara teks. Dipakai di Panduan
   Pakai dan Manual Book, bukan pengganti Alur Kerja yang lengkap dan interaktif. */
const AlurRingkas = ({ tandai }) => {
  const langkah = [
    ["Brief", "PIC"], ["RAB", "PIC/SKM"], ["Approval", "Divisi→FAT→Owner"],
    ["Dana", "SKM→FAT→Owner"], ["Cair", "AP"], ["Kegiatan", "PIC"],
    ["LPJ", "PIC"], ["Verifikasi", "SKM→Divisi→FAT→Owner"], ["Tutup", "ACC/DA"],
  ];
  const W = 92, GAP = 14, H = 54, TOPTX = 18;
  const total = langkah.length * W + (langkah.length - 1) * GAP;
  return (
    <div style={{ overflowX: "auto", margin: "12px 0" }}>
      <svg viewBox={`0 0 ${total} ${H + 26}`} width={total} height={H + 26}
        style={{ display: "block", minWidth: total }}>
        {langkah.map(([judul, sub], i) => {
          const x = i * (W + GAP);
          const aktif = tandai && tandai.includes(judul);
          return (
            <g key={judul}>
              {i > 0 && (
                <path d={`M${x - GAP},${H / 2 + 13} L${x},${H / 2 + 13}`}
                  stroke="#A9B4B0" strokeWidth="1.6" markerEnd="url(#panahRingkas)" />
              )}
              <rect x={x} y={13} width={W} height={H} rx="7"
                fill={aktif ? "#E4F0EB" : "#FFFFFF"} stroke={aktif ? "#1E6E5A" : "#D3D7CF"}
                strokeWidth={aktif ? 1.8 : 1} />
              <text x={x + W / 2} y={13 + TOPTX} textAnchor="middle"
                fontSize="11.5" fontWeight="600" fill="#14232C">{judul}</text>
              <text x={x + W / 2} y={13 + TOPTX + 16} textAnchor="middle" fontSize="9" fill="#66757C">
                {sub.length > 14 ? sub.slice(0, 13) + "…" : sub}
              </text>
            </g>
          );
        })}
        <defs>
          <marker id="panahRingkas" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
            <path d="M0,0 L7,3.5 L0,7 Z" fill="#A9B4B0" />
          </marker>
        </defs>
      </svg>
    </div>
  );
};


function Spine({ rab, rel, mini }) {
  const done = {
    Brief: !!rab.briefId,
    RAB: !!rab.no,
    Vendor: rel.vendor.length > 0 || rab.statusBanding === "Tidak diperlukan",
    Approval: (rab.approvals || []).length > 0 && /Approved|On Progress|Waiting LPJ|Closed/.test(rab.status),
    "Dana cair": rel.dana.some((d) => d.status === "Cair"),
    Kegiatan: rab.tglKegiatan && daysBetween(rab.tglKegiatan, today()) >= 0,
    LPJ: rel.lpj.some((l) => l.status === "Approved / Closed"),
    Closed: rab.status === "Closed",
  };
  const firstOpen = STAGES.findIndex((s) => !done[s]);
  return (
    <div className={"spine" + (mini ? " mini" : "")}>
      {STAGES.map((s, i) => (
        <div key={s} className={"seg " + (done[s] ? "done" : i === firstOpen ? "now" : "")} title={s}>
          {!mini && (<><div className="i">{String(i + 1).padStart(2, "0")}</div><div className="t">{s}</div></>)}
        </div>
      ))}
    </div>
  );
}

function Field({ f, val, onChange, master, ctx }) {
  const set = (v) => onChange(f.k, v);
  const common = { id: f.k, value: val ?? "", onChange: (e) => set(e.target.value) };
  let ctrl;
  if (f.t === "area") ctrl = <textarea {...common} />;
  else if (f.t === "sel")
    ctrl = (<select {...common}><option value="">— pilih —</option>
      {f.o.map((o) => <option key={o} value={o}>{o}</option>)}</select>);
  else if (f.t === "pic")
    ctrl = (<><input list="pic-list" {...common} placeholder="Nama PIC" />
      <datalist id="pic-list">{master.pics.map((p) => <option key={p} value={p} />)}</datalist></>);
  else if (f.t === "kota")
    ctrl = (<><input list="kota-list" {...common} placeholder="Ketik atau pilih kota" />

    const sibuk = (ctx && ctx.sibuk) || {};

      <div>
        <table className="lines">
          <thead><tr><th style={{ width: "44%" }}>Nama crew</th><th style={{ width: "34%" }}>Peran di kegiatan</th>
            <th style={{ width: "16%" }}>Hari</th><th style={{ width: "6%" }} /></tr></thead>
          <tbody>
            {daftar.map((c, i) => (
              <tr key={i}>
                <td>
                  <select value={c.nama || ""} onChange={(e) => ubah(i, "nama", e.target.value)}
                    style={sibuk[c.nama] ? { borderColor: "#B03E28", background: "#FBEDEA" } : undefined}>
                    <option value="">— pilih crew —</option>
                    {c.nama && <option value={c.nama}>{c.nama}</option>}
                    {tersedia.map((n) => <option key={n} value={n}>{n}</option>)}
                  </select>
                  {sibuk[c.nama] && (
                    <span style={{ fontSize: 10, color: "#B03E28", display: "block", lineHeight: 1.3 }}>
                      Sedang bertugas di {sibuk[c.nama][0].nama} ({sibuk[c.nama][0].mulai}
                      {sibuk[c.nama][0].selesai !== sibuk[c.nama][0].mulai
                        ? ` s.d. ${sibuk[c.nama][0].selesai}` : ""})
                    </span>
                  )}
                </td>
                <td><select value={c.peran || ""} onChange={(e) => ubah(i, "peran", e.target.value)}>
                  <option value="">— pilih —</option>
                  {PERAN_CREW.map((x) => <option key={x}>{x}</option>)}</select></td>
                <td><input type="number" min="0" value={c.hari ?? ""} placeholder="1"
                  onChange={(e) => ubah(i, "hari", e.target.value)} /></td>
                <td><button className="btn ghost sm" onClick={() => set(daftar.filter((_, j) => j !== i))}
                  aria-label="Hapus crew">×</button></td>
              </tr>
            ))}
            {!daftar.length && (
              <tr><td colSpan={4} style={{ color: "#66757C", padding: "8px 4px", fontSize: 12 }}>
                Belum ada crew dialokasikan.</td></tr>
            )}
          </tbody>
        </table>
        <div style={{ marginTop: 7, display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          <button className="btn ghost sm" disabled={!tersedia.length}
            onClick={() => set([...daftar, { nama: "", peran: "", hari: 1 }])}>Tambah crew</button>
          <span style={{ fontSize: 11.5, color: "#66757C" }}>
            {daftar.length} orang{daftar.length
              ? ` · ${daftar.reduce((a, c) => a + (Number(c.hari) || 0), 0)} orang-hari` : ""}
            {" · "}{tersedia.length} crew masih tersedia
          </span>
        </div>
        {Object.keys(sibuk).length > 0 && (
          <p style={{ fontSize: 11, color: "#66757C", margin: "6px 0 0", lineHeight: 1.45 }}>
            Tidak tersedia pada tanggal ini: {Object.entries(sibuk)
              .map(([n, k]) => `${n} (${k[0].nama})`).join(", ")}.
          </p>
        )}
        {!tersedia.length && (
          <p style={{ fontSize: 11.5, color: "#9C7112", margin: "6px 0 0", lineHeight: 1.45 }}>
            Semua crew sudah terpakai pada rentang tanggal ini. Geser tanggal kegiatan, atau tambah
            nama crew baru lewat Master Data.
          </p>
        )}
      </div>
    );
  }
  else if (f.t === "rute") {
    const daftar = Array.isArray(val) ? val : [];
    /* Ketikan tiap huruf hanya mengubah nilainya — tidak menyentuh status GA sama sekali,
       supaya badge status tidak berubah/menghilang di tengah mengetik (itu yang terasa
       seperti "input berpindah"). Status baru dievaluasi ulang sekali saat kolom hotel
       kehilangan fokus (selesai diedit). */
    const ubah = (i, k, x) => { const d = daftar.map((r, j) => j === i ? { ...r, [k]: x } : r); set(d); };
    const badge = (s) => {
      if (!s || s === "Tentatif") return <span className="pill p-wait">Tentatif</span>;
      if (s === "Dikonfirmasi") return <span className="pill p-go">Dikonfirmasi GA</span>;
      return <span className="flag">GA: TIDAK TERSEDIA</span>;

    ctrl = (
      <div>
        <table className="lines">

            <th style={{ width: "9%" }}>Tgl mulai</th><th style={{ width: "9%" }}>Tgl selesai</th>

            <th style={{ width: "13%" }}>Hotel / penginapan</th><th style={{ width: "8%" }}>Kamar</th>
            <th style={{ width: "10%" }}>Harga/malam</th>
            <th style={{ width: "14%" }}>Status GA</th>

              <tr key={i}>

                <td><input type="date" value={r.tglSelesai || ""} placeholder="sama"
                  onChange={(e) => ubah(i, "tglSelesai", e.target.value)} /></td>
                <td><input list="kota-list" value={r.kota || ""} placeholder="Kota"
                  onChange={(e) => ubah(i, "kota", e.target.value)} /></td>
                <td><input value={r.lokasiRinci || ""} placeholder="Venue / alamat"
                  onChange={(e) => ubah(i, "lokasiRinci", e.target.value)} /></td>
                <td><input defaultValue={r.hotel || ""} placeholder="Nama hotel" key={`hotel-${i}-${r.hotel || ""}`}
                  autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck={false}
                  onFocus={(e) => { e.target.dataset.awal = r.hotel || ""; }}
                  onBlur={(e) => {
                    const awal = e.target.dataset.awal ?? (r.hotel || "");
                    const nilaiBaru = e.target.value;
                    if (nilaiBaru === (r.hotel || "")) return;
                    const d = daftar.map((row, j) => j !== i ? row : (row.statusHotel && awal !== nilaiBaru)
                      ? { ...row, hotel: nilaiBaru, statusHotel: "Tentatif", dikonfirmasiOleh: "", tglKonfirmasi: "" }
                      : { ...row, hotel: nilaiBaru });
                    set(d);
                  }} /></td>
                <td><input defaultValue={r.kamar || ""} placeholder="mis. 3 kamar" key={`kmr-${i}-${r.kamar || ""}`}
                  autoComplete="off" autoCorrect="off" spellCheck={false}
                  onBlur={(e) => ubah(i, "kamar", e.target.value)} /></td>
                <td><input type="text" inputMode="numeric" autoComplete="off" autoCorrect="off" spellCheck={false}
                  defaultValue={r.harga ?? ""} placeholder="per malam" key={`hrg-${i}-${r.harga ?? ""}`}
                  onBlur={(e) => ubah(i, "harga", e.target.value.replace(/[^\d]/g, ""))} /></td>
                <td style={{ fontSize: 11 }}>
                  {r.hotel ? badge(r.statusHotel) : <span style={{ color: "#A9B4B0" }}>—</span>}
                  {r.statusHotel === "Dikonfirmasi" && r.dikonfirmasiOleh && (
                    <div style={{ fontSize: 10, color: "#66757C", marginTop: 2 }}>
                      oleh {r.dikonfirmasiOleh}{r.tglKonfirmasi ? `, ${r.tglKonfirmasi}` : ""}</div>
                  )}
                  {r.statusHotel === "Dikonfirmasi" && Number(r.harga) > 0 && (
                    <div style={{ fontSize: 10, color: "#1E6E5A", marginTop: 2 }}>
                      masuk RAB: {rp(totalRute(r))}</div>
                  )}
                  {r.catatanGA && <div style={{ fontSize: 10, color: "#66757C", marginTop: 2 }}>{r.catatanGA}</div>}
                </td>
                <td><button className="btn ghost sm" onClick={() => set(daftar.filter((_, j) => j !== i))}
                  aria-label="Hapus baris rute">×</button></td>

              <tr><td colSpan={8} style={{ color: "#66757C", padding: "8px 4px", fontSize: 12 }}>

        <p style={{ fontSize: 11, color: "#66757C", margin: "6px 0 0", lineHeight: 1.4 }}>

          anggaran lewat menu Permintaan Hotel, lalu menandai status di sini — status kembali ke Tentatif

function FormModal({ title, fields, value, onSave, onClose, master, extra, rabOptions, modKey, rabRows, semua }) {
  const [v, setV] = useState(value);
  const [err, setErr] = useState("");
  const row = (rabRows || []).find((r) => r.no === v.rabNo);
  const sisaDana = row ? Math.max(0, row.total - row.cair) : 0;
  const ctx = {
    sibuk: fields.some((f) => f.t === "crew") && v.tglKegiatan && semua
      ? crewSibuk(semua.brief, semua.rabs, v.tglKegiatan, v.tglSelesai, v.id || v.briefId)
      : {},
  };
  const set = (k, val) => setV((p) => {
    const next = { ...p, [k]: val };
    /* Pilih RAB → isi pengajuan mengikuti RAB: item yang ditandai dibayar ke PIC. */
    if (modKey === "dana" && k === "rabNo") {
      const r = (rabRows || []).find((x) => x.no === val);
      if (r) {
        /* Seluruh item RAB ditarik apa adanya, termasuk yang dibayar langsung ke vendor. */
        const item = r.lines || [];
        const sisa = Math.max(0, r.total - r.cair);
        next.pic = r.pic;
        next.lines = item.map((l) => ({
          item: l.item, kategori: l.kategori, qty: l.qty, satuan: l.satuan, harga: l.harga,
          nilai: (Number(l.qty) || 0) * (Number(l.harga) || 0),
          caraBayar: l.caraBayar || "", vendor: l.vendor || "",
          rekening: l.rekening || "", termin: l.termin || "", jatuhTempo: l.jatuhTempo || "",
        }));
        const usul = next.lines.reduce((a, l) => a + l.nilai, 0) || Number(r.uangMuka) || 0;
        next.jumlah = Math.min(usul || sisa, sisa);
        /* Tanggal kebutuhan mengacu RAB: jatuh tempo paling awal, atau tanggal mulai kegiatan. */
        const tempo = item.map((l) => l.jatuhTempo).filter(Boolean).sort();
        next.tglButuh = tempo[0] || r.tglKegiatan || "";
        next.tujuanDana = next.tujuanDana ||
          `Uang muka kegiatan ${r.nama}${r.lokasi ? ` di ${r.lokasi}` : ""}` +
          `${r.tglKegiatan ? `, ${r.tglKegiatan}${r.tglSelesai && r.tglSelesai !== r.tglKegiatan ? ` s.d. ${r.tglSelesai}` : ""}` : ""}.`;
      }
    }
    return next;
  });
  const submit = () => {
    const miss = fields.filter((f) => f.req &&
      (f.t === "crew" ? !(v[f.k] || []).length : !String(v[f.k] ?? "").trim()));
    if (miss.length) { setErr(`Lengkapi dulu: ${miss.map((m) => m.l).join(", ")}.`); return; }
    if (modKey === "brief" && !(Number(v.estimasiDana) > 0)) {
      setErr("Estimasi dana wajib diisi dan lebih dari nol. Angka ini menjadi pagu RAB dan menentukan " +
        "siapa yang harus menyetujui kegiatan ini."); return;
    }
    if (modKey === "dana" && row) {
      const j = Number(v.jumlah) || 0;
      if (j > sisaDana) {
        setErr(`Jumlah ${rp(j)} melebihi sisa yang boleh diajukan untuk ${row.no}, yaitu ${rp(sisaDana)} ` +
          `(total RAB ${rp(row.total)} dikurangi dana yang sudah cair ${rp(row.cair)}).`);
        return;
      }
    }
    onSave(v);
  };
  return (
    <>
      <div className="scrim" onClick={onClose} />
      <div className="drawer" role="dialog" aria-label={title}>
        <div className="drawer-h">
          <div style={{ flex: 1 }}><h2 style={{ fontSize: 17 }}>{title}</h2></div>
          <button className="btn ghost sm" onClick={onClose}>Tutup</button>
          <button className="btn sm" onClick={submit}>Simpan</button>
        </div>
        <div className="drawer-b">
          {err && <div className="note" style={{ borderLeftColor: "#B03E28", background: "#FBEDEA" }}>{err}</div>}
          <div className="card">
            <div className="grid2">
              {fields.map((f) =>

                    <dt>Tingkatan</dt><dd>{tierOf(v.estimasiDana).label}</dd>

          {modKey === "dana" && row && (
            <div className="card">
              <h3>Pagu dana untuk {row.no}</h3>
              <dl className="kv" style={{ gridTemplateColumns: "220px 1fr" }}>

                <dt>Item dibayar ke PIC</dt><dd className="mono">{rp(row.kePic)}</dd>
                <dt>Item dibayar AP ke vendor</dt><dd className="mono">{rp(row.keVendor)}</dd>
                <dt>Dana sudah cair</dt><dd className="mono">{rp(row.cair)}</dd>
                <dt>Sisa yang boleh diajukan</dt>

              <dl className="kv" style={{ gridTemplateColumns: "220px 1fr", marginTop: 10 }}>
                <dt>Approval yang dibutuhkan</dt>
                <dd>{tierDana(v.jumlah).approvers.map((a) => ROLES[a].split(" (")[0]).join(" + ")}
                  <span style={{ color: "#66757C" }}> · {tierDana(v.jumlah).label}</span></dd>
              </dl>
              {(v.lines || []).length > 0 && (
                <table className="lines" style={{ marginTop: 12 }}>
                  <thead><tr><th style={{ width: "28%" }}>Item dari RAB</th>
                    <th style={{ width: "12%" }}>Dibayar ke</th>
                    <th style={{ width: "24%" }}>Penerima &amp; rekening</th>
                    <th style={{ width: "14%" }}>Batas bayar</th>
                    <th style={{ width: "16%", textAlign: "right" }}>Nilai</th></tr></thead>
                  <tbody>

                        <td style={{ fontSize: 11 }}>{l.caraBayar

                          <div className="mono" style={{ fontSize: 10, color: "#66757C" }}>

                        <td className="mono" style={{ fontSize: 11 }}>{l.jatuhTempo || "—"}</td>
                        <td className="mono" style={{ textAlign: "right" }}>{num(l.nilai)}</td>

                  </tbody>
                  <tfoot>
                    <tr><td colSpan={4} style={{ textAlign: "right" }}>Total seluruh item RAB</td>
                      <td style={{ textAlign: "right" }}>
                        {num(v.lines.reduce((a, l) => a + (Number(l.nilai) || 0), 0))}</td></tr>
                    <tr><td colSpan={4} style={{ textAlign: "right", fontWeight: 400, fontSize: 11,
                      color: "#66757C", fontFamily: "inherit" }}>
                      Ke PIC {rp(v.lines.filter((l) => l.caraBayar === "Dibayar ke PIC")
                        .reduce((a, l) => a + (Number(l.nilai) || 0), 0))}
                      {" · "}Ke vendor {rp(v.lines.filter((l) => l.caraBayar === "Dibayar ke Vendor")
                        .reduce((a, l) => a + (Number(l.nilai) || 0), 0))}</td><td /></tr>
                  </tfoot>
                </table>
              )}
              {(v.lines || []).length === 0 && v.rabNo && (
                <div className="note" style={{ marginTop: 12, borderLeftColor: "#B03E28", background: "#FBEDEA" }}>
                  RAB ini belum punya item biaya. Lengkapi dulu item biaya di RAB sebelum mengajukan dana.
                </div>
              )}
              <div className="note" style={{ marginTop: 12, marginBottom: 0 }}>
                Rincian item di atas ditarik apa adanya dari RAB dan tidak bisa diubah di sini — bila ada
                yang keliru, perbaiki di RAB. Kolom <b>Dibayar ke</b> menentukan tujuan transfer Finance AP:
                item bertanda PIC masuk uang muka dan wajib dipertanggungjawabkan di LPJ, item bertanda
                Vendor dibayar langsung ke rekening vendor berdasarkan invoice.
              </div>
              {Number(v.jumlah) > 0 && Number(row.kePic) > 0 && Number(v.jumlah) !== Number(row.kePic) && (
                <p style={{ fontSize: 12.5, color: "#9C7112", margin: "10px 0 0" }}>
                  Jumlah ini berbeda dari total item yang ditandai dibayar ke PIC ({rp(row.kePic)}).
                  Tulis alasannya di catatan SKM supaya atasan FAT tidak perlu bertanya.
                </p>
              )}
            </div>
          )}

          {extra && extra(v, set)}
        </div>
      </div>
    </>
  );
}

function Login({ users, onMasuk }) {
  const aktifSaja = users.filter((x) => x.aktif !== false);
  /* SENGAJA dikosongkan, JANGAN diisi default ke aktifSaja[0].u.
     Kalau di-default ke user pertama (biasanya "admin"), orang yang buru-buru
     dan tidak sadar harus ganti dropdown dulu — apalagi kalau kata sandinya
     kebetulan sama seperti akun lain — akan ke-login sebagai akun yang salah
     (admin) tanpa sadar. Dengan dikosongkan, mereka WAJIB memilih nama sendiri
     dulu sebelum bisa masuk. */
  const [u, setU] = useState("");
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const [lihat, setLihat] = useState(false);

  const masuk = () => {
    if (!u) { setErr("Pilih dulu nama pengguna dari daftar."); return; }
    const cari = users.find((x) => x.u === u);
    if (!cari) { setErr("Pilih dulu nama pengguna dari daftar."); return; }
    if (String(cari.p) !== String(pw).trim()) {
      setErr("Kata sandi tidak cocok. Kalau ini akun baru atau Anda lupa, hubungi IT / Admin untuk mengetahui atau mereset kata sandinya.");
      return;
    }
    if (cari.aktif === false) { setErr("Akun ini dinonaktifkan. Hubungi IT / Admin."); return; }
    onMasuk({ u: cari.u, nama: cari.nama, role: cari.role });
  };

  return (
    <div className="skm" style={{ display: "block" }}>
      <style>{CSS}</style>
      <div className="login">
        <div className="login-box">
          <div className="login-kiri">
            <span className="tag">Control Panel · Fase 1</span>
            <b>SKM</b>
            <div style={{ fontSize: 13.5, color: "#9DB0B8", marginTop: 2 }}>
              Sales Marketing Commercial Finance</div>
            <p>Setiap approval yang Anda berikan tercatat atas nama akun ini, lengkap dengan tanggalnya.
              Jangan berbagi akun dengan orang lain.</p>
            <div className="kunci">
              <span style={{ color: "#C9D4D8", marginBottom: 6 }}>Baru pertama kali masuk?</span>
              <span>Kata sandi awal diberikan langsung oleh IT / Admin saat akun dibuat — bukan
                ditampilkan di layar ini.</span>
              <span style={{ marginTop: 6, color: "#C9D4D8" }}>
                Lupa kata sandi? Hubungi IT / Admin untuk direset lewat menu Akun Pengguna.</span>
            </div>
          </div>
          <div className="login-kanan">
            <h2>Masuk</h2>
            <div className="sub">Pilih nama Anda, lalu isi kata sandi dari IT / Admin.</div>
            {err && <div className="login-err">{err}</div>}
            <div className="f">
              <label htmlFor="lu">Nama pengguna</label>
              <select id="lu" value={u} autoFocus
                onChange={(e) => { setU(e.target.value); setErr(""); }}>
                <option value="" disabled>— Pilih nama Anda —</option>
                {aktifSaja.map((x) => (
                  <option key={x.u} value={x.u}>{x.nama} — {labelPeran(x.role).split(" (")[0]}</option>
                ))}
              </select>
            </div>
            <div className="f">
              <label htmlFor="lp">Kata sandi</label>
              <input id="lp" type={lihat ? "text" : "password"} value={pw}
                autoCapitalize="none" autoCorrect="off" spellCheck={false} autoComplete="current-password"
                placeholder="Kata sandi dari IT / Admin"
                onChange={(e) => { setPw(e.target.value); setErr(""); }}
                onKeyDown={(e) => e.key === "Enter" && masuk()} />
              <button type="button" onClick={() => setLihat(!lihat)}
                style={{ alignSelf: "flex-start", fontSize: 11.5, color: "var(--blue)",
                  textDecoration: "underline", padding: 0, marginTop: 2 }}>
                {lihat ? "Sembunyikan kata sandi" : "Tampilkan kata sandi"}</button>
            </div>
            <button className="btn" onClick={masuk}>Masuk</button>
            <p style={{ fontSize: 11.5, color: "var(--muted)", lineHeight: 1.5, marginTop: 16 }}>
              Login ini memisahkan wewenang antar posisi, bukan pengamanan tingkat perusahaan.
              Kata sandi tersimpan di perangkat ini, jadi jangan memakai kata sandi yang Anda pakai
              untuk sistem lain.
            </p>
          </div>
        </div>
      </div>
    </div>
  );
}
