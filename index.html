        <p>Kegiatan yang berlangsung beberapa hari muncul di setiap tanggalnya, ditandai
          <i>hari 1/3</i>, <i>hari 2/3</i>, dan seterusnya. Panel di kanan menampilkan daftar crew yang
          bertugas pada tanggal terpilih beserta perannya, dan di bawahnya daftar crew yang masih tersedia
          pada tanggal itu.</p>
        <p>PIC hanya melihat sorotan pada kegiatan dan LPJ miliknya sendiri, bukan milik PIC lain.
          Penyaring di kanan atas bisa dipakai untuk menampilkan satu jenis penanda saja, atau hanya
          yang menunggu Anda.</p>

        <h2 id="b5c">5c. Brief kegiatan</h2>
        <p>Brief adalah titik masuk seluruh alur. Isinya menentukan pagu RAB dan jalur approval, jadi
          diisi selengkap mungkin sejak awal.</p>
        <ul>
          <li><b>Estimasi dana wajib diisi.</b> Angka ini mengunci pagu RAB — total item biaya RAB nanti
            tidak boleh melebihinya kecuali diajukan kenaikan pagu beserta alasannya. Saat mengisi, tabel
            tingkatan approval langsung menunjukkan siapa saja yang harus menyetujui kegiatan ini.</li>
          <li><b>Kota kegiatan</b> dipilih dari daftar kota di Indonesia agar penulisannya seragam dan bisa
            dikelompokkan di laporan. Alamat atau nama venue ditulis di kolom detail lokasi. Ini untuk
            kegiatan satu lokasi — untuk kegiatan yang berpindah kota, pakai Rute di bawah.</li>
          <li><b>Rute &amp; hotel per tanggal</b> hanya diisi bila kegiatan berpindah kota, misalnya tur
            beberapa kota. Tiap baris punya tanggal sendiri (boleh rentang), kota, detail lokasi, dan hotel
            — hotelnya boleh berbeda di tiap baris. Tombol <i>Selaraskan tanggal kegiatan dengan rute</i>
            mengatur ulang tanggal mulai dan selesai kegiatan mengikuti tanggal paling awal dan paling akhir
            di rute, supaya tidak perlu dihitung manual. Kegiatan satu lokasi tidak perlu mengisi ini sama
            sekali — cukup kolom Kota kegiatan di atas.</li>
          <li><b>Tanggal kegiatan berupa rentang.</b> Isi tanggal mulai dan tanggal selesai untuk kegiatan
            yang berlangsung beberapa hari. Kegiatan sehari cukup mengisi tanggal mulai. Batas waktu LPJ
            dihitung dari tanggal <i>selesai</i>, bukan tanggal mulai.</li>
          <li><b>Alokasi crew</b> diisi per orang: nama, peran di kegiatan, dan berapa hari. Totalnya
            dihitung dalam orang-hari, berguna untuk memperkirakan beban tim dan biaya transport.</li>
          <li><b>Crew yang sedang bertugas tidak muncul di pilihan.</b> Sistem memeriksa seluruh brief dan
            RAB yang rentang tanggalnya beririsan, lalu hanya menampilkan crew yang masih bebas. Nama yang
            sedang terpakai disebutkan di bawah tabel beserta kegiatan yang menahannya, jadi bentrok jadwal
            ketahuan sejak brief disusun, bukan saat hari-H.</li>
          <li>Seluruh isi brief ikut terbawa ke RAB begitu penyusun RAB (PIC atau SKM) memilih brief
            tersebut, jadi tidak perlu mengetik ulang — termasuk rute bila diisi.</li>
        </ul>

        <h3>Surat Permohonan Kegiatan (SPK)</h3>
        <p>Setiap brief punya tombol <b>Siapkan SPK</b> di halaman detailnya, menghasilkan surat resmi
          untuk pengurusan logistik perjalanan dinas — format Word asli, bisa dibuka dan diedit di Word.
          Setelah disiapkan, muncul tautan unduh sungguhan untuk diklik — bukan diunduh otomatis diam-diam,
          supaya tidak terhalang pemblokiran unduhan di sebagian peramban.</p>
        <ul>
          <li>Isinya ditarik otomatis dari brief: nama dan tanggal kegiatan, lokasi, serta daftar peserta
            dari PIC dan alokasi crew.</li>
          <li><b>Kegiatan tur berpindah kota</b> memakai isian Rute &amp; hotel per tanggal di brief. Kalau
            rute diisi, surat menampilkan tabel rute lengkap dengan hotel yang berbeda tiap kota dan status
            konfirmasi GA per baris (Tentatif / Dikonfirmasi / Tidak tersedia), menggantikan baris Lokasi
            dan checklist hotel tunggal.</li>
          <li>Lima kolom khusus untuk surat ini: jam pelaksanaan, kebutuhan hotel, tiket transportasi beserta
            titik keberangkatan, dan kendaraan operasional kantor. Kolom-kolom ini tidak ikut ke RAB — SPK
            mengurus logistik perjalanan, RAB mengurus anggaran.</li>
          <li>Nomor SPK diterbitkan otomatis saat pertama kali disiapkan, mengikuti pola
            <span className="mono"> {"{urut}"}/SPK/{"{Divisi}"}/{"{Bulan}"}/{"{Tahun}"}</span>, dan tetap
            sama untuk unduhan berikutnya — menyiapkan ulang tidak menerbitkan nomor baru.</li>
          <li>Tanda tangan surat ada <b>empat kolom</b>: Diajukan Oleh (PIC), Diketahui Oleh (atasan
            langsung — dikosongkan untuk diisi tangan, karena sistem belum menyimpan struktur atasan
            langsung tiap PIC), dan dua kolom <b>Diterima Oleh</b> — HR Staff sesuai surat baku perusahaan,
            dan General Affairs yang namanya otomatis terisi dari siapa yang terakhir mengonfirmasi hotel
            di rute (lihat 10d), atau dikosongkan bila belum ada yang dikonfirmasi.</li>
          <li>Kalau tautan unduh tidak bisa dipakai di peramban tertentu, tombol <b>Pratinjau &amp; cetak
            (PDF)</b> membuka surat yang sama di tab baru, siap dicetak atau disimpan sebagai PDF lewat
            dialog cetak bawaan peramban — jalur ini tidak bergantung pada izin unduh berkas sama sekali.</li>
          <li>Surat ini dibuat langsung di dalam aplikasi tanpa mengirim data ke server mana pun — cocok
            dengan prinsip aplikasi ini yang berjalan sepenuhnya di perangkat.</li>
        </ul>

        <h2 id="b6">6. Penomoran dan folder</h2>
        <h3>Nomor RAB</h3>
        <p className="mono" style={{ background: "#F4F6F2", padding: "9px 12px" }}>
          RAB-&#123;Divisi&#125;-&#123;Tahun&#125;-&#123;Bulan&#125;-&#123;Urut&#125; → RAB-MKT-2026-07-001
        </p>
        <p>Kode divisi: MKT untuk Marketing, SLS untuk Sales, CRT untuk Creative, dan COM untuk
          kegiatan gabungan. Nomor urut berjalan global per bulan, bukan per divisi. Setiap brief dan RAB
          juga wajib menyebut brand — Rcraft, LPD, Soonix, Nikmat, Kawe, atau Slay — agar beban kegiatan
          tiap brand bisa dibandingkan lewat laporan RAB per brand.</p>
        <h3>Item biaya dan vendornya</h3>
        <p>Setiap item biaya pada RAB punya rincian sendiri yang dibuka lewat tanda panah di ujung baris:
          vendor penyedia, link penawaran harga, link atau kontak vendor, termin pembayaran, batas
          pembayaran, dan catatan item.</p>
        <ul>
          <li><b>Link penawaran harga</b> adalah dasar tertulis harga item tersebut. Item tanpa penawaran
            ditandai di detail RAB dan terhitung di Dashboard, karena sulit dibela saat atasan FAT
            menanyakan dasar harganya.</li>
          <li><b>Dibayar ke</b> menentukan jalur uangnya. <i>Dibayar ke Vendor</i> berarti Finance AP
            membayar langsung ke vendor berdasarkan invoice. <i>Dibayar ke PIC</i> berarti biaya itu masuk
            uang muka yang dipegang PIC dan wajib dipertanggungjawabkan di LPJ. Jumlah item yang ditandai
            dibayar ke PIC inilah yang menjadi dasar besaran pengajuan dana, bukan total RAB.</li>
          <li><b>Nomor rekening penerima</b> diisi lengkap: bank, nomor, dan atas nama. Untuk item yang
            dibayar ke vendor, isi rekening vendor; untuk item yang dibayar ke PIC, isi rekening PIC.
            Rekening ini ikut terbawa ke laporan jadwal pembayaran vendor yang diserahkan ke Finance AP.</li>
          <li><b>Batas pembayaran</b> dipakai untuk mengingatkan Finance AP. Item yang jatuh tempo dalam
            tujuh hari atau sudah lewat muncul di Dashboard dan ditandai merah di detail RAB.</li>
          <li>Bila harga satuan melebihi price list acuan lebih dari 10 persen, kolom harganya ditandai
            merah beserta harga acuannya. Ini penanda, bukan larangan — harga boleh lebih tinggi asal
            ada alasannya.</li>
          <li>Rekap seluruh item beserta vendor dan jadwal bayarnya bisa ditarik dari menu
            Laporan &amp; Export, pilihan Jadwal pembayaran vendor.</li>
        </ul>

        <h3>Kode kegiatan dan folder</h3>
        <p>Kode kegiatan dipakai sebagai analytic account di Odoo. Nama folder Drive dibuatkan otomatis dan
          bisa disalin dari halaman detail RAB. Isi folder: brief, RAB final, quotation, pembanding harga,
          approval, invoice, bukti bayar, dokumentasi kegiatan, LPJ, klaim, dan catatan revisi.</p>

        <h2 id="b7">7. Limit approval</h2>
        <h3>Pemeriksaan item biaya oleh SKM</h3>
        <p>Pada tahap pertama approval, SKM mendapat panel khusus untuk memeriksa kelengkapan tiap item
          biaya. Sembilan hal yang diperiksa: nama item, kategori, harga satuan, jalur pembayaran, vendor
          atau penerima, link penawaran, nomor rekening, termin, dan batas pembayaran.</p>
        <ul>
          <li>Item yang datanya belum lengkap ditandai merah beserta nama kolom yang kosong.</li>
          <li>Kolom yang kurang <b>bisa diisi SKM langsung di panel itu</b>, tanpa mengembalikan RAB ke PIC
            untuk hal-hal kecil seperti nomor rekening atau termin yang terlewat.</li>
          <li>Harga yang melebihi price list lebih dari 10 persen ditandai, dan SKM diminta menuliskan
            alasannya di catatan pemeriksaan item.</li>
          <li>Tiap item ditandai sudah atau belum diperiksa. Jejak ini terbaca oleh atasan FAT, Owner, dan
            Finance AP di halaman detail RAB.</li>
          <li>RAB tetap bisa diloloskan meski ada yang belum lengkap, tetapi sistem memberi peringatan
            bahwa kekurangan itu akan terbawa sampai ke Finance AP.</li>
        </ul>

        <h3>Approval RAB</h3>
        <p>Approval berjalan <b>berurutan</b>. Pemeriksaan SKM selalu menjadi tahap pertama, karena RAB
          disusun PIC dan SKM-lah penyaring kewajaran harga serta kelengkapan penawaran. Bila ada yang
          perlu diperbaiki, SKM memilih <i>Kembalikan untuk koreksi</i> — approval yang sudah ada dihapus
          dan rantai dimulai lagi dari awal setelah RAB diperbaiki.</p>
        <T head={["Nilai RAB", "Urutan approval"]} w={["36%", null]}
          rows={TIERS.map((t) => [t.label,
            ["Pemeriksaan SKM", ...t.approvers.map((a) => ROLES[a].split(" (")[0])].join(" → ")])} />
        <h3>Approval pengajuan dana</h3>
        <p>Pengajuan dana hanya dibuat SKM dan <b>ditujukan kepada Finance AP</b>. SKM tidak ikut
          menyetujui, karena dialah yang mengajukan. Setelah diajukan, isinya hanya bisa diubah atasan FAT.</p>
        <p><b>Isi pengajuan sama dengan RAB.</b> Begitu nomor RAB dipilih, seluruh item biaya ditarik apa
          adanya — nama item, kategori, tujuan pembayaran, nama penerima, nomor rekening, batas bayar, dan
          nilainya. Rinciannya tidak bisa diubah di pengajuan; bila ada yang keliru, perbaiki di RAB.
          Jumlah pengajuan terisi dari total item, dan <b>tanggal kebutuhan dana mengacu pada RAB</b> —
          diambil dari batas pembayaran paling awal, atau tanggal mulai kegiatan bila belum ada.</p>
        <p>Kewajaran biaya sudah diperiksa SKM di tahap RAB, jadi pengajuan dana langsung naik ke atasan
          FAT, lalu ke Owner untuk nilai di atas Rp5 juta. Finance AP tidak ikut menyetujui — perannya
          memproses pembayaran. <b>Pencairan baru bisa diproses setelah seluruh tahap approval selesai.</b>
          Selama masih menggantung, tombol pemrosesan tidak muncul dan AP melihat keterangan siapa yang
          sedang ditunggu. Setelah lengkap, statusnya menjadi Siap Dicairkan, lalu AP mengubahnya menjadi
          Sedang Diproses AP dan Cair.</p>
        <T head={["Nilai pengajuan", "Urutan approval"]} w={["36%", null]}
          rows={TIERS_DANA.map((t) => [t.label,
            t.approvers.map((a) => ROLES[a].split(" (")[0]).join(" → ") + " → pencairan oleh Finance AP"])} />

        <h2 id="b8">8. Panduan per posisi</h2>
        {Object.entries(ROLE_FLOW).map(([k, o]) => (
          <div key={k}>
            <h3>{ROLES[k]}</h3>
            <ol>{o.steps.map(([t, m], i) => (
              <li key={i}>{t}{m ? <span style={{ color: "var(--muted)" }}> — di menu {MENU_LABEL[m]}</span> : null}</li>
            ))}</ol>
            <p style={{ color: "var(--red)", fontSize: 12.5 }}><b>Tidak boleh:</b> {o.larangan}</p>
          </div>
        ))}

        <h2 id="b9">9. LPJ dan rantai verifikasi</h2>
        <p>LPJ mengacu pada item biaya RAB. Begitu nomor RAB dipilih, seluruh item tertarik sebagai baris
          realisasi. Nilai tiap item boleh sama, kurang, atau lebih dari RAB — yang dinilai adalah totalnya.
          Tiap baris punya kolom link bukti Google Drive yang sifatnya opsional, berguna untuk menempelkan
          foto nota per item.</p>
        <p>LPJ belum final sampai seluruh tahap aktif dilewati berurutan:</p>
        <T head={["Tahap", "Posisi", "Syarat khusus"]} w={["34%", "34%", null]}
          rows={TAHAP_LPJ.filter((t) => cfg.tahapAktif.includes(t.k)).map((t) => [
            t.label, ROLES[t.k],
            t.k === "SKM" ? (cfg.refOdooWajib ? "Nomor referensi Odoo wajib diisi" : "Nomor referensi Odoo opsional")
              : t.k === "OWNER" ? "Memeriksa konklusi yang ditulis PIC"
              : "—",
          ])} />
        <p>Tahap mana pun bisa mengembalikan LPJ ke PIC untuk diperbaiki, dan rantai verifikasi dimulai
          lagi dari tahap pertama. Setelah tahap terakhir disetujui, LPJ final dan RAB otomatis ditutup.</p>
        <h3>Bila realisasi melebihi RAB</h3>
        <p>Kebijakan yang sedang berlaku: <b>{OVERBUDGET_OPSI[cfg.overbudget].label}</b> —{" "}
          {OVERBUDGET_OPSI[cfg.overbudget].ringkas} Pilihan ini diatur di menu Konfigurasi.</p>

        <h2 id="b10">10. Meja kerja Finance AP</h2>
        <p>Menu <b>Kas &amp; Pembayaran</b> mengumpulkan seluruh pekerjaan Finance AP dalam satu halaman,
          supaya tidak perlu membuka pengajuan satu per satu untuk tahu mana yang siap dibayar.</p>
        <p>Di bagian atas ada enam angka ringkas: berapa pengajuan siap dicairkan beserta nilainya, berapa
          item biaya sudah lewat jatuh tempo, berapa yang jatuh tempo dalam tujuh hari, berapa item yang
          belum punya nomor rekening, dan berapa yang sudah cair bulan ini.</p>
        <T head={["Tab", "Isinya", "Untuk apa"]} w={["24%", null, "32%"]} rows={[
          ["Antrian pencairan", "Pengajuan yang approval-nya sudah lengkap, lengkap dengan rincian item, penerima, dan rekening", "Dieksekusi hari itu juga"],
          ["Jadwal transfer", "Semua item biaya yang belum ditandai lunas, lintas RAB, diurutkan dari yang paling mendesak", "Merencanakan transfer minggu ini"],
          ["Belum disetujui", "Pengajuan yang masih menunggu atasan FAT atau Owner", "Memperkirakan kebutuhan kas"],
          ["Riwayat pencairan", "Pencairan yang sudah diproses beserta bukti transfer dan siapa yang memproses", "Penelusuran dan rekonsiliasi"],
        ]} />
        <p><b>Bukti transfer diisi per item, bukan hanya per pengajuan.</b> Di tabel rincian antrian, tiap
          item punya tiga kolom: nomor referensi bank, tanggal transfer, dan link bukti di Google Drive.
          Cukup salah satu terisi. Tersedia juga tombol untuk melampirkan berkas langsung — JPG, PNG, atau
          PDF, dengan batas 400 KB per berkas.</p>
        <p>Batas 400 KB itu bukan pilihan, melainkan konsekuensi teknis: aplikasi ini menyimpan data di
          perangkat, sehingga lampiran besar akan membuat penyimpanan cepat penuh dan aplikasi melambat.
          <b>Untuk bukti transfer yang wajar, unggah ke Google Drive dan tempel tautannya</b> — lampiran
          langsung hanya cocok untuk tangkapan layar kecil. Saat Odoo sudah dipakai, penyimpanan berkas
          pindah ke sana.</p>
        <p>Untuk mencatat pencairan, isi tanggal transfer dan nomor bukti, lalu tekan
          <i>Catat sudah dicairkan</i>. Kotak konfirmasi menyebutkan berapa item yang belum ada buktinya. Bila masih ada item tanpa nomor rekening, sistem memberi peringatan
          namun tidak menghalangi — keputusannya tetap di tangan Finance AP. Daftar antrian maupun jadwal
          transfer bisa ditarik sebagai CSV untuk dipakai saat mengeksekusi di bank.</p>
        <p>Posisi lain — SKM, atasan FAT, Owner, dan Accounting — bisa membuka halaman ini sebagai pemantau,
          tetapi tombol pencatatan hanya muncul bagi Finance AP.</p>

        <h2 id="b10b">10b. Realisasi pembayaran oleh SKM</h2>
        <p>Setelah pembayaran dilakukan, <b>SKM mencatat realisasinya pada RAB</b> lewat tombol
          <i>Input realisasi</i> di halaman detail RAB. Untuk tiap item diisi nilai yang benar-benar
          dibayar, tanggal pembayaran, dan penanda lunas. Tersedia juga tombol untuk menandai seluruh item
          lunas sekaligus.</p>
        <ul>
          <li>Total realisasi per RAB ikut terhitung dan tampil berdampingan dengan realisasi dari LPJ,
            sehingga selisih antara catatan pembayaran dan pertanggungjawaban PIC langsung terlihat.</li>
          <li>Penanda di kalender berubah dari <i>Bayar &lt;item&gt;</i> menjadi <i>Sudah dibayar
            &lt;item&gt;</i> berwarna hijau <b>begitu Finance AP mencatat pencairan</b>, dan berpindah ke
            tanggal transfer sebenarnya. Selama SKM belum mengonfirmasi di RAB, keterangan penanda itu
            bertuliskan <i>menunggu konfirmasi SKM</i> dan penandanya disorot bagi SKM. Setelah
            dikonfirmasi, keterangan itu hilang.</li>
          <li>Hanya SKM yang bisa mengisi realisasi. Posisi lain melihat tabelnya sebagai laporan.</li>
        </ul>

        <h2 id="b10c">10c. Dari pembayaran ke pelaksanaan</h2>
        <p>Uang yang sudah keluar dari Finance AP belum tentu diketahui PIC. Rangkaian berikut menutup
          jarak itu, sehingga PIC tahu persis kapan boleh mulai bekerja:</p>
        <T head={["Urutan", "Siapa", "Yang dikerjakan"]} w={["10%", "26%", null]} rows={[
          ["1", "Finance AP", "Mencairkan dana dan mengisi bukti transfer tiap item di menu Kas & Pembayaran"],
          ["2", "SKM", "Menerima tanda di detail RAB bahwa ada item yang sudah dibayar dan menunggu konfirmasi"],
          ["3", "SKM", "Membuka Input realisasi, menekan Tarik dari pembayaran AP, lalu menyimpan"],
          ["4", "Sistem", "Status RAB berpindah ke On Progress dan diberi tanda Siap jalan"],
          ["5", "PIC", "Melihat pita hijau di bagian atas layar: dana sudah cair, kegiatan boleh dijalankan"],
        ]} />
        <p>Tombol <i>Tarik dari pembayaran AP</i> mengisi nilai realisasi, tanggal bayar, nomor referensi,
          dan lampiran bukti sekaligus dari catatan Finance AP — SKM tinggal memeriksa dan menyimpan.
          Item yang belum dibayar AP dibiarkan apa adanya.</p>
        <p>Konfirmasi ini tetap dilakukan manusia, bukan otomatis, karena SKM-lah yang memastikan uang yang
          keluar memang sesuai item yang disetujui. Selama SKM belum mengonfirmasi, PIC tidak menerima
          pemberitahuan apa pun meski dananya sudah keluar.</p>
        <p>Setelah pita hijau muncul, PIC menjalankan kegiatan sesuai brief, menyimpan seluruh nota dan
          dokumentasi, lalu mengisi LPJ paling lambat sesuai batas waktu yang berlaku.</p>

        <h2 id="b10d">10d. Meja kerja General Affairs</h2>
        <p>Kolom Hotel yang diisi PIC di rute brief adalah <b>permintaan awal</b>, bukan yang pasti dipesan
          — GA-lah yang memeriksa ketersediaan kamar dan kesesuaian anggaran, karena PIC tidak selalu tahu
          hotel mana yang benar-benar bisa dipesan. Menu <b>Permintaan Hotel</b> adalah meja kerja GA untuk
          ini, terpisah dari halaman brief itu sendiri.</p>
        <T head={["Tab", "Isinya"]} w={["28%", null]} rows={[
          ["Menunggu konfirmasi", "Semua baris rute berisi hotel yang belum ditandai GA — status bawaannya Tentatif"],
          ["Sudah dikonfirmasi", "Hotel yang sudah dipastikan GA, lengkap dengan siapa dan kapan mengonfirmasinya"],
          ["Tidak tersedia", "Hotel yang diminta PIC ternyata tidak bisa dipesan — perlu dicarikan pengganti"],
        ]} />
        <p>Saat mengonfirmasi, GA boleh <b>mengganti nama hotel</b> dari yang diminta PIC — inilah jalan
          keluar untuk kasus kamar penuh atau harga di luar anggaran. Kolom catatan dipakai untuk menulis
          alasannya (mis. "kamar penuh, dialihkan ke hotel terdekat"), supaya kalau nanti ada yang bertanya
          kenapa hotelnya beda dari rencana awal, jawabannya sudah tercatat di sistem — tidak perlu menelusuri
          WhatsApp lama.</p>
        <p><b>Status kembali ke Tentatif secara otomatis</b> kalau PIC mengubah lagi nama hotel di brief
          setelah GA sempat mengonfirmasi — supaya GA tahu perlu memeriksa ulang, bukan mengira konfirmasi
          lama masih berlaku untuk hotel yang baru.</p>
        <p>Status dan tabel rute ini ikut muncul di SPK yang diunduh — tiap baris rute punya kolom Status
          sendiri (Tentatif / Dikonfirmasi / Tidak tersedia), dan tanda tangan <b>Diterima Oleh</b> di bagian
          bawah surat sekarang ada dua: HR Staff dan General Affairs. Nama GA di situ otomatis terisi dari
          siapa yang terakhir mengonfirmasi salah satu hotel di rute; kalau belum ada yang dikonfirmasi,
          kolom itu dikosongkan untuk ditandatangani manual.</p>

        <h3>Konfirmasi hotel otomatis masuk ke RAB</h3>
        <p>Kolom <b>Harga per malam</b> di rute brief bisa diisi PIC sendiri sebagai perkiraan, atau GA saat
          mengonfirmasi. Kedua-duanya otomatis masuk ke item biaya RAB, dengan aturan yang sama:</p>
        <ul>
          <li><b>Saat RAB pertama kali dibuat dari brief</b> ("Ambil dari brief"), setiap baris rute yang
            sudah punya kota dan harga langsung disalin jadi item biaya bernama "Hotel — [Kota]" — PIC tidak
            perlu mengetik ulang. Baris yang belum ada harganya (masih menunggu GA) tidak ikut disalin.</li>
          <li><b>Saat GA mengonfirmasi</b> (kolom Harga per malam di menu Permintaan Hotel), sistem menghitung
            total (malam menginap × jumlah kamar × harga) dan <b>memperbarui baris item biaya yang sama</b>
            di RAB — bukan membuat baris baru, karena keduanya memakai penanda yang sama di belakang layar.</li>
        </ul>
        <p>Ini hanya berlaku bila RAB-nya sudah pernah dibuat dari brief tersebut. Kalau belum, harga yang
          diisi tetap tersimpan di brief seperti biasa — tinggal menunggu RAB-nya dibuat.</p>
        <p><b>Kalau RAB itu sudah disetujui, dan angka dari GA membuat nilainya berubah, approval yang ada
          otomatis dibatalkan</b> — persis aturan yang sama seperti kalau manusia mengubah nilai RAB yang
          sudah disetujui secara manual. Statusnya kembali ke Revisi, dan catatan di riwayat RAB menyebutkan
          jelas: hotel apa, dikonfirmasi siapa, dan nilai lama vs baru. Jenjang approval yang berlaku harus
          menyetujui ulang dari awal — supaya siapa pun yang tanda tangan RAB benar-benar tahu ada perubahan
          hotel, bukan mengira angka lama masih berlaku.</p>
        <p>Kalau RAB belum disetujui sama sekali (masih dalam pemeriksaan), konfirmasi GA hanya memperbarui
          item biayanya tanpa drama tambahan — belum ada approval yang perlu dibatalkan.</p>

        <h3>Surat Tugas &amp; Tunjangan Perjalanan Dinas</h3>
        <p>Sebagai kelanjutan dari SPK, GA menerbitkan <b>Surat Tugas</b> — dokumen HR resmi berkop
          perusahaan lengkap dengan logo, yang menugaskan PIC dan crew secara formal beserta rincian
          tunjangan (UHL dan uang makan) yang akan dibayarkan Finance.</p>
        <ul>
          <li>Hanya <b>GA</b> yang bisa mengisi dan menerbitkan surat ini, dari kartu <b>Surat Tugas &amp;
            Tunjangan Perjalanan Dinas</b> di detail Brief. Posisi lain hanya bisa melihat dan mengunduh
            setelah surat itu terbit.</li>
          <li>Daftar penerima tugas (Nama + Divisi) otomatis diambil dari PIC dan alokasi crew — tidak perlu
            diketik ulang.</li>
          <li>Untuk tiap orang, GA mengisi <b>Jumlah Hari</b>, <b>UHL per hari</b>, dan <b>Uang Makan per
            hari</b>; totalnya dihitung otomatis, begitu juga total keseluruhan.</li>
          <li><b>Kebutuhan Mobil</b> — kalau dipilih Ya, muncul kolom Driver untuk diisi manual.</li>
          <li>Nomor surat mengikuti pola perusahaan: <span className="mono">{"{urut 6 digit}"}/S-DIN/GA/
            {"{bulan romawi}"}/{"{tahun}"}</span> — bulan ditulis angka romawi (mis. IX untuk September),
            diterbitkan sekali lalu tetap sama walau rinciannya diperbarui lagi nanti.</li>
          <li>Dokumennya dua halaman: <b>Surat Tugas</b> (dasar penugasan dan kebutuhan operasional) dan
            lampiran <b>Rincian Tunjangan Perjalanan Dinas</b> (tabel UHL) — persis format surat dinas
            perusahaan, termasuk logo dan garis aksen tiga warna di kop surat.</li>
          <li>Baris tanda tangan <b>Disetujui</b> sengaja dikosongkan (garis titik-titik) dengan jabatan
            <b> HR &amp; GA</b> — bukan nama staf GA yang sedang login. Surat ditandatangani basah oleh
            siapa pun yang berwenang di HR &amp; GA saat itu, bukan otomatis atas nama akun yang menerbitkan.</li>
          <li>Sama seperti SPK: ada tautan unduh nyata yang harus diklik sendiri, dan tombol <b>Pratinjau
            &amp; cetak (PDF)</b> sebagai jalan cadangan kalau unduhan langsung terhalang peramban.</li>
        </ul>

        <h2 id="b11">11. Batas waktu LPJ</h2>
        <p>Batas waktu berlaku <b>{sla} hari kalender</b> setelah tanggal kegiatan, dan diatur di Master Data.</p>
        <ul>
          <li>Lewat batas, RAB tersebut ditandai merah di Dashboard dan Buat RAB.</li>
          <li>PIC yang bersangkutan melihat peringatan di bagian atas layar setiap kali membuka aplikasi,
            lengkap dengan nomor RAB dan berapa hari keterlambatannya.</li>
          <li><b>Selama masih ada LPJ menunggak, PIC tersebut tidak bisa membuat RAB baru.</b> Kuncinya
            terbuka sendiri begitu LPJ selesai diverifikasi.</li>
          <li>Kunci ini mengikuti nama PIC, jadi SKM pun tidak bisa membuatkan RAB baru untuk PIC yang menunggak.</li>
        </ul>

        <h2 id="b11b">11b. Penguncian dokumen</h2>
        <p>Dokumen terkunci begitu disetujui. RAB terkunci saat ada approval masuk; LPJ terkunci saat satu
          tahap verifikasi disetujui; pengajuan dana, klaim, dan pembanding vendor terkunci saat statusnya
          sudah Approved, Cair, Posted to AR, atau Closed.</p>
        <p>Saat terkunci, PIC kehilangan tombol Ubah, tombol ubah status, dan kotak centang hapus.
          Yang masih bisa mengubah: SKM, Atasan Divisi, Atasan FAT, dan Owner.</p>

        <h2 id="b12">12. Arti status dan tanda</h2>
        <p>Warna status: kuning berarti sedang ditunggu seseorang, hijau berarti beres, merah berarti
          berhenti atau bermasalah.</p>
        <T head={["Tanda", "Artinya", "Siapa menindaklanjuti"]} w={["18%", null, "28%"]} rows={[
          [<span className="flag">OB</span>, "Realisasi LPJ melebihi total RAB", "SKM menyiapkan penjelasan, FAT memutuskan"],
          [<span className="flag">LPJ</span>, `Lewat ${sla} hari sejak kegiatan, LPJ belum selesai`, "SKM menagih PIC"],
          [<span className="flag">ESK</span>, "Ada eskalasi terbuka pada kegiatan itu", "Atasan FAT memberi keputusan"],
          [<span className="flag">PAGU</span>, "Pagu dari brief dinaikkan beserta alasannya", "Atasan FAT memeriksa alasannya"],
          [<span className="flag">KONFIRMASI</span>, "Finance AP sudah membayar, SKM belum mengonfirmasi di RAB", "SKM"],
          [<span className="pill p-go">Siap jalan</span>, "Seluruh item sudah dikonfirmasi dibayar — PIC boleh menjalankan kegiatan", "PIC"],
          [<span className="flag">TANPA RAB</span>, "Pengajuan dana atau klaim tanpa nomor RAB", "SKM menelusuri"],
          [<span className="pill p-go">Kunci</span>, "Dokumen sudah disetujui dan tidak bisa diubah PIC", "—"],
        ]} />

          Owner memverifikasi isinya di tahap terakhir, dan bisa mengembalikan LPJ bila konklusinya kosong
          atau tidak memadai. Yang menjalankan kegiatan yang paling tahu hasilnya, jadi konklusi memang
          menjadi tanggung jawab PIC.</p>

/* ========================= AKUN PENGGUNA (IT / Admin) ========================= */

function Pengguna({ data, commit, role, sesi, konfirm }) {
  const [akun, setAkun] = useState({ u: "", p: "12345", nama: "", role: "PIC" });
  const [lihatSandi, setLihatSandi] = useState(false);
  const m = data.master;
  const tersimpan = (m.users || []).filter((x) => x && x.u);
  const users = tersimpan.length ? tersimpan : SEED.master.users;
  const upd = (next, msg) => commit({ ...data, master: { ...m, users: next } }, msg || "Akun diperbarui.");

  if (role !== "IT") return (
    <div className="empty"><h3>Pengelolaan akun ada di IT / Admin</h3>
      <p>Hanya IT / Admin yang boleh membuat, mengubah, dan menonaktifkan akun pengguna.
        Ajukan permintaan akun baru atau perubahan posisi ke IT.</p></div>
  );

  const ganti = (i, patch, msg) => {
    const next = [...users]; next[i] = { ...next[i], ...patch }; upd(next, msg);
  };

  /* Deteksi kata sandi yang sama persis dipakai lebih dari satu akun AKTIF.
     Ini penyebab paling umum orang "salah masuk" jadi akun lain: dropdown
     login bisa saja dipilih benar, tapi kalau kata sandinya kebetulan sama
     dengan akun lain (misalnya semua masih memakai kata sandi bawaan),
     gampang tertukar / bisa dipakai saling login. */
  const sandiKeAkun = {};
  users.filter((x) => x.aktif !== false).forEach((x) => {
    const key = String(x.p || "");
    if (!key) return;
    (sandiKeAkun[key] = sandiKeAkun[key] || []).push(x.nama);
  });
  const grupSandiSama = Object.values(sandiKeAkun).filter((g) => g.length > 1);

  return (
    <>
      <div className="note">
        Posisi yang dipilih di sini menentukan menu apa yang terlihat dan approval apa yang boleh diberikan
        orang tersebut. Salah menetapkan posisi berarti memberi wewenang persetujuan kepada orang yang salah.
      </div>

      {grupSandiSama.length > 0 && (
        <div className="note" style={{ borderLeftColor: "#B03E28", background: "#FBEDEA" }}>
          <b style={{ display: "block", marginBottom: 3 }}>
            Ada akun aktif yang kata sandinya sama persis — ganti segera</b>
          {grupSandiSama.map((g, i) => (
            <div key={i}>{g.join(", ")} — memakai kata sandi yang sama satu sama lain.</div>
          ))}
          <div style={{ marginTop: 4 }}>
            Selama kata sandinya sama, siapa pun yang tahu satu kata sandi itu bisa masuk sebagai akun
            manapun di grup itu (termasuk kalau kebetulan yang sama itu adalah admin). Beri tiap akun
            kata sandi yang berbeda-beda lewat kolom "Kata sandi" di tabel bawah.
          </div>
        </div>
      )}

      {users.some((x) => !ROLE_FLOW[x.role]) && (
        <div className="note" style={{ borderLeftColor: "#B03E28", background: "#FBEDEA" }}>
          <b style={{ display: "block", marginBottom: 3 }}>Ada akun dengan posisi yang sudah tidak dipakai</b>
          {users.filter((x) => !ROLE_FLOW[x.role]).map((x) => x.nama).join(", ")} — posisi ini pernah ada di
          sistem (misalnya Direktur Terkait atau Gudang / Inventory) tapi sudah dihapus. Untuk sementara akun
          ini otomatis diperlakukan seperti PIC saat masuk. Pilih posisi yang masih berlaku di tabel di bawah.
        </div>
      )}

      <div className="card">
        <h3>Daftar akun ({users.length})</h3>
        <div className="toolbar" style={{ marginBottom: 10 }}>
          <button className="btn ghost sm" onClick={() => setLihatSandi(!lihatSandi)}>
            {lihatSandi ? "Sembunyikan kata sandi" : "Tampilkan kata sandi"}</button>
        </div>
        <table className="lines">
          <thead><tr>
            <th style={{ width: "15%" }}>Pengguna</th><th style={{ width: "24%" }}>Nama</th>
            <th style={{ width: "23%" }}>Posisi</th><th style={{ width: "17%" }}>Kata sandi</th>
            <th style={{ width: "12%" }}>Status</th><th style={{ width: "9%" }} />
          </tr></thead>
          <tbody>
            {users.map((x, i) => (
              <tr key={x.u}>
                <td className="mono">{x.u}{x.u === sesi.u
                  ? <span style={{ fontSize: 10.5, color: "#66757C" }}> (Anda)</span> : null}</td>
                <td><input value={x.nama} onChange={(e) => ganti(i, { nama: e.target.value })} /></td>
                <td><select value={x.role} onChange={(e) => ganti(i, { role: e.target.value }, "Posisi diperbarui.")}>
                  {Object.entries(ROLES).map(([k, v]) => <option key={k} value={k}>{v}</option>)}</select></td>
                <td><input type={lihatSandi ? "text" : "password"} value={x.p}
                  style={x.aktif !== false && sandiKeAkun[String(x.p || "")] &&
                    sandiKeAkun[String(x.p || "")].length > 1
                    ? { borderColor: "#B03E28", background: "#FBEDEA" } : undefined}
                  onChange={(e) => ganti(i, { p: e.target.value })} /></td>
                <td><button className={"btn sm " + (x.aktif === false ? "ghost" : "ok")} style={{ width: "100%" }}
                  disabled={x.u === sesi.u}
                  onClick={() => ganti(i, { aktif: x.aktif === false },
                    x.aktif === false ? "Akun diaktifkan." : "Akun dinonaktifkan.")}>
                  {x.aktif === false ? "Nonaktif" : "Aktif"}</button></td>
                <td><button className="btn ghost sm" disabled={x.u === sesi.u}
                  onClick={() => konfirm(`Hapus akun ${x.u}?`,
                    "Approval dan verifikasi yang pernah diberikan tetap tersimpan atas namanya. Untuk orang yang sudah tidak menjabat, menonaktifkan lebih aman daripada menghapus.",
                    () => upd(users.filter((_, j) => j !== i), "Akun dihapus."))}>Hapus</button></td>
              </tr>
            ))}
            <tr>
              <td><input placeholder="username" value={akun.u}
                onChange={(e) => setAkun({ ...akun, u: e.target.value.replace(/\s/g, "").toLowerCase() })} /></td>
              <td><input placeholder="Nama lengkap" value={akun.nama}
                onChange={(e) => setAkun({ ...akun, nama: e.target.value })} /></td>
              <td><select value={akun.role} onChange={(e) => setAkun({ ...akun, role: e.target.value })}>
                {Object.entries(ROLES).map(([k, v]) => <option key={k} value={k}>{v}</option>)}</select></td>
              <td><input placeholder="kata sandi" value={akun.p}
                onChange={(e) => setAkun({ ...akun, p: e.target.value })} /></td>
              <td colSpan={2}><button className="btn sm" style={{ width: "100%" }}
                disabled={!akun.u.trim() || !akun.p.trim() || !akun.nama.trim() ||
                  users.some((x) => x.u === akun.u.trim())}
                onClick={() => {
                  upd([...users, { ...akun, u: akun.u.trim(), aktif: true }], "Akun ditambahkan.");
                  setAkun({ u: "", p: "", nama: "", role: "PIC" });
                }}>Tambah akun</button></td>
            </tr>
          </tbody>
        </table>
        <p style={{ fontSize: 12.5, color: "#66757C", margin: "12px 0 0", lineHeight: 1.5 }}>
          Nama pengguna harus unik dan tidak bisa diubah setelah dibuat, karena dipakai sebagai penanda sesi.
          Akun Anda sendiri tidak bisa dinonaktifkan atau dihapus dari layar ini, supaya tidak ada yang
          mengunci dirinya keluar.
        </p>
      </div>

      <div className="card">
        <h3>Catatan keamanan</h3>
        <p style={{ fontSize: 13, lineHeight: 1.55, margin: 0 }}>
          Kata sandi tersimpan apa adanya di perangkat yang membuka aplikasi, jadi bisa dibaca siapa pun yang
          membuka developer tools peramban. Login ini memisahkan wewenang antar posisi supaya alur kerja
          terjaga, bukan pengamanan tingkat perusahaan. Sampaikan ke seluruh pengguna agar tidak memakai
          kata sandi yang sama dengan sistem lain, terutama Odoo dan surel kantor.
        </p>
      </div>

      <div className="card">
        <h3>Posisi dan wewenangnya</h3>
        <div className="tablewrap">
          <table className="t">
            <thead><tr><th style={{ width: "30%" }}>Posisi</th><th>Wewenang utama</th>
              <th style={{ width: "12%", textAlign: "right" }}>Akun</th></tr></thead>
            <tbody>
              {Object.entries(ROLES).map(([k, v]) => (
                <tr key={k} style={{ cursor: "default" }}>
                  <td>{v}</td>
                  <td style={{ fontSize: 12.5, color: "#66757C" }}>
                    {(ROLE_FLOW[k] ? ROLE_FLOW[k].steps.slice(0, 2).map((x) => x[0]).join("; ") : "—")}</td>
                  <td className="mono" style={{ textAlign: "right" }}>
                    {users.filter((x) => x.role === k && x.aktif !== false).length}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </>
  );
}
